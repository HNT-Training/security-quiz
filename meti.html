<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-meti.json">
<link rel="apple-touch-icon" href="icon-meti.png">
<link rel="icon" type="image/png" href="icon-meti.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セキュ問題集 経産省">
<meta name="theme-color" content="#059669">
<title>経産省サイバーセキュリティ経営GL観点｜習熟問題集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --ng:#dc2626; --ng-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --sub:#9ca3af; --line:#374151;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --ok:#34d399; --ok-soft:#064e3b;
    --ng:#f87171; --ng-soft:#5f1e1e; --warn:#fbbf24; --warn-soft:#4a3b10;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.app{padding:18px 0 6px}
header.app h1{font-size:19px;font-weight:700}
header.app .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h2.sec{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode-btn{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn span{color:var(--sub);font-size:12px}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:12.5px;color:var(--sub)}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;border-radius:6px;padding:2.5px 8px;font-weight:600}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.asp{background:var(--warn-soft);color:var(--warn)}
.tag.ref{background:var(--line);color:var(--sub)}
.setsumon{font-size:15.5px;font-weight:700;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;transition:.15s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.judge{margin-top:14px;font-size:16px;font-weight:800}
.judge.ok{color:var(--ok)}
.judge.ng{color:var(--ng)}
/* explanation */
.expl{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ex h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex p{font-size:13.5px}
.ex.ito h4{color:var(--accent)}
.ex.risk h4{color:var(--ng)}
.ex.ans h4{color:var(--ok)}
.ex.alt h4{color:var(--warn)}
.ex.ev h4{color:var(--sub)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* result */
.score-big{font-size:42px;font-weight:800;text-align:center}
.score-sub{text-align:center;color:var(--sub);margin-bottom:16px}
table.catres{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.catres th,table.catres td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.catres td.num{text-align:right;white-space:nowrap}
.bar{background:var(--line);height:8px;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div style="padding-top:10px"><a href="./" style="color:#6b7280;font-size:12.5px;text-decoration:none">← 問題集一覧</a></div>
  <header class="app">
    <h1>経産省サイバーセキュリティ経営GL観点｜習熟問題集</h1>
    <div class="sub">セキュリティチェックシート（経産省サイバーセキュリティ経営ガイドライン観点・網羅版） をもとに自動生成した4択演習（全 <span id="totalItems"></span> 問）。設問の意図・リスク・対策・回答例を学びます。</div>
  </header>

  <!-- START SCREEN -->
  <div id="scrStart">
    <div class="card">
      <h2 class="sec">1. 出題観点を選ぶ</h2>
      <div class="modes" id="aspectBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">2. 出題カテゴリを選ぶ（複数選択可）</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="chipAll">すべて選択</button>
        <button class="chip" id="chipNone">すべて解除</button>
      </div>
      <div class="chips" id="catBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">3. 出題順・出題数</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ordChip sel" data-v="seq">項番どおり</button>
        <button class="chip ordChip" data-v="shuf">シャッフル</button>
      </div>
      <div class="row">
        <button class="chip cntChip sel" data-v="0">全問</button>
        <button class="chip cntChip" data-v="10">10問</button>
        <button class="chip cntChip" data-v="20">20問</button>
        <button class="chip cntChip" data-v="30">30問</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnStart">スタート</button>
      <span class="small" id="startInfo"></span>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="scrQuiz" class="hidden">
    <div class="topbar">
      <span class="pill">問題 <b id="qPos"></b> / <span id="qTotal"></span></span>
      <span class="pill">正解 <b id="qScore">0</b></span>
      <button class="btn ghost" id="btnQuit" style="padding:5px 14px;font-size:12.5px">中断して結果を見る</button>
    </div>
    <div class="progress"><i id="pbar" style="width:0%"></i></div>
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="setsumon" id="qSetsumon"></div>
      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="judge hidden" id="qJudge"></div>
      <div class="expl hidden" id="qExpl"></div>
      <div class="nav">
        <span></span>
        <button class="btn primary hidden" id="btnNext">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="scrResult" class="hidden">
    <div class="card">
      <div class="score-big" id="rScore"></div>
      <div class="score-sub" id="rSub"></div>
      <h2 class="sec">カテゴリ別の成績</h2>
      <table class="catres"><tbody id="rCats"></tbody></table>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnRetryWrong">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btnHome">最初の画面に戻る</button>
    </div>
  </div>

  <footer>学習用に自動生成された問題集です。選択肢の誤答は他の設問の解説文から引用しています。／ 出典: セキュリティチェックシート_経産省サイバーセキュリティ経営GL観点_網羅版_解説付き.xlsx</footer>
</div>

": "指示1", "q": "DX推進・新規事業の検討時に、セキュリティ確保を前提条件として組み込んでいますか。", "taiou": "新規プロジェクト・新サービス企画時にセキュリティ影響の確認（チェックリスト・レビュー会）を必須工程に組み込む。", "ito": "新しい取り組みが始まる時点でセキュリティが考慮される仕組みがあるか。", "risk_own": "リリース後に問題が発覚し、手戻り・事故・追加コストが発生する。", "risk_cli": "新サービス経由で取引先情報が不適切に扱われる。", "daitai": "重量級のプロセスが難しければ、企画承認時の簡易チェックリスト1枚から開始。", "shoseki": "プロジェクト管理規程（セキュリティレビュー工程）、レビュー実施記録。"}, {"no": 10, "cat": "1. 指示1：セキュリティポリシーの策定", "ref": "指示1", "q": "セキュリティポリシーの適用範囲（対象組織・対象者・対象資産）を明確に定めていますか。", "taiou": "ISO/IEC 27001認証を全社（または対象事業）で取得し、年次サーベイランス審査を受審。", "ito": "セキュリティマネジメントが第三者により客観的に検証されているか（または同等の仕組みが自主運用されているか）。", "risk_own": "対策水準を客観的に証明できず、取引条件・入札要件を満たせない場合がある。", "risk_cli": "取引先は個別に詳細確認を行う負担を負い、預託判断の根拠が弱くなる。", "daitai": "認証未取得でも、本チェックシートのような自己点検結果・内部監査結果の開示や、段階的な認証取得計画の提示で補完。", "shoseki": "認証登録証（範囲・有効期限）、適用宣言書、審査報告書。"}, {"no": 11, "cat": "1. 指示1：セキュリティポリシーの策定", "ref": "指示1", "q": "セキュリティ方針に基づく具体的な対策の実施計画（年度計画等）を策定していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 12, "cat": "1. 指示1：セキュリティポリシーの策定", "ref": "指示1", "q": "サイバーセキュリティに関する方針を、グループ会社・海外拠点にも展開していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 13, "cat": "2. 指示2：リスク管理体制の構築", "ref": "指示2", "q": "サイバーセキュリティリスクの管理体制（責任者・担当部門・役割分担）を構築していますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として to": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 23, "cat": "2. 指示2：リスク管理体制の構築", "ref": "指示2", "q": "組織内にセキュリティに関する相談・報告を受け付ける窓口を設けていますか。", "taiou": "「気づいたら30分以内に情シスへ」等の報告ルールと窓口（メール・電話・チャット）を全従業員に周知。報告者を非難しない方針を明示。", "ito": "従業員が異変に気づいた時、ためらわず・すぐに報告される文化と経路があるか。", "risk_own": "報告の遅れ・隠蔽により対応開始が遅れ、被害と法的リスクが拡大する。", "risk_cli": "預託情報に関わる事故の把握・通知が遅れる。", "daitai": "窓口一本化が難しければ、上長経由でも即日で情シスに届くエスカレーションルールを規定。", "shoseki": "報告ルールの周知資料（イントラ掲示等）、報告受付の記録、教育資料。"}, {"no": 24, "cat": "2. 指示2：リスク管理体制の構築", "ref": "指示2", "q": "リスク管理体制が機能しているかを定期的に点検・見直ししていますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 25, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "サイバーセキュリティ対策のための予算を継続的に確保していますか。", "taiou": "年度予算にセキュリティ対策費（ツール・教育・診断・人件費）を計上し、経営層が承認。", "ito": "対策が掛け声だけでなく、実行に必要なヒト・カネが継続的に手当てされているか。", "risk_own": "対策が計画倒れとなり、老朽化した対策のまま脅威の変化に追従できない。", "risk_cli": "取引先が期待する対策水準を維持できず、契約上の要求事項を満たせなくなる。", "daitai": "低コストの公的支援（IPA相談窓口・お助け隊サービス）や優先度を絞った段階的投資で補完。", "shoseki": "年度予算書のセキュリティ関連項目、投資決裁記録、対策実施計画。"}, {"no": 26, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "セキュリティ対策を担う人材の確保・配置を計画的に行っていますか。", "taiou": "セキュリティ担当者（兼務含む）を指名し、外部研修・資格取得（情報処理安全確保支援士等）を支援。", "ito": "対策を実務として担える人材が組織内に確保・育成されているか。", "risk_own": "対策・インシデント対応が特定個人に依存し、退職・不在で機能不全となる（属人化リスク）。", "risk_cli": "専門的な対応（事故調査・取引先への技術的説明）ができず、対応品質が低下する。", "daitai": "外部SOC・MSS・顧問等の外部リソース活用で不足を補完し、内製は段階的に育成。", "shoseki": "育成計画、研修受講記録、資格保有者一覧、外部委託契約書。"}, {"no": 27, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "セキュリティ担当者に対する教育・資格取得等の育成投資を行っていますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 28, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "全従業員に対するセキュリティ教育・訓練の計画を立て、実施していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 29, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "自社で対応困難な領域について、外部の専門ベンダー・サービスの活用を検討・実施していますか。", "taiou": "セキュリティ担当者（兼務含む）を指名し、外部研修・資格取得（情報処理安全確保支援士等）を支援。", "ito": "対策を実務として担える人材が組織内に確保・育成されているか。", "risk_own": "対策・インシデント対応が特定個人に依存し、退職・不在で機能不全となる（属人化リスク）。", "risk_cli": "専門的な対応（事故調査・取引先への技術的説明）ができず、対応品質が低下する。", "daitai": "外部SOC・MSS・顧問等の外部リソース活用で不足を補完し、内製は段階的に育成。", "shoseki": "育成計画、研修受講記録、資格保有者一覧、外部委託契約書。"}, {"no": 30, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "セキュリティ対策を「投資」として捉え、経営会議等で対策状況と効果を確認していますか。", "taiou": "情報セキュリティ委員会を四半期開催し、対策状況・インシデント・リスクを経営層へ定期報告。経営層が方針・投資を承認。", "ito": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 31, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "セキュリティ人材のキャリアパス・処遇について検討していますか。", "taiou": "セキュリティ担当者（兼務含む）を指名し、外部研修・資格取得（情報処理安全確保支援士等）を支援。", "ito": "対策を実務として担 eki": "育成計画、研修受講記録、資格保有者一覧、外部委託契約書。"}, {"no": 36, "cat": "3. 指示3：資源（予算・人材等）の確保", "ref": "指示3", "q": "IT予算に占めるセキュリティ予算の割合等、投資規模の妥当性を検討していますか。", "taiou": "年度予算にセキュリティ対策費（ツール・教育・診断・人件費）を計上し、経営層が承認。", "ito": "対策が掛け声だけでなく、実行に必要なヒト・カネが継続的に手当てされているか。", "risk_own": "対策が計画倒れとなり、老朽化した対策のまま脅威の変化に追従できない。", "risk_cli": "取引先が期待する対策水準を維持できず、契約上の要求事項を満たせなくなる。", "daitai": "低コストの公的支援（IPA相談窓口・お助け隊サービス）や優先度を絞った段階的投資で補完。", "shoseki": "年度予算書のセキュリティ関連項目、投資決裁記録、対策実施計画。"}, {"no": 37, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "守るべき情報資産（事業上重要な情報・システム）を特定していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 38, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "自社の事業に影響を与えうるサイバー攻撃の脅威・被害シナリオを想定していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 39, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "情報資産に対するリスクアセスメントを定期的に実施していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 40, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "識別したリスクに対し、低減・回避・移転（保険等）・受容の方針を定めた対応計画を策定していますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 41, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "サイバー保険の活用や外部委託によるリスク移転を検討していますか。", "taiou": "サイバー保険（事故対応費用・賠償・利益補償）に加入し、補償範囲と免責事項を確認。保険付帯の事故対応サービスも把握。", "ito": "事故時の金銭的損失と対応費用への備えがあるか。", "risk_own": "フォレンジック・通知・賠償等の突発費用（数百万〜数億円規模）を全額自己負担することになる。", "risk_cli": "賠償資力の不足により、取引先の損害が十分に補償されない。", "daitai": "未加入でも、想定損害額の試算と対応費用の予備費確保・専門業者の緊急連絡先確保で最低限の備えは可能。", "shoseki": "保険証券（補償内容）、付帯サービスの資料。"}, {"no": 42, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "リスク対応計画の実施状況を経営層が確認していますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 43, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "個人情報・営業秘密等、法令・契約で保護が求められる情報のリスクを特に考慮していますか。", "taiou": "個人情報保護規程を整備し、取扱状況の台帳（保有個人データ管理簿）を維持。安全管理措置・第三者提供・保存期間のルールを運用。", "ito": "個人情報保護法の求める安全管理措置・手続が、実務として運用されているか。", "risk_own": "法令違反による行政処分・損害賠償・漏えい時の報告義務違反が発生する。", "risk_cli": "取引先から預かった個人データの事故で、取引先自身が本人・当局対応を迫られる。", "daitai": "個人情報保護委員会公表のガイドライン・中小企業向けチェックリストに沿った最小限の体制から整備。", "shoseki": "個人情報保護規程、個人データ管理台帳、委託先監督の記録、社内点検記録。"}, {"no": 44, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "リスクアセスメントの結果を文書化し、経営層と共有していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 45, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "事業・システム環境の変化（クラウド移行、M&A、新拠点等）の際にリスクを再評価していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 46, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "残留リスクを明確にし、経営層が受容の判断をしていますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 47, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "守るべき情報の格付け（機密区分）と取扱いルールを定めていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 48, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "個人情報・営業秘密等の重要情報の保管場所・保管方法を把握していますか。", "taiou": "個人情報保護規程を整備し、取扱状況の台帳（保有個人データ管理簿）を維持。安全管理措置・第三者提供・保存期間のルールを運用。", "ito": "個人情報保護法の求める安全管理措置・手続が、実務として運用されているか。", "risk_own": "法令違反による行政処分・損害賠償・漏えい時の報告義務違反が発生する。", "risk_cli": "取引先から預かった個人データの事故で、取引先自身が本人・当局対応を迫られる。", "daitai": "個人情報保護委員会公表のガイドライン・中小企業向けチェックリストに沿った最小限の体制から整備。", "shoseki": "個人情報保護規程、個人データ管理台帳、委託先監督の記録、社内点検記録。"}, {"no": 49, "cat": "4. 指示4：リスクの把握とリスク対応計画の策定", "ref": "指示4", "q": "IT環境の変化（クラウド利用拡大、OT/IoT機器の接続等）に伴う新たなリスクを把握していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 50, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "多層防御の考え方に基づき、防御策（アクセス制御、暗号化、マルウェア対策等）を導入していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 51, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "重要システム・データへのアクセス制御と認証強化（多要素認証等）を実施していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 52, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "OS・ソフトウェアの脆弱性対策（パッチ適用・脆弱性診断）を継続的に実施していますか。", "taiou": "外部公開システムに年1回以上の脆弱性診断を実施し、指摘の重大度に応じた期限で改修。大規模改修時は都度診断。", "ito": "外部の攻撃者視点で自社の弱点を定期的に検証し、改修まで完了させているか。", "risk_own": "気づいていない弱点を攻撃者に先に発見され、Webサイト改ざん・侵入を許す。", "risk_cli": "公開システム経由で取引先関連情報が漏えいする。", "daitai": "商用診断が難しければ、無償ツール（OWASP ZAP等）による自主スキャン＋クラウドの標準診断機能で補完。", "shoseki": "診断報告書、指摘事項の改修記録（再診断結果）。"}, {"no": 53, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "攻撃の検知の仕組み（ログ監視、EDR、SOC等）を導入していますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 54, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "検知した事象を分析し、対応につなげる体制・手順がありますか。", "taiou": "SIEM・監視サービス（SOC）で不審なログイン・大量データ転送等のアラートを設定し、検知時の対応手順を整備。", "ito": "記録を「取るだけ」でなく、異常をタイムリーに発見し対応につなげる監視があるか。", "risk_own": "侵入から発覚まで数か月を要し（潜伏期間の長期化）、被害が静かに拡大する。", "risk_cli": "預託情報の窃取に長期間気づかず、取引先への通知が大幅に遅れる。", "daitai": "SOC委託が難しければ、主要システムの失敗ログイン・管理者操作に絞ったアラート設定から開始。", "shoseki": "監視設計書（検知ルール）、SOC契約書、アラート対応記録。"}, {"no": 55, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "クラウドサービス等の外部サービス利用時のセキュリティ対策基準を定めていますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 56, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "テレワーク・モバイル環境のセキュリティ対策を講じていますか。", "taiou": "テレワーク規程（VPN必須・公衆Wi-Fi禁止・家族との画面共有防止等）を定め、貸与端末のみで業務を許可。", "ito": "オフィス外の環境でも社内と同等の保護水準が維持される取り決めと技術的手当てがあるか。", "risk_own": "自宅・外出先の無防備な環境が侵入経路となり、のぞき見・家庭内共有機器経由の漏えいも起きる。", "risk_cli": "取引先情報が保護されていないネットワーク・環境で扱われる。", "daitai": "VDI・クラウドサービス化により端末にデータを残さない構成で環境リスクを低減。", "shoseki": "テレワーク規程、VPN利用記録、貸与端末一覧。"}, {"no": 57, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "システムの導入・開発時にセキュリティを組み込む（セキュリティ・バイ・デザイン）方針がありますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 58, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "IT資産（ハードウェア・ソフトウェア・アカウント）を棚卸し、把握していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 59, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "重要システムのログを取得・保管し、必要時に調査できる状態にしていますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 60, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "サポート終了製品・未管理機器（シャドーIT）の利用を統制していますか。", "taiou": "OS・ソフトの保守期限を台帳管理し、EOL前に更改計画を立てて移行。やむを得ない継続利用は分離・監視を条件に期限付き承認。", "ito": "修正プログラムが提供されない機器・ソフトが、管理されないまま使われ続けていないか。", "risk_own": "EOL製品の脆弱性は恒久的に修正されず、時間とともに侵入リスクが増大し続ける。", "risk_cli": "EOL機器経由の侵入で預託情報が危険にさらされる。", "daitai": "即時更改が無理なら、ネットワーク分離・インターネット遮断・仮想パッチ（IPS）で隔離運用。", "shoseki": "資産台帳（サポート期限付き）、更改計画、リスク受容の承認記録。"}, {"no": 61, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "内部不正への対策（アクセス権の最小化、操作ログ、職務分離等）を講じていますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 62, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "物理的セキュリティ対策（入退室管理・施錠管理等）を実施していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 63, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "重要データの暗号化（保存時・通信時）を実施していますか。", "taiou": "重要データを保存するDB・ファイルサーバ・クラウドストレージで暗号化機能を有効化し、鍵は別管理。", "ito": "保存場所ごと盗まれた・不正アクセスされた場合でも情報が読めない状態か。", "risk_own": "サーバ侵入・媒体盗難時に、データがそのまま読める形で流出する。", "risk_cli": "預託された個人情報・機密情報が平文のまま漏えいし、被害が最大化する。", "daitai": "全面暗号化が難しければ、特に重要なファイルの暗号化（パスワード付き圧縮ではなく適切なツール）から開始。", "shoseki": "暗号化設定の一覧（対象システム・方式）、クラウドの暗号化設定画面。"}, {"no": 64, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "標的型攻撃メール・フィッシング等への技術的対策（メールフィルタ、送信ドメイン認証等）を導入していますか。", "taiou": "迷惑メールフィルタ・添付ファイル検査を導入し、SPF/DKIM/DMARCを設定。なりすましメールの検知を強化。", "ito": "攻撃の最多経路であるメールについて、人の注意力に頼る前の技術的な防波堤があるか。", "risk_own": "大量のフィッシング・ウイルスメールが従業員に直接届き、開封事故の確率が高止まりする。", "risk_cli": "自社ドメインをかたるなりすましメールで取引先が攻撃される（DMARC未設定の場合）。", "daitai": "メールサービス標準の保護機能（Microsoft 365/Google Workspace）の有効化・設定強化から着手。", "shoseki": "メールセキュリティ製品の設定、SPF/DKIM/DMARCのDNSレコード、検疫ログ。"}, {"no": 65, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "OT機器・IoT機器等、情報システム以外の機器もセキュリティ対策の対象に含めていますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 66, "cat": "5. 指示5：リスクに対応するための仕組みの構築", "ref": "指示5", "q": "重要システムの操作ログ・アクセスログを取得し、不正の検知・事後調査に利用できるようにしていますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 67, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "セキュリティ対策の実施状況を定期的に評価・見直しするPDCAサイクルを回していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 68, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "内部監査・自己点検等により対策状況を確認していますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 69, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "監査・点検結果と改善状況を経営層に報告していますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 70, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "対策状況について、外部の評価・認証（ISMS認証、セキュリティ格付等）を活用していますか。", "taiou": "ISO/IEC 27001認証を全社（または対象事業）で取得し、年次サーベイランス審査を受審。", "ito": "セキュリティマネジメントが第三者により客観的に検証されているか（または同等の仕組みが自主運用されているか）。", "risk_own": "対策水準を客観的に証明できず、取引条件・入札要件を満たせない場合がある。", "risk_cli": "取引先は個別に詳細確認を行う負担を負い、預託判断の根拠が弱くなる。", "daitai": "認証未取得でも、本チェックシートのような自己点検結果・内部監査結果の開示や、段階的な認証取得計画の提示で補完。", "shoseki": "認証登録証（範囲・有効期限）、適用宣言書、審査報告書。"}, {"no": 71, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "有価証券報告書・統合報告書・自社サイト等で、セキュリティへの取り組みを開示していますか。", "taiou": "セキュリティへの取り組み（体制・認証・主要対策）をWebサイト・会社案内・セキュリティホワイトペーパーで開示し、照会対応の窓口を明確化。", "ito": "ステークホルダーへの説明責任を果たし、取引先の確認負担を減らす姿勢があるか。", "risk_own": "取引先評価・入札のたびに個別対応が発生し、信頼獲得の機会も逃す。", "risk_cli": "取引先がリスク評価に必要な情報を得られず、取引判断が遅れる。", "daitai": "詳細開示が難しければ、認証取得状況と本チェックシートの標準回答集の整備から開始（トラストセンター型）。", "shoseki": "公開ページ・ホワイトペーパー、標準回答集、開示承認の記録。"}, {"no": 72, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "指摘事項・課題の是正を計画的に実施し、完了まで追跡していますか。", "taiou": "監査・点検・インシデントで見つかった不備に是正計画（担当・期限）を立て、完了確認まで管理表で追跡。", "ito": "見つかった問題が放置されず、確実に直り切る管理があるか。", "risk_own": "既知の不備が放置され、同じ指摘・同じ事故が繰り返される。", "risk_cli": "取引先監査での指摘事項が改善されず、取引継続の評価に影響する。", "daitai": "専用の仕組みがなくても、指摘事項一覧（Excel）と月次の進捗確認で十分機能する。", "shoseki": "是正処置管理表、完了報告・有効性確認の記録。"}, {"no": 73, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "対策状況を測る指標（KPI等）を定めて定期的にモニタリングしていますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 74, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "ステークホルダー（株主・顧客・取引先）からのセキュリティに関する照会に回答できる体制がありますか。", "taiou": "顧客・株主・規制当局・委託先等の利害関係者と、自社が依存する／自社に依存される重要なサービス・能力を一覧化し、リスク検討の前提として文書化。", "ito": "セキュリティの取り組みが自社の事業環境・関係者の期待を踏まえて設計されているか（前提の把握）。", "risk_own": "重要な依存関係・要求事項の見落としにより、対策の優先順位を誤り、想定外の影響（外部サービス停止等）を受ける。", "risk_cli": "取引先が自社に依存している業務の重要性を認識せず、保護・継続の手当てが不足する。", "daitai": "網羅的な分析が難しければ、主要取引先と依存する主要ITサービスの一覧化から開始。", "shoseki": "ステークホルダー・依存関係の一覧、事業環境分析の資料、リスクマネジメント方針の前提記述。"}, {"no": 75, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "脆弱性診断・ペネトレーションテスト等により、対策の有効性を定期的に検証していますか。", "taiou": "外部公開システムに年1回以上の脆弱性診断を実施し、指摘の重大度に応じた期限で改修。大規模改修時は都度診断。", "ito": "外部の攻撃者視点で自社の弱点を定期的に検証し、改修まで完了させているか。", "risk_own": "気づいていない弱点を攻撃者に先に発見され、Webサイト改ざん・侵入を許す。", "risk_cli": "公開システム経由で取引先関連情報が漏えいする。", "daitai": "商用診断が難しければ、無償ツール（OWASP ZAP等）による自主スキャン＋クラウドの標準診断機能で補完。", "shoseki": "診断報告書、指摘事項の改修記録（再診断結果）。"}, {"no": 76, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "検証・監査の結果を踏まえ、対策計画（予算・体制含む）を見直していますか。", "taiou": "年度予算にセキュリティ対策費（ツール・教育・診断・人件費）を計上し、経営層が承認。", "ito": "対策が掛け声だけでなく、実行に必要なヒト・カネが継続的に手当てされているか。", "risk_own": "対策が計画倒れとなり、老朽化した対策のまま脅威の変化に追従できない。", "risk_cli": "取引先が期待する対策水準を維持できず、契約上の要求事項を満たせなくなる。", "daitai": "低コストの公的支援（IPA相談窓口・お助け隊サービス）や優先度を絞った段階的投資で補完。", "shoseki": "年度予算書のセキュリティ関連項目、投資決裁記録、対策実施計画。"}, {"no": 77, "cat": "6. 指示6：PDCAサイクルの実施と対策の開示", "ref": "指示6", "q": "サイバーセキュリティに関する開示内容について、経営層が承認するプロセスがありますか。", "taiou": "情報セキュリティ委員会を四半期開催し、対策状況・インシデント・リスクを経営層へ定期報告。経営層が方針・投資を承認。", "ito": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 78, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "インシデント発生時の緊急対応体制（CSIRT等）を整備していますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 79, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "インシデント発生時の社内外の連絡先・報告経路を整理し、周知していますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 80, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "初動対応（被害範囲の特定、拡大防止、証拠保全）の手順を文書化していますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 81, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "経営層への報告基準（エスカレーション基準）を定めていますか。", "taiou": "インシデントの重大度基準（影響範囲・情報種別・停止時間）を定め、レベルに応じた対応体制・経営層への報告基準を規定。", "ito": "事故の大きさを迅速に見極め、適切な体制・報告先につなぐ判断基準があるか。", "risk_own": "軽微な事象への過剰対応と重大事象の過小評価が混在し、経営報告も遅れる。", "risk_cli": "取引先に関わる重大事象が現場止まりとなり、通知判断が遅れる。", "daitai": "精緻な基準が難しければ、「個人情報・取引先情報が関わる場合は即時上位報告」の単純ルールから開始。", "shoseki": "重大度判定基準、エスカレーションフロー、判定記録。"}, {"no": 82, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "監督官庁・警察・個人情報保護委員会・取引先等への報告・公表の判断手順を定めていますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", "shoseki": "報告・通知手順書、報告書式のひな形、（発生時）報告書控え。"}, {"no": 83, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "インシデント対応の実践的な演習・訓練を定期的に実施していますか。", "taiou": "年1回、ランサムウェア感染等を想定した机上演習を実施し、連絡・判断・復旧の流れを確認。結果を手順書に反映。", "ito": "緊急時対応の手順・体制が「文書があるだけ」でなく、実際に機能するかを訓練で検証しているか。", "risk_own": "実際のインシデント時に手順が機能せず、初動遅延により被害・停止期間が拡大する。", "risk_cli": "復旧遅延により取引先向けサービス・納品が長期間停止し、連絡も混乱する。", "daitai": "小規模でも年1回の読み合わせ・ウォークスルーで代替可能。外部ベンダーの演習サービス利用も有効。", "shoseki": "演習計画書・シナリオ、実施報告書、発見された課題と改善のフォロー記録。"}, {"no": 84, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "外部の専門機関（セキュリティベンダー、フォレンジック事業者等)と緊急時に支援を受けられる体制（契約・連絡先）を整えていますか。", "taiou": "インシデント時のログ・端末の保全手順（電源断の判断・ディスクイメージ取得等)を定め、必要時は専門業者へ依頼できる体制を確保。", "ito": "事故調査・法的対応・保険請求に耐える証拠を壊さず残せるか。", "risk_own": "証拠が上書き・消失し、原因究明・責任範囲の立証・警察対応ができない。", "risk_cli": "取引先への影響有無を証拠に基づいて説明できない。", "daitai": "自社で困難なら、初動での「触らない・切らない・専門家に連絡」の原則周知と業者連絡先の確保のみでも有効。", "shoseki": "証拠保全手順書、フォレンジック業者との契約・連絡先、（発生時）保全記録。"}, {"no": 85, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "インシデント発生時の証拠保全（ログ・端末の保全）の手順を定めていますか。", "taiou": "インシデント時のログ・端末の保全手順（電源断の判断・ディスクイメージ取得等)を定め、必要時は専門業者へ依頼できる体制を確保。", "ito": "事故調査・法的対応・保険請求に耐える証拠を壊さず残せるか。", "risk_own": "証拠が上書き・消失し、原因究明・責任範囲の立証・警察対応ができない。", "risk_cli": "取引先への影響有無を証拠に基づいて説明できない。", "daitai": "自社で困難なら、初動での「触らない・切らない・専門家に連絡」の原則周知と業者連絡先の確保のみでも有効。", "shoseki": "証拠保全手順書、フォレンジック業者との契約・連絡先、（発生時）保全記録。"}, {"no": 86, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "被害を受けた場合の顧客・取引先への通知・公表の基準と手順を定めていますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", "shoseki": "報告・通知手順書、報告書式のひな形、（発生時）報告書控え。"}, {"no": 87, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "夜間・休日を含むインシデント検知時の連絡体制（オンコール等）を整えていますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 88, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "インシデントの種類・重大度に応じた対応マニュアル（初動対応手順書）を整備していますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 89, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "訓練・演習の結果を踏まえて、対応体制・手順を見直していますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 90, "cat": "7. 指示7：インシデント発生時の緊急対応体制の整備", "ref": "指示7", "q": "グループ会社・委託先で発生したインシデントの報告を受ける体制を整えていますか。", "taiou": "「気づいたら30分以内に情シスへ」等の報告ルールと窓口（メール・電話・チャット）を全従業員に周知。報告者を非難しない方針を明示。", "ito": "従業員が異変に気づいた時、ためらわず・すぐに報告される文化と経路があるか。", "risk_own": "報告の遅れ・隠蔽により対応開始が遅れ、被害と法的リスクが拡大する。", "risk_cli": "預託情報に関わる事故の把握・通知が遅れる。", "daitai": "窓口一本化が難しければ、上長経由でも即日で情シスに届くエスカレーションルールを規定。", "shoseki": "報告ルールの周知資料（イントラ掲示等）、報告受付の記録、教育資料。"}, {"no": 91, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "サイバー攻撃による業務停止を想定した事業継続計画（BCP）・復旧計画を策定していますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 92, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "重要システムの復旧優先順位と目標復旧時間（RTO）を定めていますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 93, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "重要データのバックアップを取得し、ランサムウェア被害も想定した保管（オフライン・遠隔地等）をしていますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 94, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "バックアップからの復旧手順を整備し、復旧訓練を実施していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 95, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "復旧時の代替手段（代替システム・手作業運用等）を検討していますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの リオ、実施報告書、発見された課題と改善のフォロー記録。"}, {"no": 100, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "業務停止時の代替手段（代替設備・手作業運用等）をあらかじめ検討していますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 101, "cat": "8. 指示8：被災からの復旧体制の整備", "ref": "指示8", "q": "復旧時に顧客・取引先へ提供すべき情報・連絡手順を定めていますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 102, "cat": "9. 指示9：サプライチェーン全体の状況把握及び対策", "ref": "指示9", "q": "業務委託先・取引先を含むサプライチェーン全体のセキュリティ対策状況を把握していますか。", "taiou": "委託先・調達先・利用サービスを含むサプライチェーン全体のリスクを整理し、重要度に応じた管理策（評価・契約・監視）を適用。", "ito": "自社だけでなく、つながる先を含めた全体でセキュリティを確保する視点があるか。", "risk_own": "取引網の弱点経由の攻撃（サプライチェーン攻撃）を受け、自社対策だけでは防げない事故が起きる。", "risk_cli": "自社がサプライチェーンの弱点となり、取引先全体へ被害を波及させる。", "daitai": "全体管理が難しければ、情報を預ける先・システム接続のある先に絞った管理から開始。", "shoseki": "サプライチェーンリスク管理方針、委託先・調達先の一覧と重要度評価、管理策の適用状況。"}, {"no": 103, "cat": "9. 指示9：サプライチェーン全体の状況把握及び対策", "ref": "指示9", "q": "委託先選定時にセキュリティ対策状況を評価する基準・手続を定めていますか。", "taiou": "委託先選定時にセキュリティチェックシート・認証取得状況等で対策水準を評価し、基準を満たす先とのみ契約。", "ito": "情報を預ける相手の安全性を、契約前に確認する仕組みがあるか。", "risk_own": "対策の弱い委託先経由の漏えい（サプライチェーン事故）が発生し、委託元としての管理責任を問われる。", "risk_cli": "取引先から預かった情報を再委託先経由で漏えいさせ、契約違反となる。", "daitai": "詳細評価が難しければ、認証（ISMS・Pマーク）の有無確認＋簡易チェックリストで最低限を担保。", "shoseki": "委託先選定基準、評価記録（チェックシート回収結果）、委託先一覧。"}, {"no": 104, "cat": "9. 指示9：サプライチェーン全体の状況把握及び対策", "ref": "指示9", "q": "委託契約においてセキュリティ要求事項（安全管理措置・事故時対応・再委託制限等）を明確にしていますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく const ASPECTS = [
  {k:'ito',      label:'設問の意図',       desc:'「何が求められているのか」を当てる', stem:'この設問が確認しようとしている意図（何が求められているのか）として、最も適切なものはどれですか？'},
  {k:'risk_own', label:'自社へのリスク',   desc:'未実施の場合に自社に生じるリスクを当てる', stem:'この対策を実施していない場合に「自社」に生じるリスクとして、最も適切なものはどれですか？'},
  {k:'risk_cli', label:'取引先へのリスク', desc:'未実施の場合に取引先へ与えるリスクを当てる', stem:'この対策を実施していない場合に「取引先」へ与えるリスクとして、最も適切なものはどれですか？'},
  {k:'taiou',    label:'対策・回答例',     desc:'具体的な対応例（回答の書き方の軸）を当てる', stem:'この設問に対する具体的な対応例（回答例の軸となる取り組み）として、最も適切なものはどれですか？'},
  {k:'mix',      label:'ミックス',         desc:'上の4観点からランダムに出題', stem:''}
];

let selAspect='ito', selCats=new Set(DATA.cats), selOrd='seq', selCnt=0;
let queue=[], idx=0, score=0, results=[]; // results: {item, aspect, correct}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start screen ---------- */
$('totalItems').textContent=DATA.items.length;
const aspectBox=$('aspectBox');
ASPECTS.forEach(a=>{
  const b=document.createElement('button');
  b.className='mode-btn'+(a.k===selAspect?' sel':'');
  b.innerHTML='<b>'+a.label+'</b><span>'+a.desc+'</span>';
  b.onclick=()=>{selAspect=a.k;[...aspectBox.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();};
  aspectBox.appendChild(b);
});
const catBox=$('catBox');
DATA.cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip sel'; b.textContent=c.replace(/^\d+\.\s*/,'');
  b.onclick=()=>{ if(selCats.has(c)){selCats.delete(c);b.classList.remove('sel');} else {selCats.add(c);b.classList.add('sel');} updateInfo(); };
  catBox.appendChild(b);
});
$('chipAll').onclick=()=>{selCats=new Set(DATA.cats);[...catBox.children].forEach(c=>c.classList.add('sel'));updateInfo();};
$('chipNone').onclick=()=>{selCats.clear();[...catBox.children].forEach(c=>c.classList.remove('sel'));updateInfo();};
document.querySelectorAll('.ordChip').forEach(b=>b.onclick=()=>{selOrd=b.dataset.v;document.querySelectorAll('.ordChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
document.querySelectorAll('.cntChip').forEach(b=>b.onclick=()=>{selCnt=+b.dataset.v;document.querySelectorAll('.cntChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();});
function pool(){return DATA.items.filter(i=>selCats.has(i.cat));}
function updateInfo(){
  const n=pool().length, m=selCnt>0?Math.min(selCnt,n):n;
  $('startInfo').textContent='対象 '+n+' 問中 '+m+' 問を出題します';
  $('btnStart').disabled=n===0;
}
updateInfo();

/* ---------- question building ---------- */
function buildQueue(items){
  return items.map(it=>{
    const asp = selAspect==='mix' ? ASPECTS[Math.floor(Math.random()*4)].k : selAspect;
    return {item:it, aspect:asp};
  });
}
function makeOptions(q){
  const f=q.aspect, correct=q.item[f];
  const others=DATA.items.filter(i=>i!==q.item && i[f] && i[f]!==correct);
  const otherCat=others.filter(i=>i.cat!==q.item.cat);
  const src=otherCat.length>=3?otherCat:others;
  const picked=shuffle(src.slice()).slice(0,3).map(i=>i[f]);
  return shuffle([{t:correct,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- screens ---------- */
function show(id){['scrStart','scrQuiz','scrResult'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

$('btnStart').onclick=()=>{
  let items=pool();
  if(selOrd==='shuf') items=shuffle(items.slice()); else items=items.slice();
  if(selCnt>0){ items=(selOrd==='shuf'?items:shuffle(items.slice())).slice(0,selCnt); if(selOrd==='seq') items.sort((a,b)=>a.no-b.no); }
  queue=buildQueue(items); idx=0; score=0; results=[];
  startQuiz();
};
function startQuiz(){ $('qTotal').textContent=queue.length; $('qScore').textContent=0; show('scrQuiz'); render(); }

function render(){
  const q=queue[idx], asp=ASPECTS.find(a=>a.k===q.aspect);
  $('qPos').textContent=idx+1;
  $('pbar').style.width=(idx/queue.length*100)+'%';
  $('qMeta').innerHTML=
    '<span class="tag cat">'+esc(q.item.cat)+'</span>'+
    '<span class="tag asp">出題観点：'+asp.label+'</span>'+
    (q.item.ref?'<span class="tag ref">'+esc(DATA.refLabel)+'：'+esc(q.item.ref)+'</span>':'');
  $('qSetsumon').textContent='設問　'+q.item.q;
  $('qStem').textContent='Q'+(idx+1)+'. '+asp.stem;
  const opts=makeOptions(q), box=$('qOpts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mark">'+labels[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=()=>answer(b,o,opts,box);
    box.appendChild(b);
  });
  $('qJudge').classList.add('hidden');
  $('qExpl').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnNext').textContent = idx===queue.length-1 ? '結果を見る →' : '次の問題 →';
}

function answer(btn,opt,opts,box){
  [...box.children].forEach((b,i)=>{ b.disabled=true; if(opts[i].ok) b.classList.add('correct'); });
  if(!opt.ok) btn.classList.add('wrong');
  if(opt.ok) score++;
  $('qScore').textContent=score;
  results.push({item:queue[idx].item, aspect:queue[idx].aspect, correct:opt.ok});
  const j=$('qJudge');
  j.textContent=opt.ok?'○ 正解！':'× 不正解';
  j.className='judge '+(opt.ok?'ok':'ng');
  j.classList.remove('hidden');
  showExpl(queue[idx].item);
  $('btnNext').classList.remove('hidden');
}

function showExpl(it){
  const e=$('qExpl');
  e.innerHTML=
    '<div class="ex ito"><h4>💡 設問の意図（何が求められているのか）</h4><p>'+esc(it.ito)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（自社）</h4><p>'+esc(it.risk_own)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（取引先）</h4><p>'+esc(it.risk_cli)+'</p></div>'+
    '<div class="ex ans"><h4>✅ 具体的な対策・回答例</h4><p>'+esc(it.taiou)+'</p></div>'+
    (it.daitai?'<div class="ex alt"><h4>🔁 実施していない場合の代替策</h4><p>'+esc(it.daitai)+'</p></div>':'')+
    (it.shoseki?'<div class="ex ev"><h4>📎 証跡を求められた場合の資料例</h4><p>'+esc(it.shoseki)+'</p></div>':'');
  e.classList.remove('hidden');
}

$('btnNext').onclick=()=>{ idx++; if(idx>=queue.length) finish(); else render(); };
$('btnQuit').onclick=()=>{ if(results.length===0){show('scrStart');return;} finish(); };

function finish(){
  const n=results.length;
  $('pbar').style.width='100%';
  $('rScore').textContent=score+' / '+n+' 問正解';
  const pct=n?Math.round(score/n*100):0;
  $('rSub').textContent='正答率 '+pct+'%'+(pct===100?'　全問正解です！':pct>=80?'　あと少しで完璧です':'　解説を読み返して再挑戦しましょう');
  const byCat={};
  results.forEach(r=>{ const c=r.item.cat; byCat[c]=byCat[c]||{ok:0,n:0}; byCat[c].n++; if(r.correct) byCat[c].ok++; });
  const tb=$('rCats'); tb.innerHTML='';
  Object.keys(byCat).forEach(c=>{
    const v=byCat[c], p=Math.round(v.ok/v.n*100);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c)+'</td><td class="num">'+v.ok+'/'+v.n+'</td><td style="width:120px"><div class="bar"><i style="width:'+p+'%"></i></div></td>';
    tb.appendChild(tr);
  });
  $('btnRetryWrong').style.display = results.some(r=>!r.correct) ? '' : 'none';
  show('scrResult');
}
$('btnRetryWrong').onclick=()=>{
  const wrong=results.filter(r=>!r.correct);
  queue=wrong.map(r=>({item:r.item,aspect:r.aspect}));
  idx=0;score=0;results=[];
  startQuiz();
};
$('btnHome').onclick=()=>show('scrStart');
</script>
</body>
</html>
