<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-nist.json">
<link rel="apple-touch-icon" href="icon-nist.png">
<link rel="icon" type="image/png" href="icon-nist.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セキュ問題集 NIST">
<meta name="theme-color" content="#ea580c">
<title>NIST CSF 2.0観点｜習熟問題集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --ng:#dc2626; --ng-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --sub:#9ca3af; --line:#374151;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --ok:#34d399; --ok-soft:#064e3b;
    --ng:#f87171; --ng-soft:#5f1e1e; --warn:#fbbf24; --warn-soft:#4a3b10;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.app{padding:18px 0 6px}
header.app h1{font-size:19px;font-weight:700}
header.app .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h2.sec{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode-btn{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn span{color:var(--sub);font-size:12px}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:12.5px;color:var(--sub)}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;border-radius:6px;padding:2.5px 8px;font-weight:600}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.asp{background:var(--warn-soft);color:var(--warn)}
.tag.ref{background:var(--line);color:var(--sub)}
.setsumon{font-size:15.5px;font-weight:700;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;transition:.15s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.judge{margin-top:14px;font-size:16px;font-weight:800}
.judge.ok{color:var(--ok)}
.judge.ng{color:var(--ng)}
/* explanation */
.expl{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ex h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex p{font-size:13.5px}
.ex.ito h4{color:var(--accent)}
.ex.risk h4{color:var(--ng)}
.ex.ans h4{color:var(--ok)}
.ex.alt h4{color:var(--warn)}
.ex.ev h4{color:var(--sub)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* result */
.score-big{font-size:42px;font-weight:800;text-align:center}
.score-sub{text-align:center;color:var(--sub);margin-bottom:16px}
table.catres{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.catres th,table.catres td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.catres td.num{text-align:right;white-space:nowrap}
.bar{background:var(--line);height:8px;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div style="padding-top:10px"><a href="./" style="color:#6b7280;font-size:12.5px;text-decoration:none">← 問題集一覧</a></div>
  <header class="app">
    <h1>NIST CSF 2.0観点｜習熟問題集</h1>
    <div class="sub">セキュリティチェックシート（NIST CSF 2.0観点・網羅版） をもとに自動生成した4択演習（全 <span id="totalItems"></span> 問）。設問の意図・リスク・対策・回答例を学びます。</div>
  </header>

  <!-- START SCREEN -->
  <div id="scrStart">
    <div class="card">
      <h2 class="sec">1. 出題観点を選ぶ</h2>
      <div class="modes" id="aspectBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">2. 出題カテゴリを選ぶ（複数選択可）</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="chipAll">すべて選択</button>
        <button class="chip" id="chipNone">すべて解除</button>
      </div>
      <div class="chips" id="catBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">3. 出題順・出題数</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ordChip sel" data-v="seq">項番どおり</button>
        <button class="chip ordChip" data-v="shuf">シャッフル</button>
      </div>
      <div class="row">
        <button class="chip cntChip sel" data-v="0">全問</button>
        <button class="chip cntChip" data-v="10">10問</button>
        <button class="chip cntChip" data-v="20">20問</button>
        <button class="chip cntChip" data-v="30">30問</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnStart">スタート</button>
      <span class="small" id="startInfo"></span>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="scrQuiz" class="hidden">
    <div class="topbar">
      <span class="pill">問題 <b id="qPos"></b> / <span id="qTotal"></span></span>
      <span class="pill">正解 <b id="qScore">0</b></span>
      <button class="btn ghost" id="btnQuit" style="padding:5px 14px;font-size:12.5px">中断して結果を見る</button>
    </div>
    <div class="progress"><i id="pbar" style="width:0%"></i></div>
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="setsumon" id="qSetsumon"></div>
      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="judge hidden" id="qJudge"></div>
      <div class="expl hidden" id="qExpl"></div>
      <div class="nav">
        <span></span>
        <button class="btn primary hidden" id="btnNext">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="scrResult" class="hidden">
    <div class="card">
      <div class="score-big" id="rScore"></div>
      <div class="score-sub" id="rSub"></div>
      <h2 class="sec">カテゴリ別の成績</h2>
      <table class="catres"><tbody id="rCats"></tbody></table>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnRetryWrong">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btnHome">最初の画面に戻る</button>
    </div>
  </div>

  <footer>学習用に自動生成された問題集です。選択肢の誤答は他の設問の解説文から引用しています。／ 出典: セキュリティチェックシート_NIST_CSF2.0観点_網羅版_解説付き.xlsx</footer>
</div>

<script>
const DATA = {"key": "nist", "title": "NIST CSF 2.0観点", "full": "セキュリティチェックシート（NIST CSF 2.0観点・網羅版）", "refLabel": "参照（サブカテゴリ）", "items": [{"no": 1, "cat": "1. 統治（GOVERN：GV）― GV.OC 組織の状況", "ref": "GV.OC-01", "q": "組織のミッション・事業目的を踏まえて、サイバーセキュリティリスクマネジメントの方向性を定めていますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 2, "cat": "1. 統治（GOVERN：GV）― GV.OC 組織の状況", "ref": "GV.OC-02", "q": "社内外のステークホルダー（顧客・株主・従業員・取引先等）を特定し、そのニーズ・期待をリスクマネジメントに考慮していますか。", "taiou": "顧客・株主・規制当局・委託先等の利害関係者と、自社が依存する／自社に依存される重要なサービス・能力を一覧化し、リスク検討の前提として文書化。", "ito": "セキュリティの取り組みが自社の事業環境・関係者の期待を踏まえて設計されているか（前提の把握）。", "risk_own": "重要な依存関係・要求事項の見落としにより、対策の優先順位を誤り、想定外の影響（外部サービス停止等）を受ける。", "risk_cli": "取引先が自社に依存している業務の重要性を認識せず、保護・継続の手当てが不足する。", "daitai": "網羅的な分析が難しければ、主要取引先と依存する主要ITサービスの一覧化から開始。", "shoseki": "ステークホルダー・依存関係の一覧、事業環境分析の資料、リスクマネジメント方針の前提記述。"}, {"no": 3, "cat": "1. 統治（GOVERN：GV）― GV.OC 組織の状況", "ref": "GV.OC-03", "q": "サイバーセキュリティに関する法的要件・規制要件・契約上の要件を特定し、管理していますか。", "taiou": "事業に適用される法令・規制・契約上のセキュリティ要求事項（個情法・不競法・業法・取引先要求等）を一覧化し、対応状況を管理。", "ito": "守るべき法令・契約義務を組織として特定・追跡しているか（知らずに違反していないか）。", "risk_own": "法令・契約違反による処分・賠償・取引停止が発生する。", "risk_cli": "取引先との契約上のセキュリティ義務を認識しないまま不履行となる。", "daitai": "包括的な一覧が難しければ、個人情報保護法と主要取引先との契約条項の2点から着手。", "shoseki": "適用法令・要求事項一覧、対応状況の管理表、法務確認の記録。"}, {"no": 4, "cat": "1. 統治（GOVERN：GV）― GV.OC 組織の状況", "ref": "GV.OC-04", "q": "外部のステークホルダーが自社に依存している重要なサービス・能力を特定し、関係者に伝達していますか。", "taiou": "顧客・株主・規制当局・委託先等の利害関係者と、自社が依存する／自社に依存される重要なサービス・能力を一覧化し、リスク検討の前提として文書化。", "ito": "セキュリティの取り組みが自社の事業環境・関係者の期待を踏まえて設計されているか（前提の把握）。", "risk_own": "重要な依存関係・要求事項の見落としにより、対策の優先順位を誤り、想定外の影響（外部サービス停止等）を受ける。", "risk_cli": "取引先が自社に依存している業務の重要性を認識せず、保護・継続の手当てが不足 ERN：GV）― GV.RR 役割・責任・権限", "ref": "GV.RR-01", "q": "経営層がサイバーセキュリティリスクに関する説明責任を負い、リスクを意識した倫理的で継続的に改善する文化を醸成していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 14, "cat": "1. 統治（GOVERN：GV）― GV.RR 役割・責任・権限", "ref": "GV.RR-02", "q": "サイバーセキュリティに関する役割・責任・権限を確立し、伝達・理解・実行させていますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 15, "cat": "1. 統治（GOVERN：GV）― GV.RR 役割・責任・権限", "ref": "GV.RR-03", "q": "サイバーセキュリティリスク戦略に見合った適切な資源（予算・人材・ツール）を配分していますか。", "taiou": "年度予算にセキュリティ対策費（ツール・教育・診断・人件費）を計上し、経営層が承認。", "ito": "対策が掛け声だけでなく、実行に必要なヒト・カネが継続的に手当てされているか。", "risk_own": "対策が計画倒れとなり、老朽化した対策のまま脅威の変化に追従できない。", "risk_cli": "取引先が期待する対策水準を維持できず、契約上の要求事項を満たせなくなる。", "daitai": "低コストの公的支援（IPA相談窓口・お助け隊サービス）や優先度を絞った段階的投資で補完。", "shoseki": "年度予算書のセキュリティ関連項目、投資決裁記録、対策実施計画。"}, {"no": 16, "cat": "1. 統治（GOVERN：GV）― GV.RR 役割・責任・権限", "ref": "GV.RR-04", "q": "サイバーセキュリティを人事慣行（採用・異動・退職・教育・評価等）に組み込んでいますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 17, "cat": "1. 統治（GOVERN：GV）― GV.PO 方針", "ref": "GV.PO-01", "q": "サイバーセキュリティリスクマネジメントに関する方針（ポリシー）を確立し、伝達し、実行していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内 理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 39, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-01", "q": "自社資産の脆弱性を特定・検証し、記録していますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 40, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-02", "q": "情報共有フォーラム・専門機関等から脅威インテリジェンス（サイバー脅威情報）を入手していますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 41, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-03", "q": "組織に対する内部・外部の脅威を特定し、記録していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 42, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-04", "q": "脅威が脆弱性を悪用した場合の影響の大きさと発生可能性を特定・評価していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 43, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-05", "q": "脅威・脆弱性・発生可能性・影響を用いて、組織としてのリスクを把握し、対応の優先順位付けを行っていますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 44, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-06", "q": "リスク対応策を選択・優先順位付けし、計画・追跡・伝達していますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 45, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-07", "q": "システム等の変更および例外措置を、リスク影響を評価した上で管理・記録していますか。", "taiou": "システム変更を申請・影響評価・承認・記録のフローで管理し、緊急変更も事後承認を必須化。", "ito": "無断・無計画な変更による障害・セキュリティ低下を防ぐ統制があるか。", "risk_own": "変更起因の障害・設定ミスが多発し、原因追跡もできない。", "risk_cli": "変更ミスによる取引先向けサービス停止・データ破損が起きる。", "daitai": "重量級のフローが難しければ、変更記録簿＋重要システムのみ承認必須の簡易運用から開始。", "shoseki": "変更管理手順書、変更申請・承認記録、リリース記録。"}, {"no": 46, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-08", "q": "脆弱性の報告・開示を受け付け、処理するプロセス（脆弱性開示窓口等）を確立していますか。", "taiou": "セキュリティへの取り組み（体制・認証・主要対策）をWebサイト・会社案内・セキュリティホワイトペーパーで開示し、照会対応の窓口を明確化。", "ito": "ステークホルダーへの説明責任を果たし、取引先の確認負担を減らす姿勢があるか。", "risk_own": "取引先評価・入札のたびに個別対応が発生し、信頼獲得の機会も逃す。", "risk_cli": "取引先がリスク評価に必要な情報を得られず、取引判断が遅れる。", "daitai": "詳細開示が難しければ、認証取得状況と本チェックシートの標準回答集の整備から開始（トラストセンター型）。", "shoseki": "公開ページ・ホワイトペーパー、標準回答集、開示承認の記録。"}, {"no": 47, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-09", "q": "ハードウェア・ソフトウェアの真正性・完全性を、取得・利用の前に評価していますか。", "taiou": "委託先・調達先・利用サービスを含むサプライチェーン全体のリスクを整理し、重要度に応じた管理策（評価・契約・監視）を適用。", "ito": "自社だけでなく、つながる先を含めた全体でセキュリティを確保する視点があるか。", "risk_own": "取引網の弱点経由の攻撃（サプライチェーン攻撃）を受け、自社対策だけでは防げない事故が起きる。", "risk_cli": "自社がサプライチェーンの弱点となり、取引先全体へ被害を波及させる。", "daitai": "全体管理が難しければ、情報を預ける先・システム接続のある先に絞った管理から開始。", "shoseki": "サプライチェーンリスク管理方針、委託先・調達先の一覧と重要度評価、管理策の適用状況。"}, {"no": 48, "cat": "2. 識別（IDENTIFY：ID）― ID.RA リスクアセスメント", "ref": "ID.RA-10", "q": "重要な供給者を、取引開始前に評価（デューデリジェンス）していますか。", "taiou": "委託先選定時にセキュリティチェックシート・認証取得状況等で対策水準を評価し、基準を満たす先とのみ契約。", "ito": "情報を預ける相手の安全性を、契約前に確認する仕組みがあるか。", "risk_own": "対策の弱い委託先経由の漏えい（サプライチェーン事故）が発生し、委託元としての管理責任を問われる。", "risk_cli": "取引先から預かった情報を再委託先経由で漏えいさせ、契約違反となる。", "daitai": "詳細評価が難しければ、認証（ISMS・Pマーク）の有無確認＋簡易チェックリストで最低限を担保。", "shoseki": "委託先選定基準、評価記録（チェックシート回収結果）、委託先一覧。"}, {"no": 49, "cat": "2. 識別（IDENTIFY：ID）― ID.IM 改善", "ref": "ID.IM-01", "q": "各種評価（監査・アセスメント等）から改善点を特定していますか。", "taiou": "監査・点検・インシデントで見つかった不備に是正計画（担当・期限）を立て、完了確認まで管理表で追跡。", "ito": "見つかった問題が放置されず、確実に直り切る管理があるか。", "risk_own": "既知の不備が放置され、同じ指摘・同じ事故が繰り返される。", "risk_cli": "取引先監査での指摘事項が改善されず、取引継続の評価に影響する。", "daitai": "専用の仕組みがなくても、指摘事項一覧（Excel）と月次の進捗確認で十分機能する。", "shoseki": "是正処置管理表、完了報告・有効性確認の記録。"}, {"no": 50, "cat": "2. 識別（IDENTIFY：ID）― ID.IM 改善", "ref": "ID.IM-02", "q": "供給者・第三者との合同のものを含む、セキュリティテスト・演習から改善点を特定していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 51, "cat": "2. 識別（IDENTIFY：ID）― ID.IM 改善", "ref": "ID.IM-03", "q": "業務プロセス・手順の実行状況（実際の運用・インシデント対応等）から改善点を特定していますか。", "taiou": "監査・点検・インシデントで見つかった不備に是正計画（担当・期限）を立て、完了確認まで管理表で追跡。", "ito": "見つかった問題が放置されず、確実に直り切る管理があるか。", "risk_own": "既知の不備が放置され、同じ指摘・同じ事故が繰り返される。", "risk_cli": "取引先監査での指摘事項が改善されず、取引継続の評価に影響する。", "daitai": "専用の仕組みがなくても、指摘事項一覧（Excel）と月次の進捗確認で十分機能する。", "shoseki": "是正処置管理表、完了報告・有効性確認の記録。"}, {"no": 52, "cat": "2. 識別（IDENTIFY：ID）― ID.IM 改善", "ref": "ID.IM-04", "q": "インシデント対応計画その他のサイバーセキュリティ計画を策定・伝達・維持し、継続的に改善していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 53, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-01", "q": "許可された利用者・サービス・ハードウェアのアイデンティティと資格情報（ID・クレデンシャル）を組織として管理していますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 54, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-02", "q": "アイデンティティの本人確認（身元確認）を行い、資格情報と紐付けていますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 55, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-03", "q": "利用者・サービス・ハードウェアを認証していますか（リスクに応じた多要素認証の適用を含む）。", "taiou": "VPN・クラウドサービス・特権アカウント等の重要アクセスにMFA（認証アプリ・FIDO等）を適用。", "ito": "パスワードだけに依存しない認証で、認証情報漏えい時にも不正ログインを防げるか。", "risk_own": "フィッシング等で窃取されたパスワードだけで社内システム・クラウドに侵入され、被害が全社に及ぶ。", "risk_cli": "侵入したアカウント経由で取引先情報の窃取や取引先へのなりすまし攻撃が行われる。", "daitai": "MFA非対応システムでは、アクセス元IP制限・端末証明書・強固なパスワード＋監視強化で補完。", "shoseki": "MFA適用対象一覧・設定画面の画面写し、認証基盤の設定基準書。"}, {"no": 56, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-04", "q": "アイデンティティに関するアサーション（認証連携・シングルサインオン等の情報）を保護・伝達・検証していますか。", "taiou": "SSO・認証連携（SAML/OIDC）の信頼設定を適切に管理し、トークン・証明書の保護と有効期限管理を実施。", "ito": "システム間で受け渡される「認証済み」の情報が偽造・漏えいから守られているか。", "risk_own": "認証連携の設定不備・トークン窃取により、1つの侵害が連携先すべてのなりすましに拡大する。", "risk_cli": "連携先サービス上の取引先情報まで一括で不正アクセスされる。", "daitai": "SSO未導入なら本項は該当なしとし、個別システムごとの強固な認証（MFA）で担保。", "shoseki": "認証基盤の構成図・設定書、証明書・トークンの管理記録。"}, {"no": 57, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-05", "q": "アクセス権限・認可を、最小権限の原則・職務分離を組み込んで定義・管理・実施・見直ししていますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 58, "cat": "3. 防御（PROTECT：PR）― PR.AA アイデンティティ管理・認証・アクセス制御", "ref": "PR.AA-06", "q": "リスクに応じて、施設・設備への物理的アクセスを管理・監視・実施していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 59, "cat": "3. 防御（PROTECT：PR）― PR.AT 意識向上・訓練", "ref": "PR.AT-01", "q": "全要員に対し、基礎的なサイバーセキュリティの意識向上・訓練を提供し、知識・スキルを更新していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 60, "cat": "3. 防御（PROTECT：PR）― PR.AT 意識向上・訓練", "ref": "PR.AT-02", "q": "専門的な役割（IT・セキュリティ担当、経営層、開発者等）を担う者に、役割に応じた訓練を提供していますか。", "taiou": "情報セキュリティ委員会を四半期開催し、対策状況・インシデント・リスクを経営層へ定期報告。経営層が方針・投資を承認。", "ito": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 61, "cat": "3. 防御（PROTECT：PR）― PR.DS データセキュリティ", "ref": "PR.DS-01", "q": "保存データ（データアットレスト）の機密性・完全性・可用性を保護していますか（暗号化・アクセス制御等）。", "taiou": "重要データを保存するDB・ファイルサーバ・クラウドストレージで暗号化機能を有効化し、鍵は別管理。", "ito": "保存場所ごと盗まれた・不正アクセスされた場合でも情報が読めない状態か。", "risk_own": "サーバ侵入・媒体盗難時に、データがそのまま読める形で流出する。", "risk_cli": "預託された個人情報・機密情報が平文のまま漏えいし、被害が最大化する。", "daitai": "全面暗号化が難しければ、特に重要なファイルの暗号化（パスワード付き圧縮ではなく適切なツール）から開始。", "shoseki": "暗号化設定の一覧（対象システム・方式）、クラウドの暗号化設定画面。"}, {"no": 62, "cat": "3. 防御（PROTECT：PR）― PR.DS データセキュリティ", "ref": "PR.DS-02", "q": "転送中データ（データイントランジット）の機密性・完全性・可用性を保護していますか（通信の暗号化等）。", "taiou": "Webサイト・システム間通信をTLSで暗号化し、証明書の有効期限を管理。古い暗号方式（TLS1.0等）は無効化。", "ito": "ネットワーク上を流れる情報が盗聴されても読めない状態になっているか。", "risk_own": "通信経由で認証情報・重要データが盗聴・改ざんされる。", "risk_cli": "取引先とのやり取り（見積・個人データ授受等）が第三者に取得される。", "daitai": "レガシーシステムで暗号化不能な区間は、VPN・閉域網でトンネル暗号化。", "shoseki": "TLS設定（証明書情報・対応プロトコル）、暗号化通信の設定基準。"}, {"no": 63, "cat": "3. 防御（PROTECT：PR）― PR.DS データセキュリティ", "ref": "PR.DS-10", "q": "使用中データ（データインユース：処理中のデータ）の機密性・完全性・可用性を保護していますか。", "taiou": "重要データを保存するDB・ファイルサーバ・クラウドストレージで暗号化機能を有効化し、鍵は別管理。", "ito": "保存場所ごと盗まれた・不正アクセスされた場合でも情報が読めない状態か。", "risk_own": "サーバ侵入・媒体盗難時に、データがそのまま読める形で流出する。", "risk_cli": "預託された個人情報・機密情報が平文のまま漏えいし、被害が最大化する。", "daitai": "全面暗号化が難しければ、特に重要なファイルの暗号化（パスワード付き圧縮ではなく適切なツール）から開始。", "shoseki": "暗号化設定の一覧（対象システム・方式）、クラウドの暗号化設定画面。"}, {"no": 64, "cat": "3. 防御（PROTECT：PR）― PR.DS データセキュリティ", "ref": "PR.DS-11", "q": "データのバックアップを作成し、保護・維持し、定期的にテストしていますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 65, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-01", "q": "ハードウェア・ソフトウェア・サービスの構成管理（セキュアな設定基準の策定・適用・維持）を実施していますか。", "taiou": "サーバ・端末・NW機器のセキュア設定基準（不要サービス停止・初期パスワード変更等）を定め、構築時チェックリストで確認。", "ito": "機器・システムが安全な設定で構築・維持され、設定の劣化を防ぐ管理があるか。", "risk_own": "初期設定・不要機能の放置が侵入口となる（初期パスワードのままの機器等）。", "risk_cli": "設定不備の機器経由で預託情報に到達される。", "daitai": "ベンダー・CISのハードニングガイドを流用した簡易チェックリストから開始。", "shoseki": "設定基準書（ハードニング基準）、構築時チェックリスト、設定監査の記録。"}, {"no": 66, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-02", "q": "ソフトウェアをリスクに応じて保守（パッチ適用・更新）・交換・削除していますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 67, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-03", "q": "ハードウェアをリスクに応じて保守・交換・撤去していますか。", "taiou": "サーバ・NW機器の保守契約を締結し、メーカー推奨周期で点検・部品交換。保守記録を保管。", "ito": "機器の故障予防と、故障時に迅速に復旧できる体制があるか。", "risk_own": "機器故障による突発停止・データ喪失と、保守切れ機器の脆弱性放置が発生。", "risk_cli": "取引先向け業務が機器故障で停止する。", "daitai": "保守契約がない機器は、予備機の確保・クラウド移行で可用性を補完。", "shoseki": "保守契約書、点検・修理記録、機器一覧（保守期限付き）。"}, {"no": 68, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-04", "q": "ログレコードを生成し、継続的な監視に利用できるようにしていますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 69, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-05", "q": "許可されていないソフトウェアのインストール・実行を防止していますか。", "taiou": "業務利用可能なソフト・サービスの許可リストを定め、端末への管理者権限制限・CASB等で未許可利用を検知・制御。", "ito": "会社が把握していないソフト・サービスで業務情報が扱われることを防げているか。", "risk_own": "無償サービス・個人アカウントに業務データが分散し、漏えいしても把握・対処できない。", "risk_cli": "取引先情報が管理外サービスに保存され、契約違反・漏えい経路不明となる。", "daitai": "技術的統制の前に、まず許可サービス一覧の明示と代替手段（公式に使えるツール）の提供が有効。", "shoseki": "利用許可ソフト・サービス一覧、端末の権限設定、検知ツールのレポート。"}, {"no": 70, "cat": "3. 防御（PROTECT：PR）― PR.PS プラットフォームセキュリティ", "ref": "PR.PS-06", "q": "セキュアなソフトウェア開発プラクティスを組み込み、開発ライフサイクル全体で実施状況を監視していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 71, "cat": "3. 防御（PROTECT：PR）― PR.IR 技術インフラのレジリエンス", "ref": "PR.IR-01", "q": "ネットワーク・環境を、不正な論理アクセス・利用から保護していますか（ネットワーク分離・境界防御等）。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 72, "cat": "3. 防御（PROTECT：PR）― PR.IR 技術インフラのレジリエンス", "ref": "PR.IR-02", "q": "技術資産を環境上の脅威（災害・停電・空調障害等）から保護していますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 73, "cat": "3. 防御（PROTECT：PR）― PR.IR 技術インフラのレジリエンス", "ref": "PR.IR-03", "q": "通常時および悪条件下での可用性要求を満たすための仕組み（冗長化・フェイルオーバー等）を実装していますか。", "taiou": "重要システムのリソース使用率を監視し、閾値超過で増強。可用性要件の高いシステムは冗長構成（クラスタ・複数AZ）を採用。", "ito": "需要増・障害があってもサービスを維持できる設計・監視があるか。", "risk_own": "リソース枯渇・単一障害点によるサービス停止が起きる。", "risk_cli": "取引先向けサービス・業務が停止し、納期・供給に影響する。", "daitai": "冗長化コストが難しければ、復旧手順の整備・バックアップからの迅速復元でRTOを短縮。", "shoseki": "監視設定・リソースレポート、冗長構成図、可用性要件定義書。"}, {"no": 74, "cat": "3. 防御（PROTECT：PR）― PR.IR 技術インフラのレジリエンス", "ref": "PR.IR-04", "q": "十分な資源容量（システム容量・処理能力・帯域）を確保し、可用性を維持していますか。", "taiou": "重要システムのリソース使用率を監視し、閾値超過で増強。可用性要件の高いシステムは冗長構成（クラスタ・複数AZ）を採用。", "ito": "需要増・障害があってもサービスを維持できる設計・監視があるか。", "risk_own": "リソース枯渇・単一障害点によるサービス停止が起きる。", "risk_cli": "取引先向けサービス・業務が停止し、納期・供給に影響する。", "daitai": "冗長化コストが難しければ、復旧手順の整備・バックアップからの迅速復元でRTOを短縮。", "shoseki": "監視設定・リソースレポート、冗長構成図、可用性要件定義書。"}, {"no": 75, "cat": "4. 検知（DETECT：DE）― DE.CM 継続的監視", "ref": "DE.CM-01", "q": "ネットワークおよびネットワークサービスを監視し、有害な事象の可能性のある兆候を発見していますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 76, "cat": "4. 検知（DETECT：DE）― DE.CM 継続的監視", "ref": "DE.CM-02", "q": "物理環境（施設・設備）を監視し、有害な事象の可能性のある兆候を発見していますか。", "taiou": "SIEM・監視サービス（SOC）で不審なログイン・大量データ転送等のアラートを設定し、検知時の対応手順を整備。", "ito": "記録を「取るだけ」でなく、異常をタイムリーに発見し対応につなげる監視があるか。", "risk_own": "侵入から発覚まで数か月を要し（潜伏期間の長期化）、被害が静かに拡大する。", "risk_cli": "預託情報の窃取に長期間気づかず、取引先への通知が大幅に遅れる。", "daitai": "SOC委託が難しければ、主要システムの失敗ログイン・管理者操作に絞ったアラート設定から開始。", "shoseki": "監視設計書（検知ルール）、SOC契約書、アラート対応記録。"}, {"no": 77, "cat": "4. 検知（DETECT：DE）― DE.CM 継続的監視", "ref": "DE.CM-03", "q": "要員の活動・テクノロジーの利用状況を、規程に基づき監視し、有害な事象の兆候を発見していますか。", "taiou": "SIEM・監視サービス（SOC）で不審なログイン・大量データ転送等のアラートを設定し、検知時の対応手順を整備。", "ito": "記録を「取るだけ」でなく、異常をタイムリーに発見し対応につなげる監視があるか。", "risk_own": "侵入から発覚まで数か月を要し（潜伏期間の長期化）、被害が静かに拡大する。", "risk_cli": "預託情報の窃取に長期間気づかず、取引先への通知が大幅に遅れる。", "daitai": "SOC委託が難しければ、主要システムの失敗ログイン・管理者操作に絞ったアラート設定から開始。", "shoseki": "監視設計書（検知 const ASPECTS = [
  {k:'ito',      label:'設問の意図',       desc:'「何が求められているのか」を当てる', stem:'この設問が確認しようとしている意図（何が求められているのか）として、最も適切なものはどれですか？'},
  {k:'risk_own', label:'自社へのリスク',   desc:'未実施の場合に自社に生じるリスクを当てる', stem:'この対策を実施していない場合に「自社」に生じるリスクとして、最も適切なものはどれですか？'},
  {k:'risk_cli', label:'取引先へのリスク', desc:'未実施の場合に取引先へ与えるリスクを当てる', stem:'この対策を実施していない場合に「取引先」へ与えるリスクとして、最も適切なものはどれですか？'},
  {k:'taiou',    label:'対策・回答例',     desc:'具体的な対応例（回答の書き方の軸）を当てる', stem:'この設問に対する具体的な対応例（回答例の軸となる取り組み）として、最も適切なものはどれですか？'},
  {k:'mix',      label:'ミックス',         desc:'上の4観点からランダムに出題', stem:''}
];

let selAspect='ito', selCats=new Set(DATA.cats), selOrd='seq', selCnt=0;
let queue=[], idx=0, score=0, results=[]; // results: {item, aspect, correct}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start screen ---------- */
$('totalItems').textContent=DATA.items.length;
const aspectBox=$('aspectBox');
ASPECTS.forEach(a=>{
  const b=document.createElement('button');
  b.className='mode-btn'+(a.k===selAspect?' sel':'');
  b.innerHTML='<b>'+a.label+'</b><span>'+a.desc+'</span>';
  b.onclick=()=>{selAspect=a.k;[...aspectBox.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();};
  aspectBox.appendChild(b);
});
const catBox=$('catBox');
DATA.cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip sel'; b.textContent=c.replace(/^\d+\.\s*/,'');
  b.onclick=()=>{ if(selCats.has(c)){selCats.delete(c);b.classList.remove('sel');} else {selCats.add(c);b.classList.add('sel');} updateInfo(); };
  catBox.appendChild(b);
});
$('chipAll').onclick=()=>{selCats=new Set(DATA.cats);[...catBox.children].forEach(c=>c.classList.add('sel'));updateInfo();};
$('chipNone').onclick=()=>{selCats.clear();[...catBox.children].forEach(c=>c.classList.remove('sel'));updateInfo();};
document.querySelectorAll('.ordChip').forEach(b=>b.onclick=()=>{selOrd=b.dataset.v;document.querySelectorAll('.ordChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
document.querySelectorAll('.cntChip').forEach(b=>b.onclick=()=>{selCnt=+b.dataset.v;document.querySelectorAll('.cntChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();});
function pool(){return DATA.items.filter(i=>selCats.has(i.cat));}
function updateInfo(){
  const n=pool().length, m=selCnt>0?Math.min(selCnt,n):n;
  $('startInfo').textContent='対象 '+n+' 問中 '+m+' 問を出題します';
  $('btnStart').disabled=n===0;
}
updateInfo();

/* ---------- question building ---------- */
function buildQueue(items){
  return items.map(it=>{
    const asp = selAspect==='mix' ? ASPECTS[Math.floor(Math.random()*4)].k : selAspect;
    return {item:it, aspect:asp};
  });
}
function makeOptions(q){
  const f=q.aspect, correct=q.item[f];
  const others=DATA.items.filter(i=>i!==q.item && i[f] && i[f]!==correct);
  const otherCat=others.filter(i=>i.cat!==q.item.cat);
  const src=otherCat.length>=3?otherCat:others;
  const picked=shuffle(src.slice()).slice(0,3).map(i=>i[f]);
  return shuffle([{t:correct,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- screens ---------- */
function show(id){['scrStart','scrQuiz','scrResult'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

$('btnStart').onclick=()=>{
  let items=pool();
  if(selOrd==='shuf') items=shuffle(items.slice()); else items=items.slice();
  if(selCnt>0){ items=(selOrd==='shuf'?items:shuffle(items.slice())).slice(0,selCnt); if(selOrd==='seq') items.sort((a,b)=>a.no-b.no); }
  queue=buildQueue(items); idx=0; score=0; results=[];
  startQuiz();
};
function startQuiz(){ $('qTotal').textContent=queue.length; $('qScore').textContent=0; show('scrQuiz'); render(); }

function render(){
  const q=queue[idx], asp=ASPECTS.find(a=>a.k===q.aspect);
  $('qPos').textContent=idx+1;
  $('pbar').style.width=(idx/queue.length*100)+'%';
  $('qMeta').innerHTML=
    '<span class="tag cat">'+esc(q.item.cat)+'</span>'+
    '<span class="tag asp">出題観点：'+asp.label+'</span>'+
    (q.item.ref?'<span class="tag ref">'+esc(DATA.refLabel)+'：'+esc(q.item.ref)+'</span>':'');
  $('qSetsumon').textContent='設問　'+q.item.q;
  $('qStem').textContent='Q'+(idx+1)+'. '+asp.stem;
  const opts=makeOptions(q), box=$('qOpts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mark">'+labels[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=()=>answer(b,o,opts,box);
    box.appendChild(b);
  });
  $('qJudge').classList.add('hidden');
  $('qExpl').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnNext').textContent = idx===queue.length-1 ? '結果を見る →' : '次の問題 →';
}

function answer(btn,opt,opts,box){
  [...box.children].forEach((b,i)=>{ b.disabled=true; if(opts[i].ok) b.classList.add('correct'); });
  if(!opt.ok) btn.classList.add('wrong');
  if(opt.ok) score++;
  $('qScore').textContent=score;
  results.push({item:queue[idx].item, aspect:queue[idx].aspect, correct:opt.ok});
  const j=$('qJudge');
  j.textContent=opt.ok?'○ 正解！':'× 不正解';
  j.className='judge '+(opt.ok?'ok':'ng');
  j.classList.remove('hidden');
  showExpl(queue[idx].item);
  $('btnNext').classList.remove('hidden');
}

function showExpl(it){
  const e=$('qExpl');
  e.innerHTML=
    '<div class="ex ito"><h4>💡 設問の意図（何が求められているのか）</h4><p>'+esc(it.ito)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（自社）</h4><p>'+esc(it.risk_own)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（取引先）</h4><p>'+esc(it.risk_cli)+'</p></div>'+
    '<div class="ex ans"><h4>✅ 具体的な対策・回答例</h4><p>'+esc(it.taiou)+'</p></div>'+
    (it.daitai?'<div class="ex alt"><h4>🔁 実施していない場合の代替策</h4><p>'+esc(it.daitai)+'</p></div>':'')+
    (it.shoseki?'<div class="ex ev"><h4>📎 証跡を求められた場合の資料例</h4><p>'+esc(it.shoseki)+'</p></div>':'');
  e.classList.remove('hidden');
}

$('btnNext').onclick=()=>{ idx++; if(idx>=queue.length) finish(); else render(); };
$('btnQuit').onclick=()=>{ if(results.length===0){show('scrStart');return;} finish(); };

function finish(){
  const n=results.length;
  $('pbar').style.width='100%';
  $('rScore').textContent=score+' / '+n+' 問正解';
  const pct=n?Math.round(score/n*100):0;
  $('rSub').textContent='正答率 '+pct+'%'+(pct===100?'　全問正解です！':pct>=80?'　あと少しで完璧です':'　解説を読み返して再挑戦しましょう');
  const byCat={};
  results.forEach(r=>{ const c=r.item.cat; byCat[c]=byCat[c]||{ok:0,n:0}; byCat[c].n++; if(r.correct) byCat[c].ok++; });
  const tb=$('rCats'); tb.innerHTML='';
  Object.keys(byCat).forEach(c=>{
    const v=byCat[c], p=Math.round(v.ok/v.n*100);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c)+'</td><td class="num">'+v.ok+'/'+v.n+'</td><td style="width:120px"><div class="bar"><i style="width:'+p+'%"></i></div></td>';
    tb.appendChild(tr);
  });
  $('btnRetryWrong').style.display = results.some(r=>!r.correct) ? '' : 'none';
  show('scrResult');
}
$('btnRetryWrong').onclick=()=>{
  const wrong=results.filter(r=>!r.correct);
  queue=wrong.map(r=>({item:r.item,aspect:r.aspect}));
  idx=0;score=0;results=[];
  startQuiz();
};
$('btnHome').onclick=()=>show('scrStart');
</script>
