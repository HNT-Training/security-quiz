<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-general.json">
<link rel="apple-touch-icon" href="icon-general.png">
<link rel="icon" type="image/png" href="icon-general.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セキュ問題集 一般">
<meta name="theme-color" content="#2563eb">
<title>一般観点｜習熟問題集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --ng:#dc2626; --ng-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --sub:#9ca3af; --line:#374151;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --ok:#34d399; --ok-soft:#064e3b;
    --ng:#f87171; --ng-soft:#5f1e1e; --warn:#fbbf24; --warn-soft:#4a3b10;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.app{padding:18px 0 6px}
header.app h1{font-size:19px;font-weight:700}
header.app .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h2.sec{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode-btn{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn span{color:var(--sub);font-size:12px}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:12.5px;color:var(--sub)}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;border-radius:6px;padding:2.5px 8px;font-weight:600}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.asp{background:var(--warn-soft);color:var(--warn)}
.tag.ref{background:var(--line);color:var(--sub)}
.setsumon{font-size:15.5px;font-weight:700;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;transition:.15s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.judge{margin-top:14px;font-size:16px;font-weight:800}
.judge.ok{color:var(--ok)}
.judge.ng{color:var(--ng)}
/* explanation */
.expl{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ex h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex p{font-size:13.5px}
.ex.ito h4{color:var(--accent)}
.ex.risk h4{color:var(--ng)}
.ex.ans h4{color:var(--ok)}
.ex.alt h4{color:var(--warn)}
.ex.ev h4{color:var(--sub)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* result */
.score-big{font-size:42px;font-weight:800;text-align:center}
.score-sub{text-align:center;color:var(--sub);margin-bottom:16px}
table.catres{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.catres th,table.catres td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.catres td.num{text-align:right;white-space:nowrap}
.bar{background:var(--line);height:8px;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div style="padding-top:10px"><a href="./" style="color:#6b7280;font-size:12.5px;text-decoration:none">← 問題集一覧</a></div>
  <header class="app">
    <h1>一般観点｜習熟問題集</h1>
    <div class="sub">セキュリティチェックシート（一般観点・解説付き） をもとに自動生成した4択演習（全 <span id="totalItems"></span> 問）。設問の意図・リスク・対策・回答例を学びます。</div>
  </header>

  <!-- START SCREEN -->
  <div id="scrStart">
    <div class="card">
      <h2 class="sec">1. 出題観点を選ぶ</h2>
      <div class="modes" id="aspectBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">2. 出題カテゴリを選ぶ（複数選択可）</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="chipAll">すべて選択</button>
        <button class="chip" id="chipNone">すべて解除</button>
      </div>
      <div class="chips" id="catBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">3. 出題順・出題数</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ordChip sel" data-v="seq">項番どおり</button>
        <button class="chip ordChip" data-v="shuf">シャッフル</button>
      </div>
      <div class="row">
        <button class="chip cntChip sel" data-v="0">全問</button>
        <button class="chip cntChip" data-v="10">10問</button>
        <button class="chip cntChip" data-v="20">20問</button>
        <button class="chip cntChip" data-v="30">30問</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnStart">スタート</button>
      <span class="small" id="startInfo"></span>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="scrQuiz" class="hidden">
    <div class="topbar">
      <span class="pill">問題 <b id="qPos"></b> / <span id="qTotal"></span></span>
      <span class="pill">正解 <b id="qScore">0</b></span>
      <button class="btn ghost" id="btnQuit" style="padding:5px 14px;font-size:12.5px">中断して結果を見る</button>
    </div>
    <div class="progress"><i id="pbar" style="width:0%"></i></div>
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="setsumon" id="qSetsumon"></div>
      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="judge hidden" id="qJudge"></div>
      <div class="expl hidden" id="qExpl"></div>
      <div class="nav">
        <span></span>
        <button class="btn primary hidden" id="btnNext">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="scrResult" class="hidden">
    <div class="card">
      <div class="score-big" id="rScore"></div>
      <div class="score-sub" id="rSub"></div>
      <h2 class="sec">カテゴリ別の成績</h2>
      <table class="catres"><tbody id="rCats"></tbody></table>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnRetryWrong">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btnHome">最初の画面に戻る</button>
    </div>
  </div>

  <footer>学習用に自動生成された問題集です。選択肢の誤答は他の設問の解説文から引用しています。／ 出典: セキュリティチェックシート_一般観点_解説付き.xlsx</footer>
</div>

const DATA = {"key": "gen", "title": "一般観点", "full": "セキュリティチェックシート（一般観点・解説付き）", "refLabel": "項番", "items": [{"no": 1, "cat": "1. 情報セキュリティ体制・ガバナンス", "ref": "1-1", "q": "情報セキュリティに関する基本方針（セキュリティポリシー）を策定し、経営層が承認していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 2, "cat": "1. 情報セキュリティ体制・ガバナンス", "ref": "1-2", "q": "情報セキュリティの最高責任者（CISO等）を任命していますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 3, "cat": "1. 情報セキュリティ体制・ガバナンス", "ref": "1-3", "q": "情報セキュリティを統括する組織・委員会（情報セキュリティ委員会等）を設置し、定期的に開催していますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 4, "cat": "1. 情報セキュリティ体制・ガバナンス", "ref": "1-4", "q": "情報セキュリティに関する役割と責任を文書で明確に定めていますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 5, "cat": "1. 情報セキュリティ体制・ガバナンス", "ref": "1-5", "q": "情報セキュリティ対策のための予算・人員を毎年度確保していますか。", "taiou": "年度 itai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 10, "cat": "2. 規程類の整備・見直し", "ref": "2-3", "q": "規程類の最新版を全従業員が参照できる状態にしていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 11, "cat": "2. 規程類の整備・見直し", "ref": "2-4", "q": "規程違反時の懲戒手続を就業規則等で定めていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 12, "cat": "2. 規程類の整備・見直し", "ref": "2-5", "q": "関連する法令・規制・契約上のセキュリティ要求事項を特定し、一覧化していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 13, "cat": "3. リスクマネジメント", "ref": "3-1", "q": "情報資産に対するリスクアセスメントを定期的（少なくとも年1回）に実施していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 14, "cat": "3. リスクマネジメント", "ref": "3-2", "q": "リスクアセスメントの結果に基づき、対応計画（リスク対応計画）を策定していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 15, "cat": "3. リスクマネジメント", "ref": "3-3", "q": "残留リスクについて経営層の承認を得ていますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 16, "cat": "3. リスクマネジメント", "ref": "3-4", "q": "新規事業・新システム導入時にセキュリティリスクを事前評価するプロセスがありますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 17, "cat": "3. リスクマネジメント", "ref": "3-5", "q": "リスクアセスメントの手順・基準を文書化していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 18, "cat": "4. 人的セキュリティ・教育", "ref": "4-1", "q": "全従業員（役員・契約社員・派遣社員を含む）に対し、情報セキュリティ教育を年1回以上実施していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 19, "cat": "4. 人的セキュリティ・教育", "ref": "4-2", "q": "新入社員・中途入社者に対し、入社時にセキュリティ教育を実施していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 20, "cat": "4. 人的セキュリティ・教育", "ref": "4-3", "q": "従業員と秘密保持契約（誓約書）を締結していますか。", "taiou": "全従業員（役員・派遣含む）から入社時に秘密保持誓約書を取得。退職時にも義務継続の確認書を取得。", "ito": "情報を扱う人に法的な守秘義務が課され、本人も認識しているか。", "risk_own": "退職者・従業員による情報持ち出しへの法的対抗手段が弱くなり、営業秘密の法的保護（不正競争防止法）も受けにくくなる。", "risk_cli": "預託情報が従業員経由で漏えいした際、責任追及・被害回復の根拠を欠く。", "daitai": "包括的な就業規則の守秘条項＋重要プロジェクト単位の個別誓約で補完。", "shoseki": "秘密保持誓約書（様式・取得済み一覧）、就業規則該当条項、退職時確認書。"}, {"no": 21, "cat": "4. 人的セキュリティ・教育", "ref": "4-4", "q": "退職者に対し、秘密保持義務の継続を確認する手続がありますか。", "taiou": "全従業員（役員・派遣含む）から入社時に秘密保持誓約書を取得。退職時にも義務継続の確認書を取得。", "ito": "情報を扱う人に法的な守秘義務が課され、本人も認識しているか。", "risk_own": "退職者・従業員による情報持ち出しへの法的対抗手段が弱くなり、営業秘密の法的保護（不正競争防止法）も受けにくくなる。", "risk_cli": "預託情報が従業員経由で漏えいした際、責任追及・被害回復の根拠を欠く。", "daitai": "包括的な就業規則の守秘条項＋重要プロジェクト単位の個別誓約で補完。", "shoseki": "秘密保持誓約書（様式・取得済み一覧）、就業規則該当条項、退職時確認書。"}, {"no": 22, "cat": "4. 人的セキュリティ・教育", "ref": "4-5", "q": "標的型攻撃メール訓練等の実践的な訓練を実施していますか。", "taiou": "年1〜2回、擬似的な攻撃メールを全従業員に送付し、開封率・報告率を測定。開封者へは追加教育を実施。", "ito": "従業員が実際の攻撃メールに気づき、報告できる実践力があるかの確認。座学教育だけでは測れない対応力を見る。", "risk_own": "訓練不足の従業員が実際の標的型メールを開封し、ランサムウェア感染・認証情報窃取の起点となる。", "risk_cli": "従業員経由の侵入から取引先向けなりすましメール送信や預託情報の漏えいに発展する。", "daitai": "訓練未実施でも、実際の不審メールの報告手順の周知・報告実績の記録、メールフィルタ等の技術対策強化で補完。", "shoseki": "訓練実施報告書（実施日・対象者数・開封率・報告率）、開封者向けフォロー教育の記録。"}, {"no": 23, "cat": "4. 人的セキュリティ・教育", "ref": "4-6", "q": "雇用時に経歴確認等のスクリーニングを実施していますか。", "taiou": "採用時に経歴・資格の確認（履歴書照合・卒業/資格証明書の確認）を法令の範囲で実施。", "ito": "情報を扱う人材の信頼性を、雇用前に組織として確認しているか。", "risk_own": "経歴詐称者・ハイリスク人材の採用により内部不正リスクが高まる。", "risk_cli": "重要情報を扱う担当者の信頼性を取引先に説明できない。", "daitai": "全員一律が難しければ、重要情報を扱う職務に限定した確認で補完。", "shoseki": "採用手続規程（確認項目）、確認実施のチェック記録。"}, {"no": 24, "cat": "4. 人的セキュリティ・教育", "ref": "4-7", "q": "セキュリティ教育の受講記録を保管していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 25, "cat": "5. 情報資産管理", "ref": "5-1", "q": "情報資産（データ・機器・ソフトウェア等)の管理台帳を整備し、最新の状態に維持していますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 26, "cat": "5. 情報資産管理", "ref": "5-2", "q": "情報資産ごとに管理責任者を定めていますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 27, "cat": "5. 情報資産管理", "ref": "5-3", "q": "情報の重要度に応じた分類基準（機密区分）を定め、ラベル付け・取扱いルールを運用していますか。", "taiou": "情報を「極秘・秘・社外秘・公開」等に区分する基準を定め、文書・ファイルに区分を表示。区分ごとの取扱ルールを規定。", "ito": "情報の重要度に応じたメリハリのある管理（重要なものほど厳格に）が仕組みとして存在するか。", "risk_own": "全情報が同列に扱われ、重要情報の保護が徹底されない一方で過剰管理のコストも発生。", "risk_cli": "取引先から預かった機密情報が一般情報と同じ扱いになり、必要な保護水準が適用されない。", "daitai": "全社展開前に、まず取引先預託情報・個人情報のみ「重要」と定義して厳格管理する2区分運用から開始。", "shoseki": "情報分類基準、分類ラベルの運用例（文書サンプル）、分類別取扱ルール。"}, {"no": 28, "cat": "5. 情報資産管理", "ref": "5-4", "q": "会社が許可していないソフトウェア・クラウドサービスの利用（シャドーIT）を制限・検知する仕組みがありますか。", "taiou": "業務利用可能なソフト・サービスの許可リストを定め、端末への管理者権限制限・CASB等で未許可利用を検知・制御。", "ito": "会社が把握していないソフト・サービスで業務情報が扱われることを防げているか。", "risk_own": "無償サービス・個人アカウントに業務データが分散し、漏えいしても把握・対処できない。", "risk_cli": "取引先情報が管理外サービスに保存され、契約違反・漏えい経路不明となる。", "daitai": "技術的統制の前に、まず許可サービス一覧の明示と代替手段（公式に使えるツール）の提供が有効。", "shoseki": "利用許可ソフト・サービス一覧、端末の権限設定、検知ツールのレポート。"}, {"no": 29, "cat": "5. 情報資産管理", "ref": "5-5", "q": "ソフトウェアのライセンスを適切に管理していますか。", "taiou": "ソフトウェアライセンスを台帳管理し、インストール状況と保有数を年1回突合。違法コピーを禁止。", "ito": "ソフトウェアが正規ライセンスの範囲で利用され、法的リスクがないか。", "risk_own": "ライセンス違反による損害賠償・海賊版経由のマルウェア感染が発生する。", "risk_cli": "納品物・成果物に違法なソフトが関与し、取引先の法的リスクに波及する。", "daitai": "資産管理ツールがなければ、標準PC構成の統一＋インストール申請制で管理を簡素化。", "shoseki": "ライセンス管理台帳、購入証書、監査（突合）記録。"}, {"no": 30, "cat": "5. 情報資産管理", "ref": "5-6", "q": "情報資産の廃棄時に、データ消去・破壊を確実に行う手順を定めていますか。", "taiou": "書類はシュレッダー・溶解処理、機器・媒体は物理破壊または消去ソフトで処理し、廃棄証明書を取得・保管。", "ito": "不要になった情報が復元不能な形で確実に処分されているか（捨てたつもりの流出を防ぐ）。", "risk_own": "廃棄機器・書類からの情報流出（中古市場・ゴミからの復元）が発生する。", "risk_cli": "消去したはずの預託情報が廃棄経路から流出する。", "daitai": "専門業者を使わない場合も、暗号化消去や物理破壊（ドリル穿孔等）＋写真記録で代替可能。", "shoseki": "廃棄・消去規程、廃棄証明書（業者発行）、消去作業記録。"}, {"no": 31, "cat": "5. 情報資産管理", "ref": "5-7", "q": "データ消去・廃棄の記録（証明書等）を保管していますか。", "taiou": "書類はシュレッダー・溶解処理、機器・媒体は物理破壊または消去ソフトで処理し、廃棄証明書を取得・保管。", "ito": "不要になった情報が復元不能な形で確実に処分されているか（捨てたつもりの流出を防ぐ）。", "risk_own": "廃棄機器・書類からの情報流出（中古市場・ゴミからの復元）が発生する。", "risk_cli": "消去したはずの預託情報が廃棄経路から流出する。", "daitai": "専門業者を使わない場合も、暗号化消去や物理破壊（ドリル穿孔等）＋写真記録で代替可能。", "shoseki": "廃棄・消去規程、廃棄証明書（業者発行）、消去作業記録。"}, {"no": 32, "cat": "6. アクセス制御・認証", "ref": "6-1", "q": "情報システムへのアクセス権限を、業務上必要な範囲に限定して付与していますか（最小権限の原則）。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 33, "cat": "6. アクセス制御・認証", "ref": "6-2", "q": "利用者IDは個人単位で発行し、共用IDの利用を原則禁止していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 34, "cat": "6. アクセス制御・認証", "ref": "6-3", "q": "入社・異動・退職時に、アクセス権限を速やかに付与・変更・削除する手続がありますか。", "taiou": "人事イベント（入社・異動・退職）と連動したアカウント発行・変更・削除の申請フローを整備。退職日当日にアクセス権を停止。", "ito": "人の出入りに応じてアクセス権が漏れなく・遅滞なく更新される仕組みがあるか。", "risk_own": "退職者アカウントの放置が不正アクセス・内部不正の温床となる（実際の事故原因として頻出）。", "risk_cli": "退職者が取引先情報にアクセス可能な状態が残り、漏えい時は管理不備を問われる。", "daitai": "自動連携がなくても、人事部門から情シスへの通知ルール＋月次の棚卸で漏れを検知。", "shoseki": "アカウント管理手順書、発行・削除申請の記録、退職者アカウント停止の記録。"}, {"no": 35, "cat": "6. アクセス制御・認証", "ref": "6-4", "q": "アクセス権限の棚卸（定期的な見直し）を実施していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 36, "cat": "6. アクセス制御・認証", "ref": "6-5", "q": "パスワードの最低要件（長さ・複雑性・使い回し禁止等）を定めていますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 37, "cat": "6. アクセス制御・認証", "ref": "6-6", "q": "重要システムや社外からのアクセスに多要素認証（MFA）を導入していますか。", "taiou": "VPN・クラウドサービス・特権アカウント等の重要アクセスにMFA（認証アプリ・FIDO等）を適用。", "ito": "パスワードだけに依存しない認証で、認証情報漏えい時にも不正ログインを防げるか。", "risk_own": "フィッシング等で窃取されたパスワードだけで社内システム・クラウドに侵入され、被害が全社に及ぶ。", "risk_cli": "侵入したアカウント経由で取引先情報の窃取や取引先へのなりすまし攻撃が行われる。", "daitai": "MFA非対応システムでは、アクセス元IP制限・端末証明書・強固なパスワード＋監視強化で補完。", "shoseki": "MFA適用対象一覧・設定画面の画面写し、認証基盤の設定基準書。"}, {"no": 38, "cat": "6. アクセス制御・認証", "ref": "6-7", "q": "特権ID（管理者権限）の利用を制限し、利用状況を記録・監視していますか。", "taiou": "管理者権限を必要最小限の担当者に限定し、通常業務は一般権限で実施。特権操作のログを取得し定期レビュー。", "ito": "システムを何でもできる強い権限が、限定・記録・監視されているか。", "risk_own": "特権アカウントの悪用・乗っ取りにより、システム全体の改ざん・破壊・証跡消去まで可能になる。", "risk_cli": "全預託データへの一括アクセスが可能なため、漏えい時の被害が最大化する。", "daitai": "特権管理ツールがなければ、特権IDの共有廃止・利用申請制・操作ログの手動点検で補完。", "shoseki": "特権ID一覧・保有者一覧、利用申請/承認記録、特権操作ログのレビュー記録。"}, {"no": 39, "cat": "6. アクセス制御・認証", "ref": "6-8", "q": "一定回数のログイン失敗時にアカウントをロックする設定にしていますか。", "taiou": "一定回数（例：5回）のログイン失敗でアカウントを一時ロックする設定を全システムに適用。", "ito": "総当たり攻撃・パスワード推測攻撃を機械的に阻止する設定があるか。", "risk_own": "時間をかけた総当たり攻撃が成立し、気づかぬうちに侵入される。", "risk_cli": "乗っ取られたアカウントから預託情報への不正アクセスが行われる。", "daitai": "ロック機能がないシステムは、ログイン失敗の監視・アラートと強固なパスワード・MFAで補完。", "shoseki": "システムのロック設定値（設定画面・パラメータシート）、設定基準書。"}, {"no": 40, "cat": "7. 物理的セキュリティ", "ref": "7-1", "q": "オフィス・サーバ室等への入退室を制限・管理していますか（ICカード、施錠等）。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 41, "cat": "7. 物理的セキュリティ", "ref": "7-2", "q": "サーバ室・重要区画への入退室記録を保管していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 42, "cat": "7. 物理的セキュリティ", "ref": "7-3", "q": "来訪者の受付・記録・入館証の貸与等の手続を定めていますか。", "taiou": "来訪者は受付で記録し、入館証を貸与のうえ従業員が同行。無人での立ち入りを禁止。", "ito": "外部者の立ち入りが記録・管理され、単独行動できない運用があるか。", "risk_own": "来訪者を装った侵入・のぞき見・置き忘れ書類の持ち去りを防げない。", "risk_cli": "打合せエリア等で取引先関連情報が第三者の目に触れる。", "daitai": "受付システムがなければ、紙の来訪者記録簿＋同行ルールの徹底で十分機能する。", "shoseki": "来訪者受付記録、入館証管理簿、来訪者対応ルール。"}, {"no": 43, "cat": "7. 物理的セキュリティ", "ref": "7-4", "q": "クリアデスク・クリアスクリーン（離席時の施錠・画面ロック）をルール化していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 44, "cat": "7. 物理的セキュリティ", "ref": "7-5", "q": "重要書類・記録媒体を施錠保管していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 45, "cat": "7. 物理的セキュリティ", "ref": "7-6", "q": "サーバ・ネットワーク機器を地震・火災・水害・停電等から保護する対策（耐震、消火設備、UPS等）を講じていますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 46, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-1", "q": "業務用PC・モバイル端末を台帳で管理し、所在を把握していますか。", "taiou": "業務端末を台帳・MDM/資産管理ツールで管理し、ディスク暗号化（BitLocker等）と自動画面ロックを全台に適用。", "ito": "持ち運ばれる端末が紛失・盗難されても情報が守られる状態に、全台漏れなくなっているか。", "risk_own": "端末紛失＝即情報漏えいとなり、報告義務・信用失墜に直結する。", "risk_cli": "端末内の取引先情報・個人情報が第三者の手に渡る。", "daitai": "MDM未導入なら、OS標準の暗号化機能の手動設定＋設定状況の台帳管理で補完。", "shoseki": "端末管理台帳、暗号化設定の適用状況一覧（MDM/資産管理ツールのレポート）、端末設定基準書。"}, {"no": 47, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-2", "q": "端末のハードディスク・ストレージを暗号化していますか。", "taiou": "業務端末を台帳・MDM/資産管理ツールで管理し、ディスク暗号化（BitLocker等）と自動画面ロックを全台に適用。", "ito": "持ち運ばれる端末が紛失・盗難されても情報が守られる状態に、全台漏れなくなっているか。", "risk_own": "端末紛失＝即情報漏えいとなり、報告義務・信用失墜に直結する。", "risk_cli": "端末内の取引先情報・個人情報が第三者の手に渡る。", "daitai": "MDM未導入なら、OS標準の暗号化機能の手動設定＋設定状況の台帳管理で補完。", "shoseki": "端末管理台帳、暗号化設定の適用状況一覧（MDM/資産管理ツールのレポート）、端末設定基準書。"}, {"no": 48, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-3", "q": "端末に画面ロック（一定時間で自動ロック）を設定していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 49, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-4", "q": "私物端末の業務利用（BYOD）について、許可条件・管理ルールを定めていますか（または禁止していますか）。", "taiou": "私物端末の業務利用を原則禁止、または許可制（MDM登録・画面ロック・業務データ分離を条件）として規程化。", "ito": "会社の管理が及ばない端末による情報の取扱いが、無秩序になっていないか。", "risk_own": "管理外端末経由の漏えい・マルウェア持ち込みが発生しても、検知・調査ができない。", "risk_cli": "取引先情報が私物端末・個人クラウドに保存され、管理範囲外で漏えいする。", "daitai": "全面許可・全面禁止が難しければ、メール閲覧のみ許可等の限定利用＋Webメールのダウンロード制限で補完。", "shoseki": "BYOD規程（許可条件）、許可端末の登録台帳、MDMの管理画面。"}, {"no": 50, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-5", "q": "USBメモリ等の外部記録媒体の利用を制限・管理していますか。", "taiou": "USBメモリ等の利用を申請制とし、会社支給の暗号化媒体のみ許可。端末側でUSBポートの書き込み制御を実施。", "ito": "小さく紛失しやすい媒体による情報の持ち出し・紛失・マルウェア持ち込みが統制されているか。", "risk_own": "媒体の紛失・私物媒体経由のウイルス感染が発生し、経路の特定も難しい。", "risk_cli": "取引先情報入りの媒体が紛失し、暗号化されていなければ即漏えいとなる。", "daitai": "技術的制御が難しければ、原則禁止＋クラウド共有・ファイル転送サービスへの移行で媒体自体を不要化。", "shoseki": "媒体管理規程、媒体管理台帳（貸出記録）、デバイス制御の設定。"}, {"no": 51, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-6", "q": "端末・媒体の紛失・盗難時の報告手順と、リモートワイプ等の対応手段を整備していますか。", "taiou": "紛失・盗難時の即時報告ルールを周知し、MDMによるリモートロック・ワイプを実施できる体制を整備。", "ito": "紛失・盗難の発生を前提に、被害を最小化する即応手段が準備されているか。", "risk_own": "発見・報告の遅れで不正利用・漏えいが拡大し、報告義務への対応も遅れる。", "risk_cli": "取引先情報を含む端末が第三者に利用され、被害が取引先に及ぶ。", "daitai": "MDMがなければ、OS標準の「デバイスを探す」機能の有効化＋暗号化で最低限を担保。", "shoseki": "紛失時対応手順書、MDMの設定・ワイプ実行記録、（発生時）インシデント報告書。"}, {"no": 52, "cat": "8. 端末・モバイル機器・記録媒体の管理", "ref": "8-7", "q": "テレワーク時のセキュリティルール（作業環境・通信・端末の取扱い）を定めていますか。", "taiou": "テレワーク規程（VPN必須・公衆Wi-Fi禁止・家族との画面共有防止等）を定め、貸与端末のみで業務を許可。", "ito": "オフィス外の環境でも社内と同等の保護水準が維持される取り決めと技術的手当てがあるか。", "risk_own": "自宅・外出先の無防備な環境が侵入経路となり、のぞき見・家庭内共有機器経由の漏えいも起きる。", "risk_cli": "取引先情報が保護されていないネットワーク・環境で扱われる。", "daitai": "VDI・クラウドサービス化により端末にデータを残さない構成で環境リスクを低減。", "shoseki": "テレワーク規程、VPN利用記録、貸与端末一覧。"}, {"no": 53, "cat": "9. ネットワークセキュリティ", "ref": "9-1", "q": "インターネットとの境界にファイアウォール等を設置し、通信を制御していますか。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 54, "cat": "9. ネットワークセキュリティ", "ref": "9-2", "q": "社外から社内ネットワークへのアクセスにVPN等の暗号化された通信手段を使用していますか。", "taiou": "社外から社内へのアクセスはVPN（多要素認証付き）経由に限定し、VPN機器の脆弱性パッチを迅速に適用。", "ito": "社外からの接続経路が暗号化・認証で保護され、正規の経路以外で内部に入れないか。", "risk_own": "VPN機器の脆弱性・認証情報漏えいはランサムウェア侵入の最多経路であり、直接内部侵入を許す。", "risk_cli": "内部侵入経由で預託情報が窃取される。", "daitai": "VPNに代えてゼロトラスト型アクセス（IdP認証＋アプリ単位許可）の採用も有効。", "shoseki": "VPN構成図・設定書、利用者一覧、機器のパッチ適用記録。"}, {"no": 55, "cat": "9. ネットワークセキュリティ", "ref": "9-3", "q": "無線LANに強固な暗号化方式（WPA2以上）と認証を設定していますか。", "taiou": "社内無線LANはWPA2/WPA3で暗号化し、推測されにくい認証情報を設定。来客用SSIDは業務ネットワークと分離。", "ito": "電波で届く範囲の第三者から社内ネットワークへの侵入・盗聴を防げる設定か。", "risk_own": "無線経由で社外から社内LANに侵入され、盗聴・不正アクセスを受ける。", "risk_cli": "無線経由の侵入から取引先情報へ到達される。", "daitai": "古い機器でWPA2非対応の場合は買い替えが原則。暫定はネットワーク分離と有線化。", "shoseki": "無線LAN設定書（暗号化方式・SSID構成）、ネットワーク構成図。"}, {"no": 56, "cat": "9. ネットワークセキュリティ", "ref": "9-4", "q": "ゲスト用ネットワークを業務ネットワークから分離していますか。", "taiou": "基幹システム・サーバ群・執務端末・来客用を別セグメントに分離し、セグメント間通信をFWで制御。", "ito": "侵入・感染が起きても被害が全社に広がらない構造（横展開の抑止）になっているか。", "risk_own": "1台の感染が全社に波及し、ランサムウェアの被害範囲・復旧期間が最大化する。", "risk_cli": "末端の感染から預託情報を持つサーバまで容易に到達される。", "daitai": "物理的な分離が難しければ、VLAN・重要サーバのアクセス制御リストで論理分離。", "shoseki": "ネットワーク構成図（セグメント設計）、FW/VLAN設定書。"}, {"no": 57, "cat": "9. ネットワークセキュリティ", "ref": "9-5", "q": "重要システムのネットワークセグメントを分離していますか。", "taiou": "基幹システム・サーバ群・執務端末・来客用を別セグメントに分離し、セグメント間通信をFWで制御。", "ito": "侵入・感染が起きても被害が全社に広がらない構造（横展開の抑止）になっているか。", "risk_own": "1台の感染が全社に波及し、ランサムウェアの被害範囲・復旧期間が最大化する。", "risk_cli": "末端の感染から預託情報を持つサーバまで容易に到達される。", "daitai": "物理的な分離が難しければ、VLAN・重要サーバのアクセス制御リストで論理分離。", "shoseki": "ネットワーク構成図（セグメント設計）、FW/VLAN設定書。"}, {"no": 58, "cat": "9. ネットワークセキュリティ", "ref": "9-6", "q": "不正侵入検知・防御の仕組み（IDS/IPS、UTM等）を導入していますか。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 59, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-1", "q": "全ての端末・サーバにマルウェア対策ソフトを導入し、定義ファイルを最新に保っていますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 60, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-2", "q": "EDR等、侵入後の検知・対応を支援する仕組みを導入していますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 61, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-3", "q": "OS・ソフトウェアのセキュリティパッチを適時適用する運用（脆弱性管理）を定めていますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 62, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-4", "q": "サポート終了（EOL）のOS・ソフトウェアの利用を禁止・把握していますか。", "taiou": "OS・ソフトの保守期限を台帳管理し、EOL前に更改計画を立てて移行。やむを得ない継続利用は分離・監視を条件に期限付き承認。", "ito": "修正プログラムが提供されない機器・ソフトが、管理されないまま使われ続けていないか。", "risk_own": "EOL製品の脆弱性は恒久的に修正されず、時間とともに侵入リスクが増大し続ける。", "risk_cli": "EOL機器経由の侵入で預託情報が危険にさらされる。", "daitai": "即時更改が無理なら、ネットワーク分離・インターネット遮断・仮想パッチ（IPS）で隔離運用。", "shoseki": "資産台帳（サポート期限付き）、更改計画、リスク受容の承認記録。"}, {"no": 63, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-5", "q": "自社で利用するIT資産の脆弱性情報を継続的に収集していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 64, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-6", "q": "外部公開システムに対して脆弱性診断を定期的に実施していますか。", "taiou": "外部公開システムに年1回以上の脆弱性診断を実施し、指摘の重大度に応じた期限で改修。大規模改修時は都度診断。", "ito": "外部の攻撃者視点で自社の弱点を定期的に検証し、改修まで完了させているか。", "risk_own": "気づいていない弱点を攻撃者に先に発見され、Webサイト改ざん・侵入を許す。", "risk_cli": "公開システム経由で取引先関連情報が漏えいする。", "daitai": "商用診断が難しければ、無償ツール（OWASP ZAP等）による自主スキャン＋クラウドの標準診断機能で補完。", "shoseki": "診断報告書、指摘事項の改修記録（再診断結果）。"}, {"no": 65, "cat": "10. マルウェア対策・脆弱性管理", "ref": "10-7", "q": "迷惑メール・フィッシング対策（メールフィルタリング、送信ドメイン認証等）を実施していますか。", "taiou": "迷惑メールフィルタ・添付ファイル検査を導入し、SPF/DKIM/DMARCを設定。なりすましメールの検知を強化。", "ito": "攻撃の最多経路であるメールについて、人の注意力に頼る前の技術的な防波堤があるか。", "risk_own": "大量のフィッシング・ウイルスメールが従業員に直接届き、開封事故の確率が高止まりする。", "risk_cli": "自社ドメインをかたるなりすましメールで取引先が攻撃される（DMARC未設定の場合）。", "daitai": "メールサービス標準の保護機能（Microsoft 365/Google Workspace）の有効化・設定強化から着手。", "shoseki": "メールセキュリティ製品の設定、SPF/DKIM/DMARCのDNSレコード、検疫ログ。"}, {"no": 66, "cat": "11. ログ管理・監視", "ref": "11-1", "q": "重要なシステム・機器のログ（アクセスログ、操作ログ等）を取得していますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 67, "cat": "11. ログ管理・監視", "ref": "11-2", "q": "ログの保管期間を定め、改ざん・消去から保護していますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 68, "cat": "11. ログ管理・監視", "ref": "11-3", "q": "ログを定期的に、または自動的に監視・分析し、異常を検知する仕組みがありますか。", "taiou": "SIEM・監視サービス（SOC）で不審なログイン・大量データ転送等のアラートを設定し、検知時の対応手順を整備。", "ito": "記録を「取るだけ」でなく、異常をタイムリーに発見し対応につなげる監視があるか。", "risk_own": "侵入から発覚まで数か月を要し（潜伏期間の長期化）、被害が静かに拡大する。", "risk_cli": "預託情報の窃取に長期間気づかず、取引先への通知が大幅に遅れる。", "daitai": "SOC委託が難しければ、主要システムの失敗ログイン・管理者操作に絞ったアラート設定から開始。", "shoseki": "監視設計書（検知ルール）、SOC契約書、アラート対応記録。"}, {"no": 69, "cat": "11. ログ管理・監視", "ref": "11-4", "q": "システム間で時刻同期（NTP等）を行っていますか。", "taiou": "全サーバ・NW機器をNTPで標準時刻源に同期させる設定を統一。", "ito": "複数システムのログを突き合わせて調査できるよう、時刻が揃っているか。", "risk_own": "ログの時刻がずれ、インシデント調査で出来事の順序を再構成できない。", "risk_cli": "取引先への影響範囲・時系列の正確な報告ができない。", "daitai": "ドメイン環境なら標準の時刻同期階層の確認のみで対応可能。", "shoseki": "NTP設定（設定書・設定画面）、時刻同期構成図。"}, {"no": 70, "cat": "12. データ保護・暗号化", "ref": "12-1", "q": "重要情報を社外に送信・持ち出しする際の暗号化・パスワード保護等のルールを定めていますか。", "taiou": "暗号化の適用場面・アルゴリズム基準・鍵の保管/更新ルールを規程化。ファイル送付はパスワード別送でなく共有リンク等を利用。", "ito": "暗号化が場当たりでなく、方式・鍵管理まで含めて統制されているか。", "risk_own": "弱い方式・不適切な鍵管理により、暗号化していても実質保護されない。", "risk_cli": "「暗号化済み」として預かった情報が実際には復元可能な状態で流出する。", "daitai": "詳細な規程が難しければ、OS・クラウド標準の暗号化機能に統一し設定基準のみ文書化。", "shoseki": "暗号化利用規程、鍵管理台帳・手順、暗号化方式の一覧。"}, {"no": 71, "cat": "12. データ保護・暗号化", "ref": "12-2", "q": "Webサイト・システムでの通信を暗号化（TLS/SSL）していますか。", "taiou": "Webサイト・システム間通信をTLSで暗号化し、証明書の有効期限を管理。古い暗号方式（TLS1.0等）は無効化。", "ito": "ネットワーク上を流れる情報が盗聴されても読めない状態になっているか。", "risk_own": "通信経由で認証情報・重要データが盗聴・改ざんされる。", "risk_cli": "取引先とのやり取り（見積・個人データ授受等）が第三者に取得される。", "daitai": "レガシーシステムで暗号化不能な区間は、VPN・閉域網でトンネル暗号化。", "shoseki": "TLS設定（証明書情報・対応プロトコル）、暗号化通信の設定基準。"}, {"no": 72, "cat": "12. データ保護・暗号化", "ref": "12-3", "q": "暗号鍵・証明書の管理ルールを定めていますか。", "taiou": "暗号化の適用場面・アルゴリズム基準・鍵の保管/更新ルールを規程化。ファイル送付はパスワード別送でなく共有リンク等を利用。", "ito": "暗号化が場当たりでなく、方式・鍵管理まで含めて統制されているか。", "risk_own": "弱い方式・不適切な鍵管理により、暗号化していても実質保護されない。", "risk_cli": "「暗号化済み」として預かった情報が実際には復元可能な状態で流出する。", "daitai": "詳細な規程が難しければ、OS・クラウド標準の暗号化機能に統一し設定基準のみ文書化。", "shoseki": "暗号化利用規程、鍵管理台帳・手順、暗号化方式の一覧。"}, {"no": 73, "cat": "12. データ保護・暗号化", "ref": "12-4", "q": "重要情報の社外への持ち出し・メール誤送信を防止する対策（DLP、送信時の上長承認、宛先確認等）を実施していますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 74, "cat": "13. クラウド・外部サービスの利用", "ref": "13-1", "q": "クラウドサービスの利用可否を判断する基準・承認手続を定めていますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 75, "cat": "13. クラウド・外部サービスの利用", "ref": "13-2", "q": "利用中のクラウドサービスを一覧化し、管理責任者を定めていますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 76, "cat": "13. クラウド・外部サービスの利用", "ref": "13-3", "q": "クラウドサービスのセキュリティ設定（公開範囲、アクセス権等）を定期的に点検していますか。", "taiou": "クラウドストレージ・SaaSの共有設定を四半期ごとに点検し、全公開・無期限リンクを検出・是正。CSPM等の設定監査も活用。", "ito": "クラウドの設定ミス（意図せぬ公開）を定期的に発見・是正する運用があるか。", "risk_own": "設定ミスによる情報公開は近年最多の漏えい原因の一つで、放置期間だけ被害が拡大する。", "risk_cli": "取引先情報がインターネット上に公開状態で放置される。", "daitai": "ツールがなくても、公開リンクの棚卸・共有権限の定期レビューを手動チェックリストで実施。", "shoseki": "設定点検の記録（チェックリスト）、是正記録、CSPM/監査ツールのレポート。"}, {"no": 77, "cat": "13. クラウド・外部サービスの利用", "ref": "13-4", "q": "クラウド事業者の安全性（認証取得状況、データ保管場所、SLA等）を評価していますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 78, "cat": "14. システムの開発・変更管理", "ref": "14-1", "q": "システムの開発・変更時にセキュリティ要件を定め、テストを実施していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 79, "cat": "14. システムの開発・変更管理", "ref": "14-2", "q": "本番環境と開発・テスト環境を分離していますか。", "taiou": "本番・開発・テスト環境を分離し、アクセス権も分ける。テストには本番データを使わずマスキング・ダミーデータを使用。", "ito": "開発・テスト作業が本番サービスと本番データを危険にさらさない構造か。", "risk_own": "テストミスによる本番障害、保護の緩いテスト環境からの本番データ流出が起きる。", "risk_cli": "取引先の実データがテスト環境経由で漏えいする。", "daitai": "環境分離が不完全なら、まず本番データのテスト利用禁止（ダミーデータ整備）を先行。", "shoseki": "環境構成図、環境別アクセス権一覧、テストデータ作成手順。"}, {"no": 80, "cat": "14. システムの開発・変更管理", "ref": "14-3", "q": "本番データを開発・テストに利用する場合のルール（マスキング等）を定めていますか。", "taiou": "本番・開発・テスト環境を分離し、アクセス権も分ける。テストには本番データを使わずマスキング・ダミーデータを使用。", "ito": "開発・テスト作業が本番サービスと本番データを危険にさらさない構造か。", "risk_own": "テストミスによる本番障害、保護の緩いテスト環境からの本番データ流出が起きる。", "risk_cli": "取引先の実データがテスト環境経由で漏えいする。", "daitai": "環境分離が不完全なら、まず本番データのテスト利用禁止（ダミーデータ整備）を先行。", "shoseki": "環境構成図、環境別アクセス権一覧、テストデータ作成手順。"}, {"no": 81, "cat": "14. システムの開発・変更管理", "ref": "14-4", "q": "システム変更の承認・記録の手続（変更管理）を定めていますか。", "taiou": "システム変更を申請・影響評価・承認・記録のフローで管理し、緊急変更も事後承認を必須化。", "ito": "無断・無計画な変更による障害・セキュリティ低下を防ぐ統制があるか。", "risk_own": "変更起因の障害・設定ミスが多発し、原因追跡もできない。", "risk_cli": "変更ミスによる取引先向けサービス停止・データ破損が起きる。", "daitai": "重量級のフローが難しければ、変更記録簿＋重要システムのみ承認必須の簡易運用から開始。", "shoseki": "変更管理手順書、変更申請・承認記録、リリース記録。"}, {"no": 82, "cat": "15. インシデント対応", "ref": "15-1", "q": "セキュリティインシデント発生時の対応体制（責任者・連絡網・CSIRT等）を整備していますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 83, "cat": "15. インシデント対応", "ref": "15-2", "q": "インシデント対応手順（検知・報告・初動・復旧・再発防止）を文書化していますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 84, "cat": "15. インシデント対応", "ref": "15-3", "q": "従業員がインシデント・その兆候を速やかに報告する窓口・ルールを周知していますか。", "taiou": "「気づいたら30分以内に情シスへ」等の報告ルールと窓口（メール・電話・チャット）を全従業員に周知。報告者を非難しない方針を明示。", "ito": "従業員が異変に気づいた時、ためらわず・すぐに報告される文化と経路があるか。", "risk_own": "報告の遅れ・隠蔽により対応開始が遅れ、被害と法的リスクが拡大する。", "risk_cli": "預託情報に関わる事故の把握・通知が遅れる。", "daitai": "窓口一本化が難しければ、上長経由でも即日で情シスに届くエスカレーションルールを規定。", "shoseki": "報告ルールの周知資料（イントラ掲示等）、報告受付の記録、教育資料。"}, {"no": 85, "cat": "15. インシデント対応", "ref": "15-4", "q": "インシデント対応の訓練・演習を定期的に実施していますか。", "taiou": "年1回、ランサムウェア感染等を想定した机上演習を実施し、連絡・判断・復旧の流れを確認。結果を手順書に反映。", "ito": "緊急時対応の手順・体制が「文書があるだけ」でなく、実際に機能するかを訓練で検証しているか。", "risk_own": "実際のインシデント時に手順が機能せず、初動遅延により被害・停止期間が拡大する。", "risk_cli": "復旧遅延により取引先向けサービス・納品が長期間停止し、連絡も混乱する。", "daitai": "小規模でも年1回の読み合わせ・ウォークスルーで代替可能。外部ベンダーの演習サービス利用も有効。", "shoseki": "演習計画書・シナリオ、実施報告書、発見された課題と改善のフォロー記録。"}, {"no": 86, "cat": "15. インシデント対応", "ref": "15-5", "q": "インシデントの記録を残し、再発防止策につなげていますか。", "taiou": "インシデントごとに原因分析（技術・プロセス・人の観点）と再発防止策を文書化し、実施完了まで追跡。類似事例を教育に反映。", "ito": "同じ事故を繰り返さないための学習サイクルが回っているか。", "risk_own": "同種インシデントが再発し、対策の説得力・組織の信頼が失われる。", "risk_cli": "再発時、取引先への説明責任（前回の再発防止策の不履行）を問われる。", "daitai": "重大事象に限定した振り返り会＋改善アクションリストの運用から開始。", "shoseki": "インシデント報告書（原因分析・再発防止策）、対策実施のフォロー記録。"}, {"no": 87, "cat": "15. インシデント対応", "ref": "15-6", "q": "個人情報漏えい等の際の監督官庁・本人への報告・通知手順を整備していますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", "shoseki": "報告・通知手順書、報告書式のひな形、（発生時）報告書控え。"}, {"no": 88, "cat": "15. インシデント対応", "ref": "15-7", "q": "過去3年間に重大なセキュリティインシデント（情報漏えい、ランサムウェア被害等）は発生していませんか。※発生している場合は「いいえ」を選択し、概要と再発防止策を記載してください。", "taiou": "過去のインシデント（有無・概要・対応結果）を記録・管理し、開示要否を判断できる状態にしておく。", "ito": "過去の事故歴とその対応・再発防止の実績を誠実に開示できるか（隠さないか）。", "risk_own": "虚偽・不開示が後に発覚した場合、信頼喪失・契約解除・損害賠償のリスクが事故自体より大きくなる。", "risk_cli": "取引先がリスクを誤認したまま取引を継続する。", "daitai": "事故歴がある場合は、概要・対応・再発防止策をセットで説明することで信頼を維持できる。", "shoseki": "インシデント管理台帳、（該当時）報告書・再発防止策の実施記録。"}, {"no": 89, "cat": "16. バックアップ・事業継続", "ref": "16-1", "q": "重要なデータ・システムのバックアップを定期的に取得していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 90, "cat": "16. バックアップ・事業継続", "ref": "16-2", "q": "バックアップからの復旧テストを定期的に実施していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 91, "cat": "16. バックアップ・事業継続", "ref": "16-3", "q": "バックアップをネットワークから分離した場所または遠隔地に保管していますか（ランサムウェア対策）。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 92, "cat": "16. バックアップ・事業継続", "ref": "16-4", "q": "IT障害・サイバー攻撃を想定した事業継続計画（BCP）・復旧手順を策定していますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 93, "cat": "16. バックアップ・事業継続", "ref": "16-5", "q": "重要システムの目標復旧時間（RTO）・目標復旧時点（RPO）を定めていますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 94, "cat": "17. 委託先・サプライチェーン管理", "ref": "17-1", "q": "業務委託先の選定時に、セキュリティ対策状況を評価していますか。", "taiou": "委託先選定時にセキュリティチェックシート・認証取得状況等で対策水準を評価し、基準を満たす先とのみ契約。", "ito": "情報を預ける相手の安全性を、契約前に確認する仕組みがあるか。", "risk_own": "対策の弱い委託先経由の漏えい（サプライチェーン事故）が発生し、委託元としての管理責任を問われる。", "risk_cli": "取引先から預かった情報を再委託先経由で漏えいさせ、契約違反となる。", "daitai": "詳細評価が難しければ、認証（ISMS・Pマーク）の有無確認＋簡易チェックリストで最低限を担保。", "shoseki": "委託先選定基準、評価記録（チェックシート回収結果）、委託先一覧。"}, {"no": 95, "cat": "17. 委託先・サプライチェーン管理", "ref": "17-2", "q": "委託契約に秘密保持・安全管理措置・再委託制限・事故時の報告義務等を定めていますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく契約上の義務として担保されているか。", "risk_own": "委託先事故の際に責任追及・損害回復の法的根拠を欠き、対応費用を自社で負担することになる。", "risk_cli": "取引先への責任（預託情報の保護義務）を委託先に連鎖させられず、履行できない。", "daitai": "既存契約の改定が難しければ、覚書・個別発注書へのセキュリティ条項追加で補完。", "shoseki": "委託契約書のセキュリティ条項（ひな形）、締結済み契約の管理台帳。"}, {"no": 96, "cat": "17. 委託先・サプライチェーン管理", "ref": "17-3", "q": "委託先のセキュリティ対策状況を定期的に確認（点検・監査）していますか。", "taiou": "重要委託先に年1回のチェックシート提出・報告会を求め、重要度に応じて実地監査も実施。結果を契約継続判断に反映。", "ito": "契約時だけでなく、委託期間中も相手の対策水準が維持されているかを確認しているか。", "risk_own": "委託先の対策劣化・体制変化に気づかず、事故が起きて初めて把握することになる。", "risk_cli": "劣化した委託先経由で取引先の情報が漏えいする。", "daitai": "全委託先が難しければ、預託情報の重要度で層別し、重要先のみ年次確認・他は契約更新時確認とする。", "shoseki": "委託先評価の年次記録、監査報告書、委託先管理台帳（評価結果付き）。"}, {"no": 97, "cat": "17. 委託先・サプライチェーン管理", "ref": "17-4", "q": "再委託先の管理状況を把握していますか。", "taiou": "再委託を事前承認制とし、再委託先の名称・対策状況の報告を義務付け。再委託先にも同水準の義務を課すことを契約に明記。", "ito": "自社の知らない所で情報が第三者に渡っていないか。委託の連鎖まで統制が及んでいるか。", "risk_own": "把握していない再委託先で事故が起き、管理責任と説明不能状態に陥る。", "risk_cli": "取引先が許可していない再委託により、預託情報が契約外の第三者に渡る。", "daitai": "全面統制が難しければ、個人情報・機密情報を扱う業務に限定した再委託承認制から開始。", "shoseki": "再委託承認記録、再委託先一覧、契約の再委託条項。"}, {"no": 98, "cat": "17. 委託先・サプライチェーン管理", "ref": "17-5", "q": "委託終了時に、預けた情報の返却・消去を確認していますか。", "taiou": "委託終了時に預託情報の返却または消去を求め、消去証明書の提出を契約で義務化。自社の預かり情報も同様に対応。", "ito": "取引が終わった後に情報が相手方に残り続けない仕組みがあるか。", "risk_own": "終了後に残存した情報が旧委託先から漏えいし、原因究明も困難になる。", "risk_cli": "取引終了後も取引先の情報を保持し続け、契約違反・漏えい源となる。", "daitai": "証明書取得が難しい場合、返却・消去の完了報告書（自己申告＋作業記録）で代替。", "shoseki": "消去証明書・返却受領書、契約の終了時条項、対応記録。"}, {"no": 99, "cat": "18. 個人情報保護・法令遵守", "ref": "18-1", "q": "個人情報保護法に基づく安全管理措置を講じ、社内規程を整備していますか。", "taiou": "個人情報保護規程を整備し、取扱状況の台帳（保有個人データ管理簿）を維持。安全管理措置・第三者提供・保存期間のルールを運用。", "ito": "個人情報保護法の求める安全管理措置・手続が、実務として運用されているか。", "risk_own": "法令違反による行政処分・損害賠償・漏えい時の報告義務違反が発生する。", "risk_cli": "取引先から預かった個人データの事故で、取引先自身が本人・当局対応を迫られる。", "daitai": "個人情報保護委員会公表のガイドライン・中小企業向けチェックリストに沿った最小限の体制から整備。", "shoseki": "個人情報保護規程、 const ASPECTS = [
  {k:'ito',      label:'設問の意図',       desc:'「何が求められているのか」を当てる', stem:'この設問が確認しようとしている意図（何が求められているのか）として、最も適切なものはどれですか？'},
  {k:'risk_own', label:'自社へのリスク',   desc:'未実施の場合に自社に生じるリスクを当てる', stem:'この対策を実施していない場合に「自社」に生じるリスクとして、最も適切なものはどれですか？'},
  {k:'risk_cli', label:'取引先へのリスク', desc:'未実施の場合に取引先へ与えるリスクを当てる', stem:'この対策を実施していない場合に「取引先」へ与えるリスクとして、最も適切なものはどれですか？'},
  {k:'taiou',    label:'対策・回答例',     desc:'具体的な対応例（回答の書き方の軸）を当てる', stem:'この設問に対する具体的な対応例（回答例の軸となる取り組み）として、最も適切なものはどれですか？'},
  {k:'mix',      label:'ミックス',         desc:'上の4観点からランダムに出題', stem:''}
];

let selAspect='ito', selCats=new Set(DATA.cats), selOrd='seq', selCnt=0;
let queue=[], idx=0, score=0, results=[]; // results: {item, aspect, correct}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start screen ---------- */
$('totalItems').textContent=DATA.items.length;
const aspectBox=$('aspectBox');
ASPECTS.forEach(a=>{
  const b=document.createElement('button');
  b.className='mode-btn'+(a.k===selAspect?' sel':'');
  b.innerHTML='<b>'+a.label+'</b><span>'+a.desc+'</span>';
  b.onclick=()=>{selAspect=a.k;[...aspectBox.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();};
  aspectBox.appendChild(b);
});
const catBox=$('catBox');
DATA.cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip sel'; b.textContent=c.replace(/^\d+\.\s*/,'');
  b.onclick=()=>{ if(selCats.has(c)){selCats.delete(c);b.classList.remove('sel');} else {selCats.add(c);b.classList.add('sel');} updateInfo(); };
  catBox.appendChild(b);
});
$('chipAll').onclick=()=>{selCats=new Set(DATA.cats);[...catBox.children].forEach(c=>c.classList.add('sel'));updateInfo();};
$('chipNone').onclick=()=>{selCats.clear();[...catBox.children].forEach(c=>c.classList.remove('sel'));updateInfo();};
document.querySelectorAll('.ordChip').forEach(b=>b.onclick=()=>{selOrd=b.dataset.v;document.querySelectorAll('.ordChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
document.querySelectorAll('.cntChip').forEach(b=>b.onclick=()=>{selCnt=+b.dataset.v;document.querySelectorAll('.cntChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();});
function pool(){return DATA.items.filter(i=>selCats.has(i.cat));}
function updateInfo(){
  const n=pool().length, m=selCnt>0?Math.min(selCnt,n):n;
  $('startInfo').textContent='対象 '+n+' 問中 '+m+' 問を出題します';
  $('btnStart').disabled=n===0;
}
updateInfo();

/* ---------- question building ---------- */
function buildQueue(items){
  return items.map(it=>{
    const asp = selAspect==='mix' ? ASPECTS[Math.floor(Math.random()*4)].k : selAspect;
    return {item:it, aspect:asp};
  });
}
function makeOptions(q){
  const f=q.aspect, correct=q.item[f];
  // 同一テキストを持つ設問が存在するため、テキスト単位で重複を除去して選択肢を作る
  const uniq=arr=>{const seen=new Set(),out=[];arr.forEach(t=>{if(t&&t!==correct&&!seen.has(t)){seen.add(t);out.push(t);}});return out;};
  const others=DATA.items.filter(i=>i!==q.item);
  const otherCat=others.filter(i=>i.cat!==q.item.cat);
  let pool=uniq(shuffle(otherCat.slice()).map(i=>i[f]));
  if(pool.length<3) pool=uniq([...pool, ...shuffle(others.slice()).map(i=>i[f])]);
  const picked=pool.slice(0,3);
  return shuffle([{t:correct,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- screens ---------- */
function show(id){['scrStart','scrQuiz','scrResult'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

$('btnStart').onclick=()=>{
  let items=pool();
  if(selOrd==='shuf') items=shuffle(items.slice()); else items=items.slice();
  if(selCnt>0){ items=(selOrd==='shuf'?items:shuffle(items.slice())).slice(0,selCnt); if(selOrd==='seq') items.sort((a,b)=>a.no-b.no); }
  queue=buildQueue(items); idx=0; score=0; results=[];
  startQuiz();
};
function startQuiz(){ $('qTotal').textContent=queue.length; $('qScore').textContent=0; show('scrQuiz'); render(); }

function render(){
  const q=queue[idx], asp=ASPECTS.find(a=>a.k===q.aspect);
  $('qPos').textContent=idx+1;
  $('pbar').style.width=(idx/queue.length*100)+'%';
  $('qMeta').innerHTML=
    '<span class="tag cat">'+esc(q.item.cat)+'</span>'+
    '<span class="tag asp">出題観点：'+asp.label+'</span>'+
    (q.item.ref?'<span class="tag ref">'+esc(DATA.refLabel)+'：'+esc(q.item.ref)+'</span>':'');
  $('qSetsumon').textContent='設問　'+q.item.q;
  $('qStem').textContent='Q'+(idx+1)+'. '+asp.stem;
  const opts=makeOptions(q), box=$('qOpts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mark">'+labels[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=()=>answer(b,o,opts,box);
    box.appendChild(b);
  });
  $('qJudge').classList.add('hidden');
  $('qExpl').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnNext').textContent = idx===queue.length-1 ? '結果を見る →' : '次の問題 →';
}

function answer(btn,opt,opts,box){
  [...box.children].forEach((b,i)=>{ b.disabled=true; if(opts[i].ok) b.classList.add('correct'); });
  if(!opt.ok) btn.classList.add('wrong');
  if(opt.ok) score++;
  $('qScore').textContent=score;
  results.push({item:queue[idx].item, aspect:queue[idx].aspect, correct:opt.ok});
  const j=$('qJudge');
  j.textContent=opt.ok?'○ 正解！':'× 不正解';
  j.className='judge '+(opt.ok?'ok':'ng');
  j.classList.remove('hidden');
  showExpl(queue[idx].item);
  $('btnNext').classList.remove('hidden');
}

function showExpl(it){
  const e=$('qExpl');
  e.innerHTML=
    '<div class="ex ito"><h4>💡 設問の意図（何が求められているのか）</h4><p>'+esc(it.ito)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（自社）</h4><p>'+esc(it.risk_own)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（取引先）</h4><p>'+esc(it.risk_cli)+'</p></div>'+
    '<div class="ex ans"><h4>✅ 具体的な対策・回答例</h4><p>'+esc(it.taiou)+'</p></div>'+
    (it.daitai?'<div class="ex alt"><h4>🔁 実施していない場合の代替策</h4><p>'+esc(it.daitai)+'</p></div>':'')+
    (it.shoseki?'<div class="ex ev"><h4>📎 証跡を求められた場合の資料例</h4><p>'+esc(it.shoseki)+'</p></div>':'');
  e.classList.remove('hidden');
}

$('btnNext').onclick=()=>{ idx++; if(idx>=queue.length) finish(); else render(); };
$('btnQuit').onclick=()=>{ if(results.length===0){show('scrStart');return;} finish(); };

function finish(){
  const n=results.length;
  $('pbar').style.width='100%';
  $('rScore').textContent=score+' / '+n+' 問正解';
  const pct=n?Math.round(score/n*100):0;
  $('rSub').textContent='正答率 '+pct+'%'+(pct===100?'　全問正解です！':pct>=80?'　あと少しで完璧です':'　解説を読み返して再挑戦しましょう');
  const byCat={};
  results.forEach(r=>{ const c=r.item.cat; byCat[c]=byCat[c]||{ok:0,n:0}; byCat[c].n++; if(r.correct) byCat[c].ok++; });
  const tb=$('rCats'); tb.innerHTML='';
  Object.keys(byCat).forEach(c=>{
    const v=byCat[c], p=Math.round(v.ok/v.n*100);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c)+'</td><td class="num">'+v.ok+'/'+v.n+'</td><td style="width:120px"><div class="bar"><i style="width:'+p+'%"></i></div></td>';
    tb.appendChild(tr);
  });
  $('btnRetryWrong').style.display = results.some(r=>!r.correct) ? '' : 'none';
  show('scrResult');
}
$('btnRetryWrong').onclick=()=>{
  const wrong=results.filter(r=>!r.correct);
  queue=wrong.map(r=>({item:r.item,aspect:r.aspect}));
  idx=0;score=0;results=[];
  startQuiz();
};
$('btnHome').onclick=()=>show('scrStart');
</script>
</body>
</html>
