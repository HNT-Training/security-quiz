<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セキュ問題集 IPA">
<meta name="theme-color" content="#db2777">
<title>IPA中小企業ガイドライン観点｜習熟問題集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --ng:#dc2626; --ng-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --sub:#9ca3af; --line:#374151;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --ok:#34d399; --ok-soft:#064e3b;
    --ng:#f87171; --ng-soft:#5f1e1e; --warn:#fbbf24; --warn-soft:#4a3b10;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.app{padding:18px 0 6px}
header.app h1{font-size:19px;font-weight:700}
header.app .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h2.sec{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode-btn{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn span{color:var(--sub);font-size:12px}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:12.5px;color:var(--sub)}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;border-radius:6px;padding:2.5px 8px;font-weight:600}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.asp{background:var(--warn-soft);color:var(--warn)}
.tag.ref{background:var(--line);color:var(--sub)}
.setsumon{font-size:15.5px;font-weight:700;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;transition:.15s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.judge{margin-top:14px;font-size:16px;font-weight:800}
.judge.ok{color:var(--ok)}
.judge.ng{color:var(--ng)}
/* explanation */
.expl{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ex h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex p{font-size:13.5px}
.ex.ito h4{color:var(--accent)}
.ex.risk h4{color:var(--ng)}
.ex.ans h4{color:var(--ok)}
.ex.alt h4{color:var(--warn)}
.ex.ev h4{color:var(--sub)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* result */
.score-big{font-size:42px;font-weight:800;text-align:center}
.score-sub{text-align:center;color:var(--sub);margin-bottom:16px}
table.catres{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.catres th,table.catres td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.catres td.num{text-align:right;white-space:nowrap}
.bar{background:var(--line);height:8px;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>IPA中小企業ガイドライン観点｜習熟問題集</h1>
    <div class="sub">セキュリティチェックシート（IPA中小企業の情報セキュリティ対策ガイドライン観点・網羅版） をもとに自動生成した4択演習（全 <span id="totalItems"></span> 問）。設問の意図・リスク・対策・回答例を学びます。</div>
  </header>

  <!-- START SCREEN -->
  <div id="scrStart">
    <div class="card">
      <h2 class="sec">1. 出題観点を選ぶ</h2>
      <div class="modes" id="aspectBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">2. 出題カテゴリを選ぶ（複数選択可）</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="chipAll">すべて選択</button>
        <button class="chip" id="chipNone">すべて解除</button>
      </div>
      <div class="chips" id="catBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">3. 出題順・出題数</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ordChip sel" data-v="seq">項番どおり</button>
        <button class="chip ordChip" data-v="shuf">シャッフル</button>
      </div>
      <div class="row">
        <button class="chip cntChip sel" data-v="0">全問</button>
        <button class="chip cntChip" data-v="10">10問</button>
        <button class="chip cntChip" data-v="20">20問</button>
        <button class="chip cntChip" data-v="30">30問</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnStart">スタート</button>
      <span class="small" id="startInfo"></span>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="scrQuiz" class="hidden">
    <div class="topbar">
      <span class="pill">問題 <b id="qPos"></b> / <span id="qTotal"></span></span>
      <span class="pill">正解 <b id="qScore">0</b></span>
      <button class="btn ghost" id="btnQuit" style="padding:5px 14px;font-size:12.5px">中断して結果を見る</button>
    </div>
    <div class="progress"><i id="pbar" style="width:0%"></i></div>
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="setsumon" id="qSetsumon"></div>
      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="judge hidden" id="qJudge"></div>
      <div class="expl hidden" id="qExpl"></div>
      <div class="nav">
        <span></span>
        <button class="btn primary hidden" id="btnNext">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="scrResult" class="hidden">
    <div class="card">
      <div class="score-big" id="rScore"></div>
      <div class="score-sub" id="rSub"></div>
      <h2 class="sec">カテゴリ別の成績</h2>
      <table class="catres"><tbody id="rCats"></tbody></table>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnRetryWrong">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btnHome">最初の画面に戻る</button>
    </div>
  </div>

  <footer>学習用に自動生成された問題集です。選択肢の誤答は他の設問の解説文から引用しています。／ 出典: セキュリティチェックシート_IPA中小企業ガイドライン観点_網羅版_解説付き.xlsx</footer>
</div>

の所在を契約等で明確にしていますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく契約上の義務として担保されているか。", "risk_own": "委託先事故の際に責任追及・損害回復の法的根拠を欠き、対応費用を自社で負担することになる。", "risk_cli": "取引先への責任（預託情報の保護義務）を委託先に連鎖させられず、履行できない。", "daitai": "既存契約の改定が難しければ、覚書・個別発注書へのセキュリティ条項追加で補完。", "shoseki": "委託契約書のセキュリティ条項（ひな形）、締結済み契約の管理台帳。"}, {"no": 10, "cat": "1. 経営者の取り組み（経営者編：3原則）", "ref": "経営者編 重要7項目", "q": "情報セキュリティに関する最新動向（脅威・注意喚起等）を継続的に収集していますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 11, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条①", "q": "OS・ソフトウェアのアップデートを速やかに適用し、常に最新の状態に保っていますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 12, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条①", "q": "サポートが終了したOS・ソフトウェアを使用していないことを確認していますか。", "taiou": "OS・ソフトの保守期限を台帳管理し、EOL前に更改計画を立てて移行。やむを得ない継続利用は分離・監視を条件に期限付き承認。", "ito": "修正プログラムが提供されない機器・ソフトが、管理されないまま使われ続けていないか。", "risk_own": "EOL製品の脆弱性は恒久的に修正されず、時間とともに侵入リスクが増大し続ける。", "risk_cli": "EOL機器経由の侵入で預託情報が危険にさらされる。", "daitai": "即時更改が無理なら、ネットワーク分離・インターネット遮断・仮想パッチ（IPS）で隔離運用。", "shoseki": "資産台帳（サポート期限付き）、更改計画、リスク受容の承認記録。"}, {"no": 13, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条②", "q": "全てのPC・サーバにウイルス対策ソフトを導入していますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 14, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条②", "q": "ウイルス定義ファイルを自動更新等により最新の状態に保っていますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 15, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条③", "q": "パスワードは長く・複雑にし、使い回しをしないルールを定めていますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 16, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条③", "q": "初期パスワードのまま使用している機器・サービスがないことを確認していますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 17, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条③", "q": "重要なサービスには多要素認証を設定していますか。", "taiou": "VPN・クラウドサービス・特権アカウント等の重要アクセスにMFA（認証アプリ・FIDO等）を適用。", "ito": "パスワードだけに依存しない認証で、認証情報漏えい時にも不正ログインを防げるか。", "risk_own": "フィッシング等で窃取されたパスワードだけで社内システム・クラウドに侵入され、被害が全社に及ぶ。", "risk_cli": "侵入したアカウント経由で取引先情報の窃取や取引先へのなりすまし攻撃が行われる。", "daitai": "MFA非対応システムでは、アクセス元IP制限・端末証明書・強固なパスワード＋監視強化で補完。", "shoseki": "MFA適用対象一覧・設定画面の画面写し、認証基盤の設定基準書。"}, {"no": 18, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条④", "q": "ファイル共有・クラウドサービスの共有設定（公開範囲）を定期的に見直していますか。", "taiou": "クラウドストレージ・SaaSの共有設定を四半期ごとに点検し、全公開・無期限リンクを検出・是正。CSPM等の設定監査も活用。", "ito": "クラウドの設定ミス（意図せぬ公開）を定期的に発見・是正する運用があるか。", "risk_own": "設定ミスによる情報公開は近年最多の漏えい原因の一つで、放置期間だけ被害が拡大する。", "risk_cli": "取引先情報がインターネット上に公開状態で放置される。", "daitai": "ツールがなくても、公開リンクの棚卸・共有権限の定期レビューを手動チェックリストで実施。", "shoseki": "設定点検の記録（チェックリスト）、是正記録、CSPM/監査ツールのレポート。"}, {"no": 19, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条④", "q": "ネットワーク機器（ルータ等）の設定を確認し、不要な公開・機能を無効化していますか。", "taiou": "サーバ・端末・NW機器のセキュア設定基準（不要サービス停止・初期パスワード変更等）を定め、構築時チェックリストで確認。", "ito": "機器・システムが安全な設定で構築・維持され、設定の劣化を防ぐ管理があるか。", "risk_own": "初期設定・不要機能の放置が侵入口となる（初期パスワードのままの機器等）。", "risk_cli": "設定不備の機器経由で預託情報に到達される。", "daitai": "ベンダー・CISのハードニングガイドを流用した簡易チェックリストから開始。", "shoseki": "設定基準書（ハードニング基準）、構築時チェックリスト、設定監査の記録。"}, {"no": 20, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条⑤", "q": "フィッシング・ビジネスメール詐欺・ランサムウェア等の脅威や攻撃の手口に関する情報を従業員に周知していますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 21, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条⑥", "q": "重要なデータのバックアップを定期的に取得していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 22, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "6か条⑥", "q": "バックアップの一部をネットワークから切り離して保管する等、ランサムウェア対策を考慮した保管をしていますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 23, "cat": "2. 基本的対策（情報セキュリティ6か条）", "ref": "自社診断 Part1", "q": "重要情報に対して、閲覧・利用できる者を限定する適切なアクセス制限を行っていますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 24, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "電子メールの添付ファイルや本文中のURLを不用意に開かないよう、従業員に注意喚起していますか。", "taiou": "不審メールの見分け方・開封してしまった場合の報告手順を周知し、実例を用いた注意喚起を定期配信。", "ito": "従業員が不審メールを疑い、開かず報告する行動が定着しているか。", "risk_own": "添付・URL経由のマルウェア感染（Emotet型）が起き、報告されず被害が潜行する。", "risk_cli": "感染端末から取引先へ攻撃メールが再送され、加害者になる。", "daitai": "注意喚起に加え、マクロの既定無効化・添付の自動検疫等の技術設定で人依存を低減。", "shoseki": "注意喚起の配信記録、報告手順の掲示、報告実績の記録。"}, {"no": 25, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "電子メール送信時に宛先を確認する等、誤送信を防ぐ対策を実施していますか。", "taiou": "送信前の宛先確認ダイアログ・上長承認（重要情報添付時）・BCC強制等の誤送信対策ツールを導入し、運用ルールを周知。", "ito": "日常的に起きやすい誤送信への、仕組みによる予防策があるか。", "risk_own": "宛先間違い・全員返信・添付ミスによる情報漏えいが発生する（発生頻度の高い事故類型）。", "risk_cli": "取引先の情報・メールアドレスが無関係の第三者に送られる。", "daitai": "ツールなしでも、重要情報はメール添付でなく共有リンク（権限付き）で渡す運用に変えることでリスクを大幅低減。", "shoseki": "誤送信対策ツールの設定、メール取扱ルール、（発生時）事故報告書。"}, {"no": 26, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "重要情報を電子メール等で社外へ送る際に、暗号化やパスワード保護等の保護措置を講じていますか。", "taiou": "暗号化の適用場面・アルゴリズム基準・鍵の保管/更新ルールを規程化。ファイル送付はパスワード別送でなく共有リンク等を利用。", "ito": "暗号化が場当たりでなく、方式・鍵管理まで含めて統制されているか。", "risk_own": "弱い方式・不適切な鍵管理により、暗号化していても実質保護されない。", "risk_cli": "「暗号化済み」として預かった情報が実際には復元可能な状態で流出する。", "daitai": "詳細な規程が難しければ、OS・クラウド標準の暗号化機能に統一し設定基準のみ文書化。", "shoseki": "暗号化利用規程、鍵管理台帳・手順、暗号化方式の一覧。"}, {"no": 27, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "重要情報が記載された書類・記録媒体を机上に放置せず、施錠保管するルール（クリアデスク）がありますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 28, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "離席時にPCの画面をロックするルール（クリアスクリーン）を徹底していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 29, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "重要書類・記録媒体・機器を社外へ持ち出す際のルール（許可・記録・保護措置）を定めていますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 30, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "モバイル機器・記録媒体の紛失・盗難に備えた対策（暗号化、リモートワイプ等）を講じていますか。", "taiou": "紛失・盗難時の即時報告ルールを周知し、MDMによるリモートロック・ワイプを実施できる体制を整備。", "ito": "紛失・盗難の発生を前提に、被害を最小化する即応手段が準備されているか。", "risk_own": "発見・報告の遅れで不正利用・漏えいが拡大し、報告義務への対応も遅れる。", "risk_cli": "取引先情報を含む端末が第三者に利用され、被害が取引先に及ぶ。", "daitai": "MDMがなければ、OS標準の「デバイスを探す」機能の有効化＋暗号化で最低限を担保。", "shoseki": "紛失時対応手順書、MDMの設定・ワイプ実行記録、（発生時）インシデント報告書。"}, {"no": 31, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "重要書類・記録媒体を廃棄する際に、シュレッダー・データ消去等で復元できないように処理していますか。", "taiou": "書類はシュレッダー・溶解処理、機器・媒体は物理破壊または消去ソフトで処理し、廃棄証明書を取得・保管。", "ito": "不要になった情報が復元不能な形で確実に処分されているか（捨てたつもりの流出を防ぐ）。", "risk_own": "廃棄機器・書類からの情報流出（中古市場・ゴミからの復元）が発生する。", "risk_cli": "消去したはずの預託情報が廃棄経路から流出する。", "daitai": "専門業者を使わない場合も、暗号化消去や物理破壊（ドリル穿孔等）＋写真記録で代替可能。", "shoseki": "廃棄・消去規程、廃棄証明書（業者発行）、消去作業記録。"}, {"no": 32, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "SNS等への投稿に関するルールを定め、業務上の秘密や取引先情報を書き込まないよう周知していますか。", "taiou": "SNS利用ガイドライン（業務情報・取引先情報・写真投稿の禁止事項）を定め、事例ベースの注意喚起を実施。", "ito": "従業員の私的発信から業務情報が漏れない備えがあるか。", "risk_own": "投稿写真の背景・つぶやきから機密情報・内部情報が流出し、炎上リスクも生じる。", "risk_cli": "取引先名・案件情報がSNS経由で公開され、取引先の信用・戦略に影響する。", "daitai": "詳細ガイドラインが難しければ、「業務・取引先に関する投稿禁止」の単純ルール＋誓約書への組み込みで担保。", "shoseki": "SNS利用ガイドライン、教育・周知記録。"}, {"no": 33, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "最終退出者の施錠・記録等、事務所の無人時のセキュリティを確保していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 34, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "重要情報を、アクセス制限のある安全な場所（サーバの制限フォルダ・施錠保管庫等）に保管するルールを定めていますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 35, "cat": "3. 自社診断の観点：従業員としての対策", "ref": "自社診断", "q": "社外で公衆Wi-Fi等を利用する場合の接続ルール（VPN利用・重要情報の取扱禁止等）を定めていますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 36, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "情報セキュリティに関する教育・注意喚起を従業員（パート・アルバイト含む）に定期的に行っていますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 37, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "個人所有の端末（私物スマートフォン・PC等）の業務利用について、可否・条件のルールを定めていますか。", "taiou": "私物端末の業務利用を原則禁止、または許可制（MDM登録・画面ロック・業務データ分離を条件）として規程化。", "ito": "会社の管理が及ばない端末による情報の取扱いが、無秩序になっていないか。", "risk_own": "管理外端末経由の漏えい・マルウェア持ち込みが発生しても、検知・調査ができない。", "risk_cli": "取引先情報が私物端末・個人クラウドに保存され、管理範囲外で漏えいする。", "daitai": "全面許可・全面禁止が難しければ、メール閲覧のみ許可等の限定利用＋Webメールのダウンロード制限で補完。", "shoseki": "BYOD規程（許可条件）、許可端末の登録台帳、MDMの管理画面。"}, {"no": 38, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "重要情報の分類（機密区分）と、それに応じた取扱いルールを定めていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 39, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "従業員の入社・退職時に、秘密保持に関する誓約書の取得やアカウントの発行・削除を行っていますか。", "taiou": "人事イベント（入社・異動・退職）と連動したアカウント発行・変更・削除の申請フローを整備。退職日当日にアクセス権を停止。", "ito": "人の出入りに応じてアクセス権が漏れなく・遅滞なく更新される仕組みがあるか。", "risk_own": "退職者アカウントの放置が不正アクセス・内部不正の温床となる（実際の事故原因として頻出）。", "risk_cli": "退職者が取引先情報にアクセス可能な状態が残り、漏えい時は管理不備を問われる。", "daitai": "自動連携がなくても、人事部門から情シスへの通知ルール＋月次の棚卸で漏れを検知。", "shoseki": "アカウント管理手順書、発行・削除申請の記録、退職者アカウント停止の記録。"}, {"no": 40, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "取引先や業務委託先との間で、秘密保持に関する契約・取決めを交わしていますか。", "taiou": "全従業員（役員・派遣含む）から入社時に秘密保持誓約書を取得。退職時にも義務継続の確認書を取得。", "ito": "情報を扱う人に法的な守秘義務が課され、本人も認識しているか。", "risk_own": "退職者・従業員による情報持ち出しへの法的対抗手段が弱くなり、営業秘密の法的保護（不正競争防止法）も受けにくくなる。", "risk_cli": "預託情報が従業員経由で漏えいした際、責任追及・被害回復の根拠を欠く。", "daitai": "包括的な就業規則の守秘条項＋重要プロジェクト単位の個別誓約で補完。", "shoseki": "秘密保持誓約書（様式・取得済み一覧）、就業規則該当条項、退職時確認書。"}, {"no": 41, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "クラウドサービスを業務利用する際の選定基準・利用ルールを定めていますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 42, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "情報セキュリティ事故（ウイルス感染・情報漏えい・紛失等）が発生した場合の連絡体制・対応手順を定めていますか。", "taiou": "紛失・盗難時の即時報告ルールを周知し、MDMによるリモートロック・ワイプを実施できる体制を整備。", "ito": "紛失・盗難の発生を前提に、被害を最小化する即応手段が準備されているか。", "risk_own": "発見・報告の遅れで不正利用・漏えいが拡大し、報告義務への対応も遅れる。", "risk_cli": "取引先情報を含む端末が第三者に利用され、被害が取引先に及ぶ。", "daitai": "MDMがなければ、OS標準の「デバイスを探す」機能の有効化＋暗号化で最低限を担保。", "shoseki": "紛失時対応手順書、MDMの設定・ワイプ実行記録、（発生時）インシデント報告書。"}, {"no": 43, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "情報セキュリティに関する社内ルール（規程類）を定め、従業員に周知していますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 44, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "情報セキュリティ対策の状況を定期的に点検・見直ししていますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 45, "cat": "4. 自社診断の観点：組織としての対策", "ref": "自社診断", "q": "情報セキュリティの責任者・担当者を任命していますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 46, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報セキュリティ基本方針を策定し、社外にも公開していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 47, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "自社の情報資産を洗い出し、資産管理台帳を作成・更新していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 48, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報資産ごとに機密性・完全性・可用性の観点から重要度を評価していますか。", "taiou": "情報を「極秘・秘・社外秘・公開」等に区分する基準を定め、文書・ファイルに区分を表示。区分ごとの取扱ルールを規定。", "ito": "情報の重要度に応じたメリハリのある管理（重要なものほど厳格に）が仕組みとして存在するか。", "risk_own": "全情報が同列に扱われ、重要情報の保護が徹底されない一方で過剰管理のコストも発生。", "risk_cli": "取引先から預かった機密情報が一般情報と同じ扱いになり、必要な保護水準が適用されない。", "daitai": "全社展開前に、まず取引先預託情報・個人情報のみ「重要」と定義して厳格管理する2区分運用から開始。", "shoseki": "情報分類基準、分類ラベルの運用例（文書サンプル）、分類別取扱ルール。"}, {"no": 49, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "重要な情報資産について、脅威と脆弱性を踏まえたリスク値の算定（リスク分析）を実施していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 50, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "リスク分析の結果に基づき、対策の優先順位と対応計画を決めていますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 51, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報セキュリティ関連規程（アクセス管理、媒体管理、持ち出し等）を文書として整備していますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 52, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "規程類を年1回以上見直し、必要に応じて改訂していますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 53, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報セキュリティ対策の実施状況を自己点検・内部監査で確認していますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 54, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "点検・監査で見つかった不備の是正を計画的に実施していますか。", "taiou": "監査・点検・インシデントで見つかった不備に是正計画（担当・期限）を立て、完了確認まで管理表で追跡。", "ito": "見つかった問題が放置されず、確実に直り切る管理があるか。", "risk_own": "既知の不備が放置され、同じ指摘・同じ事故が繰り返される。", "risk_cli": "取引先監査での指摘事項が改善されず、取引継続の評価に影響する。", "daitai": "専用の仕組みがなくても、指摘事項一覧（Excel）と月次の進捗確認で十分機能する。", "shoseki": "是正処置管理表、完了報告・有効性確認の記録。"}, {"no": 55, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報セキュリティハンドブック等により、ルールを従業員に分かりやすく周知していますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 56, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報セキュリティ関連規程に、アカウント管理・バックアップ・ログ管理・教育等の管理項目を網羅的に定めていますか（付録：規程サンプル対応）。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 57, "cat": "5. 組織的な取り組み（実践編：ルール整備・リスク対応）", "ref": "実践編", "q": "情報の持ち出し・社外作業に関する規程を定め、承認・記録の手続を運用していますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 58, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "ファイアウォール・UTM等により、外部ネットワークとの通信を制御していますか。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 59, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "無線LANに強固な暗号化（WPA2以上）を設定し、来訪者用と業務用を分離していますか。", "taiou": "社内無線LANはWPA2/WPA3で暗号化し、推測されにくい認証情報を設定。来客用SSIDは業務ネットワークと分離。", "ito": "電波で届く範囲の第三者から社内ネットワークへの侵入・盗聴を防げる設定か。", "risk_own": "無線経由で社外から社内LANに侵入され、盗聴・不正アクセスを受ける。", "risk_cli": "無線経由の侵入から取引先情報へ到達される。", "daitai": "古い機器でWPA2非対応の場合は買い替えが原則。暫定はネットワーク分離と有線化。", "shoseki": "無線LAN設定書（暗号化方式・SSID構成）、ネットワーク構成図。"}, {"no": 60, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "重要なシステム・情報へのアクセス権限を業務上必要な者のみに限定していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 61, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "アクセス権限の付与・変更・削除の記録を残していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 62, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "重要なシステムのログ（アクセス記録等）を取得・保管していますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 63, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "テレワーク環境（VPN、持ち出しPC等）のセキュリティ対策を講じていますか。", "taiou": "テレワーク規程（VPN必須・公衆Wi-Fi禁止・家族との画面共有防止等）を定め、貸与端末のみで業務を許可。", "ito": "オフィス外の環境でも社内と同等の保護水準が維持される取り決めと技術的手当てがあるか。", "risk_own": "自宅・外出先の無防備な環境が侵入経路となり、のぞき見・家庭内共有機器経由の漏えいも起きる。", "risk_cli": "取引先情報が保護されていないネットワーク・環境で扱われる。", "daitai": "VDI・クラウドサービス化により端末にデータを残さない構成で環境リスクを低減。", "shoseki": "テレワーク規程、VPN利用記録、貸与端末一覧。"}, {"no": 64, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "ホームページ・公開サーバの脆弱性対策（更新・診断）を実施していますか。", "taiou": "CMS・プラグインの迅速な更新、管理画面のアクセス制限・MFA、改ざん検知ツール・WAFの導入を実施。", "ito": "会社の顔であるWebサイトが乗っ取り・改ざんされない管理体制か。", "risk_own": "サイト改ざんによるマルウェア配布・フィッシング踏み台化で、自社が加害者となり信用が失墜する。", "risk_cli": "改ざんされた自社サイト経由で取引先・顧客が感染する。", "daitai": "自社管理が難しければ、保守込みの制作会社契約・マネージドホスティングへの移行で運用リスクを移転。", "shoseki": "CMS更新記録、WAF・改ざん検知の設定、保守契約書。"}, {"no": 65, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "迷惑メール対策・フィッシング対策の仕組みを導入していますか。", "taiou": "迷惑メールフィルタ・添付ファイル検査を導入し、SPF/DKIM/DMARCを設定。なりすましメールの検知を強化。", "ito": "攻撃の最多経路であるメールについて、人の注意力に頼る前の技術的な防波堤があるか。", "risk_own": "大量のフィッシング・ウイルスメールが従業員に直接届き、開封事故の確率が高止まりする。", "risk_cli": "自社ドメインをかたるなりすましメールで取引先が攻撃される（DMARC未設定の場合）。", "daitai": "メールサービス標準の保護機能（Microsoft 365/Google Workspace）の有効化・設定強化から着手。", "shoseki": "メールセキュリティ製品の設定、SPF/DKIM/DMARCのDNSレコード、検疫ログ。"}, {"no": 66, "cat": "6. 技術的対策の実施状況", "ref": "実践編", "q": "外部から内部ネットワークへの不要な通信を遮断していますか（第4.0版追加観点）。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 67, "cat": "6-2. ウェブサイトの安全な運用（第4.0版追加観点）", "ref": "自社診断（4.0版追加）", "q": "自社ウェブサイトを安全に運用するための対策（CMS・プラグインの更新、管理画面の保護等）を実施していますか。", "taiou": "CMS・プラグインの迅速な更新、管理画面のアクセス制限・MFA、改ざん検知ツール・WAFの導入を実施。", "ito": "会社の顔であるWebサイトが乗っ取り・改ざんされない管理体制か。", "risk_own": "サイト改ざんによるマルウェア配布・フィッシング踏み台化で、自社が加害者となり信用が失墜する。", "risk_cli": "改ざんされた自社サイト経由で取引先・顧客が感染する。", "daitai": "自社管理が難しければ、保守込みの制作会社契約・マネージドホスティングへの移行で運用リスクを移転。", "shoseki": "CMS更新記録、WAF・改ざん検知の設定、保守契約書。"}, {"no": 68, "cat": "6-2. ウェブサイトの安全な運用（第4.0版追加観点）", "ref": "自社診断（4.0版追加）", "q": "ウェブサイトの改ざん・不正アクセスを検知する仕組み、または定期的な点検を行っていますか。", "taiou": "CMS・プラグインの迅速な更新、管理画面のアクセス制限・MFA、改ざん検知ツール・WAFの導入を実施。", "ito": "会社の顔であるWebサイトが乗っ取り・改ざんされない管理体制か。", "risk_own": "サイト改ざんによるマルウェア配布・フィッシング踏み台化で、自社が加害者となり信用が失墜する。", "risk_cli": "改ざんされた自社サイト経由で取引先・顧客が感染する。", "daitai": "自社管理が難しければ、保守込みの制作会社契約・マネージドホスティングへの移行で運用リスクを移転。", "shoseki": "CMS更新記録、WAF・改ざん検知の設定、保守契約書。"}, {"no": 69, "cat": "6-2. ウェブサイトの安全な運用（第4.0版追加観点）", "ref": "自社診断（4.0版追加）", "q": "ウェブサイトの構築・運用を外部に委託している場合、委託先のセキュリティ対策・保守範囲を確認していますか。", "taiou": "CMS・プラグインの迅速な更新、管理画面のアクセス制限・MFA、改ざん検知ツール・WAFの導入を実施。", "ito": "会社の顔であるWebサイトが乗っ取り・改ざんされない管理体制か。", "risk_own": "サイト改ざんによるマルウェア配布・フィッシング踏み台化で、自社が加害者となり信用が失墜する。", "risk_cli": "改ざんされた自社サイト経由で取引先・顧客が感染する。", "daitai": "自社管理が難しければ、保守込みの制作会社契約・マネージドホスティングへの移行で運用リスクを移転。", "shoseki": "CMS更新記録、WAF・改ざん検知の設定、保守契約書。"}, {"no": 70, "cat": "6-2. ウェブサイトの安全な運用（第4.0版追加観点）", "ref": "自社診断（4.0版追加）", "q": "問い合わせフォーム等で取得した個人情報の保護対策（暗号化送信・保存先の管理）を実施していますか。", "taiou": "CMS・プラグインの迅速な更新、管理画面のアクセス制限・MFA、改ざん検知ツール・WAFの導入を実施。", "ito": "会社の顔であるWebサイトが乗っ取り・改ざんされない管理体制か。", "risk_own": "サイト改ざんによるマルウェア配布・フィッシング踏み台化で、自社が加害者となり信用が失墜する。", "risk_cli": "改ざんされた自社サイト経由で取引先・顧客が感染する。", "daitai": "自社管理が難しければ、保守込みの制作会社契約・マネージドホスティングへの移行で運用リスクを移転。", "shoseki": "CMS更新記録、WAF・改ざん検知の設定、保守契約書。"}, {"no": 71, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "業務委託先の選定時に、情報セキュリティ対策の実施状況を確認していますか。", "taiou": "委託先選定時にセキュリティチェックシート・認証取得状況等で対策水準を評価し、基準を満たす先とのみ契約。", "ito": "情報を預ける相手の安全性を、契約前に確認する仕組みがあるか。", "risk_own": "対策の弱い委託先経由の漏えい（サプライチェーン事故）が発生し、委託元としての管理責任を問われる。", "risk_cli": "取引先から預かった情報を再委託先経由で漏えいさせ、契約違反となる。", "daitai": "詳細評価が難しければ、認証（ISMS・Pマーク）の有無確認＋簡易チェックリストで最低限を担保。", "shoseki": "委託先選定基準、評価記録（チェックシート回収結果）、委託先一覧。"}, {"no": 72, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "委託契約において、秘密保持・安全管理・再委託の制限・事故発生時の報告義務を定めていますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく契約上の義務として担保されているか。", "risk_own": "委託先事故の際に責任追及・損害回復の法的根拠を欠き、対応費用を自社で負担することになる。", "risk_cli": "取引先への責任（預託情報の保護義務）を委託先に連鎖させられず、履行できない。", "daitai": "既存契約の改定が難しければ、覚書・個別発注書へのセキュリティ条項追加で補完。", "shoseki": "委託契約書のセキュリティ条項（ひな形）、締結済み契約の管理台帳。"}, {"no": 73, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "委託先に預けた情報資産を把握し、委託終了時の返却・消去を確認していますか。", "taiou": "委託終了時に預託情報の返却または消去を求め、消去証明書の提出を契約で義務化。自社の預かり情報も同様に対応。", "ito": "取引が終わった後に情報が相手方に残り続けない仕組みがあるか。", "risk_own": "終了後に残存した情報が旧委託先から漏えいし、原因究明も困難になる。", "risk_cli": "取引終了後も取引先の情報を保持し続け、契約違反・漏えい源となる。", "daitai": "証明書取得が難しい場合、返却・消去の完了報告書（自己申告＋作業記録）で代替。", "shoseki": "消去証明書・返却受領書、契約の終了時条項、対応記録。"}, {"no": 74, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "委託先で情報セキュリティ事故が発生した場合の対応（報告経路・責任分担）を取り決めていますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく契約上の義務として担保されているか。", "risk_own": "委託先事故の際に責任追及・損害回復の法的根拠を欠き、対応費用を自社で負担することになる。", "risk_cli": "取引先への責任（預託情報の保護義務）を委託先に連鎖させられず、履行できない。", "daitai": "既存契約の改定が難しければ、覚書・個別発注書へのセキュリティ条項追加で補完。", "shoseki": "委託契約書のセキュリティ条項（ひな形）、締結済み契約の管理台帳。"}, {"no": 75, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "重要な委託先の対策状況を定期的に確認（チェックシート・監査等）していますか。", "taiou": "重要委託先に年1回のチェックシート提出・報告会を求め、重要度に応じて実地監査も実施。結果を契約継続判断に反映。", "ito": "契約時だけでなく、委託期間中も相手の対策水準が維持されているかを確認しているか。", "risk_own": "委託先の対策劣化・体制変化に気づかず、事故が起きて初めて把握することになる。", "risk_cli": "劣化した委託先経由で取引先の情報が漏えいする。", "daitai": "全委託先が難しければ、預託情報の重要度で層別し、重要先のみ年次確認・他は契約更新時確認とする。", "shoseki": "委託先評価の年次記録、監査報告書、委託先管理台帳（評価結果付き）。"}, {"no": 76, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編／実践編", "q": "自社が取引先から求められるセキュリティ要求事項を把握し、対応していますか。", "taiou": "事業に適用される法令・規制・契約上のセキュリティ要求事項（個情法・不競法・業法・取引先要求等）を一覧化し、対応状況を管理。", "ito": "守るべき法令・契約義務を組織として特定・追跡しているか（知らずに違反していないか）。", "risk_own": "法令・契約違反による処分・賠償・取引停止が発生する。", "risk_cli": "取引先との契約上のセキュリティ義務を認識しないまま不履行となる。", "daitai": "包括的な一覧が難しければ、個人情報保護法と主要取引先との契約条項の2点から着手。", "shoseki": "適用法令・要求事項一覧、対応状況の管理表、法務確認の記録。"}, {"no": 77, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編 3原則", "q": "サプライチェーン全体でのセキュリティ確保について、取引先と協力・情報共有する姿勢を示していますか。", "taiou": "委託先・調達先・利用サービスを含むサプライチェーン全体のリスクを整理し、重要度に応じた管理策（評価・契約・監視）を適用。", "ito": "自社だけでなく、つながる先を含めた全体でセキュリティを確保する視点があるか。", "risk_own": "取引網の弱点経由の攻撃（サプライチェーン攻撃）を受け、自社対策だけでは防げない事故が起きる。", "risk_cli": "自社がサプライチェーンの弱点となり、取引先全体へ被害を波及させる。", "daitai": "全体管理が難しければ、情報を預ける先・システム接続のある先に絞った管理から開始。", "shoseki": "サプライチェーンリスク管理方針、委託先・調達先の一覧と重要度評価、管理策の適用状況。"}, {"no": 78, "cat": "7. 委託時・取引先との関係における対策", "ref": "経営者編 3原則", "q": "自社のセキュリティ対策状況を、求めに応じて取引先へ説明できる資料を整備していますか。", "taiou": "セキュリティへの取り組み（体制・認証・主要対策）をWebサイト・会社案内・セキュリティホワイトペーパーで開示し、照会対応の窓口を明確化。", "ito": "ステークホルダーへの説明責任を果たし、取引先の確認負担を減らす姿勢があるか。", "risk_own": "取引先評価・入札のたびに個別対応が発生し、信頼獲得の機会も逃す。", "risk_cli": "取引先がリスク評価に必要な情報を得られず、取引判断が遅れる。", "daitai": "詳細開示が難しければ、認証取得状況と本チェックシートの標準回答集の整備から開始（トラストセンター型）。", "shoseki": "公開ページ・ホワイトペーパー、標準回答集、開示承認の記録。"}, {"no": 79, "cat": "8. 人材確保・教育の取り組み", "ref": "付録：人材ガイドブック", "q": "情報セキュリティを担当する人材（兼務含む）を明確にし、必要なスキル習得を支援していますか。", "taiou": "セキュリティ担当者（兼務含む）を指名し、外部研修・資格取得（情報処理安全確保支援士等）を支援。", "ito": "対策を実務として担える人材が組織内に確保・育成されているか。", "risk_own": "対策・インシデント対応が特定個人に依存し、退職・不在で機能不全となる（属人化リスク）。", "risk_cli": "専門的な対応（事故調査・取引先への技術的説明）ができず、対応品質が低下する。", "daitai": "外部SOC・MSS・顧問等の外部リソース活用で不足を補完し、内製は段階的に育成。", "shoseki": "育成計画、研修受講記録、資格保有者一覧、外部委託契約書。"}, {"no": 80, "cat": "8. 人材確保・教育の取り組み", "ref": "付録：人材ガイドブック", "q": "セキュリティ担当者に対し、外部研修・セミナー等の学習機会を提供していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 81, "cat": "8. 人材確保・教育の取り組み", "ref": "付録：人材ガイドブック", "q": "経営層自身も情報セキュリティに関する研修・情報収集を行っていますか。", "taiou": "情報セキュリティ委員会を四半期開催し、対策状況・インシデント・リスクを経営層へ定期報告。経営層が方針・投資を承認。", "ito": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 82, "cat": "8. 人材確保・教育の取り組み", "ref": "付録：人材ガイドブック", "q": "教育の実施記録（対象者・内容・日時）を保管していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 83, "cat": "8. 人材確保・教育の取り組み", "ref": "付録：人材ガイドブック", "q": "地域のセキュリティコミュニティや業界団体等からの情報を活用していますか。", "taiou": "業界ISAC・地域のセキュリティコミュニティ・IPAの枠組みに参加し、脅威情報の受領と（可能な範囲での）自社事例の共有を行う。", "ito": "脅威に社会全体で対抗する情報共有の輪に加わり、貢献もしているか。", "risk_own": "業界を狙う攻撃の予兆情報を得られず、単独での防御となる。", "risk_cli": "共有されていれば防げた攻撃が取引先へ波及する。", "daitai": "発信が難しければ、まず受け手としての参加（メーリングリスト購読・セミナー参加）から開始。", "shoseki": "参加団体・枠組みの一覧、参加記録、社内展開の記録。"}, {"no": 84, "cat": "9. 物理的対策の実施状況", "ref": "実践編", "q": "事務所・サーバ設置場所への部外者の立ち入りを制限していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 85, "cat": "9. 物理的対策の実施状況", "ref": "実践編", "q": "来訪者の受付・入退記録を残していますか。", "taiou": "来訪者は受付で記録し、入館証を貸与のうえ従業員が同行。無人での立ち入りを禁止。", "ito": "外部者の立ち入りが記録・管理され、単独行動できない運用があるか。", "risk_own": "来訪者を装った侵入・のぞき見・置き忘れ書類の持ち去りを防げない。", "risk_cli": "打合せエリア等で取引先関連情報が第三者の目に触れる。", "daitai": "受付システムがなければ、紙の来訪者記録簿＋同行ルールの徹底で十分機能する。", "shoseki": "来訪者受付記録、入館証管理簿、来訪者対応ルール。"}, {"no": 86, "cat": "9. 物理的対策の実施状況", "ref": "実践編", "q": "サーバ・ネットワーク機器を施錠された場所に設置していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 87, "cat": "9. 物理的対策の実施状況", "ref": "実践編", "q": "重要書類・媒体の保管庫の鍵を管理者が管理していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 88, "cat": "9. 物理的対策の実施状況", "ref": "実践編", "q": "停電・災害に備えた電源対策（UPS等）や設置環境の対策を講じていますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 89, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "利用中のクラウドサービスを一覧化して把握していますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 90, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "クラウドサービス選定時に、提供事業者の信頼性（認証取得、実績、約款等）を確認していますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 91, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "クラウドサービスに保存するデータの重要度に応じて、利用可否・取扱いを判断していますか。", "taiou": "情報を「極秘・秘・社外秘・公開」等に区分する基準を定め、文書・ファイルに区分を表示。区分ごとの取扱ルールを規定。", "ito": "情報の重要度に応じたメリハリのある管理（重要なものほど厳格に）が仕組みとして存在するか。", "risk_own": "全情報が同列に扱われ、重要情報の保護が徹底されない一方で過剰管理のコストも発生。", "risk_cli": "取引先から預かった機密情報が一般情報と同じ扱いになり、必要な保護水準が適用されない。", "daitai": "全社展開前に、まず取引先預託情報・個人情報のみ「重要」と定義して厳格管理する2区分運用から開始。", "shoseki": "情報分類基準、分類ラベルの運用例（文書サンプル）、分類別取扱ルール。"}, {"no": 92, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "クラウドサービスの管理者アカウントを適切に管理し、多要素認証を設定していますか。", "taiou": "管理者権限を必要最小限の担当者に限定し、通常業務は一般権限で実施。特権操作のログを取得し定期レビュー。", "ito": "システムを何でもできる強い権限が、限定・記録・監視されているか。", "risk_own": "特権アカウントの悪用・乗っ取りにより、システム全体の改ざん・破壊・証跡消去まで可能になる。", "risk_cli": "全預託データへの一括アクセスが可能なため、漏えい時の被害が最大化する。", "daitai": "特権管理ツールがなければ、特権IDの共有廃止・利用申請制・操作ログの手動点検で補完。", "shoseki": "特権ID一覧・保有者一覧、利用申請/承認記録、特権操作ログのレビュー記録。"}, {"no": 93, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "クラウドサービスの共有・公開設定を定期的に点検していますか。", "taiou": "クラウドストレージ・SaaSの共有設定を四半期ごとに点検し、全公開・無期限リンクを検出・是正。CSPM等の設定監査も活用。", "ito": "クラウドの設定ミス（意図せぬ公開）を定期的に発見・是正する運用があるか。", "risk_own": "設定ミスによる情報公開は近年最多の漏えい原因の一つで、放置期間だけ被害が拡大する。", "risk_cli": "取引先情報がインターネット上に公開状態で放置される。", "daitai": "ツールがなくても、公開リンクの棚卸・共有権限の定期レビューを手動チェックリストで実施。", "shoseki": "設定点検の記録（チェックリスト）、是正記録、CSPM/監査ツールのレポート。"}, {"no": 94, "cat": "10. クラウドサービス安全利用の取り組み", "ref": "付録：クラウド手引き", "q": "クラウドサービスの障害・終了に備えたデータのバックアップ・代替手段を検討していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 95, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "セキュリティインシデントを検知・発見した際の社内報告ルート（第一報の窓口）を全従業員に周知していますか。", "taiou": "「気づいたら30分以内に情シスへ」等の報告ルールと窓口（メール・電話・チャット）を全従業員に周知。報告者を非難しない方針を明示。", "ito": "従業員が異変に気づいた時、ためらわず・すぐに報告される文化と経路があるか。", "risk_own": "報告の遅れ・隠蔽により対応開始が遅れ、被害と法的リスクが拡大する。", "risk_cli": "預託情報に関わる事故の把握・通知が遅れる。", "daitai": "窓口一本化が難しければ、上長経由でも即日で情シスに届くエスカレーションルールを規定。", "shoseki": "報告ルールの周知資料（イントラ掲示等）、報告受付の記録、教育資料。"}, {"no": 96, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "インシデント対応の責任者と対応チームの役割を定めていますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 97, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "インシデントの種類（ウイルス感染、情報漏えい、ランサムウェア等）に応じた初動対応手順を整備していますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 98, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "被害拡大防止のためのネットワーク遮断・端末隔離等の判断基準を定めていますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 99, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "IPA・警察・所管官庁・取引先等、外部への報告・相談先を整理していますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", "shoseki": "報告・通知手順書、報告書式のひな形、（発生時）報告書控え。"}, {"no": 100, "cat": "11. インシデント対応・復旧への備え", "ref": "付録：インシデント対応手引き", "q": "個人情報漏えい時の個人情報保護委員会への報告・本人通知の手順を整備していますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", イトの安全な運用（第4.0版追加観点）", "7. 委託時・取引先との関係における対策", "8. 人材確保・教育の取り組み", "9. 物理的対策の実施状況", "10. クラウドサービス安全利用の取り組み", "11. インシデント対応・復旧への備え"]};

const ASPECTS = [
  {k:'ito',      label:'設問の意図',       desc:'「何が求められているのか」を当てる', stem:'この設問が確認しようとしている意図（何が求められているのか）として、最も適切なものはどれですか？'},
  {k:'risk_own', label:'自社へのリスク',   desc:'未実施の場合に自社に生じるリスクを当てる', stem:'この対策を実施していない場合に「自社」に生じるリスクとして、最も適切なものはどれですか？'},
  {k:'risk_cli', label:'取引先へのリスク', desc:'未実施の場合に取引先へ与えるリスクを当てる', stem:'この対策を実施していない場合に「取引先」へ与えるリスクとして、最も適切なものはどれですか？'},
  {k:'taiou',    label:'対策・回答例',     desc:'具体的な対応例（回答の書き方の軸）を当てる', stem:'この設問に対する具体的な対応例（回答例の軸となる取り組み）として、最も適切なものはどれですか？'},
  {k:'mix',      label:'ミックス',         desc:'上の4観点からランダムに出題', stem:''}
];

let selAspect='ito', selCats=new Set(DATA.cats), selOrd='seq', selCnt=0;
let queue=[], idx=0, score=0, results=[]; // results: {item, aspect, correct}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start screen ---------- */
$('totalItems').textContent=DATA.items.length;
const aspectBox=$('aspectBox');
ASPECTS.forEach(a=>{
  const b=document.createElement('button');
  b.className='mode-btn'+(a.k===selAspect?' sel':'');
  b.innerHTML='<b>'+a.label+'</b><span>'+a.desc+'</span>';
  b.onclick=()=>{selAspect=a.k;[...aspectBox.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();};
  aspectBox.appendChild(b);
});
const catBox=$('catBox');
DATA.cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip sel'; b.textContent=c.replace(/^\d+\.\s*/,'');
  b.onclick=()=>{ if(selCats.has(c)){selCats.delete(c);b.classList.remove('sel');} else {selCats.add(c);b.classList.add('sel');} updateInfo(); };
  catBox.appendChild(b);
});
$('chipAll').onclick=()=>{selCats=new Set(DATA.cats);[...catBox.children].forEach(c=>c.classList.add('sel'));updateInfo();};
$('chipNone').onclick=()=>{selCats.clear();[...catBox.children].forEach(c=>c.classList.remove('sel'));updateInfo();};
document.querySelectorAll('.ordChip').forEach(b=>b.onclick=()=>{selOrd=b.dataset.v;document.querySelectorAll('.ordChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
document.querySelectorAll('.cntChip').forEach(b=>b.onclick=()=>{selCnt=+b.dataset.v;document.querySelectorAll('.cntChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();});
function pool(){return DATA.items.filter(i=>selCats.has(i.cat));}
function updateInfo(){
  const n=pool().length, m=selCnt>0?Math.min(selCnt,n):n;
  $('startInfo').textContent='対象 '+n+' 問中 '+m+' 問を出題します';
  $('btnStart').disabled=n===0;
}
updateInfo();

/* ---------- question building ---------- */
function buildQueue(items){
  return items.map(it=>{
    const asp = selAspect==='mix' ? ASPECTS[Math.floor(Math.random()*4)].k : selAspect;
    return {item:it, aspect:asp};
  });
}
function makeOptions(q){
  const f=q.aspect, correct=q.item[f];
  const others=DATA.items.filter(i=>i!==q.item && i[f] && i[f]!==correct);
  const otherCat=others.filter(i=>i.cat!==q.item.cat);
  const src=otherCat.length>=3?otherCat:others;
  const picked=shuffle(src.slice()).slice(0,3).map(i=>i[f]);
  return shuffle([{t:correct,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- screens ---------- */
function show(id){['scrStart','scrQuiz','scrResult'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

$('btnStart').onclick=()=>{
  let items=pool();
  if(selOrd==='shuf') items=shuffle(items.slice()); else items=items.slice();
  if(selCnt>0){ items=(selOrd==='shuf'?items:shuffle(items.slice())).slice(0,selCnt); if(selOrd==='seq') items.sort((a,b)=>a.no-b.no); }
  queue=buildQueue(items); idx=0; score=0; results=[];
  startQuiz();
};
function startQuiz(){ $('qTotal').textContent=queue.length; $('qScore').textContent=0; show('scrQuiz'); render(); }

function render(){
  const q=queue[idx], asp=ASPECTS.find(a=>a.k===q.aspect);
  $('qPos').textContent=idx+1;
  $('pbar').style.width=(idx/queue.length*100)+'%';
  $('qMeta').innerHTML=
    '<span class="tag cat">'+esc(q.item.cat)+'</span>'+
    '<span class="tag asp">出題観点：'+asp.label+'</span>'+
    (q.item.ref?'<span class="tag ref">'+esc(DATA.refLabel)+'：'+esc(q.item.ref)+'</span>':'');
  $('qSetsumon').textContent='設問　'+q.item.q;
  $('qStem').textContent='Q'+(idx+1)+'. '+asp.stem;
  const opts=makeOptions(q), box=$('qOpts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mark">'+labels[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=()=>answer(b,o,opts,box);
    box.appendChild(b);
  });
  $('qJudge').classList.add('hidden');
  $('qExpl').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnNext').textContent = idx===queue.length-1 ? '結果を見る →' : '次の問題 →';
}

function answer(btn,opt,opts,box){
  [...box.children].forEach((b,i)=>{ b.disabled=true; if(opts[i].ok) b.classList.add('correct'); });
  if(!opt.ok) btn.classList.add('wrong');
  if(opt.ok) score++;
  $('qScore').textContent=score;
  results.push({item:queue[idx].item, aspect:queue[idx].aspect, correct:opt.ok});
  const j=$('qJudge');
  j.textContent=opt.ok?'○ 正解！':'× 不正解';
  j.className='judge '+(opt.ok?'ok':'ng');
  j.classList.remove('hidden');
  showExpl(queue[idx].item);
  $('btnNext').classList.remove('hidden');
}

function showExpl(it){
  const e=$('qExpl');
  e.innerHTML=
    '<div class="ex ito"><h4>💡 設問の意図（何が求められているのか）</h4><p>'+esc(it.ito)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（自社）</h4><p>'+esc(it.risk_own)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（取引先）</h4><p>'+esc(it.risk_cli)+'</p></div>'+
    '<div class="ex ans"><h4>✅ 具体的な対策・回答例</h4><p>'+esc(it.taiou)+'</p></div>'+
    (it.daitai?'<div class="ex alt"><h4>🔁 実施していない場合の代替策</h4><p>'+esc(it.daitai)+'</p></div>':'')+
    (it.shoseki?'<div class="ex ev"><h4>📎 証跡を求められた場合の資料例</h4><p>'+esc(it.shoseki)+'</p></div>':'');
  e.classList.remove('hidden');
}

$('btnNext').onclick=()=>{ idx++; if(idx>=queue.length) finish(); else render(); };
$('btnQuit').onclick=()=>{ if(results.length===0){show('scrStart');return;} finish(); };

function finish(){
  const n=results.length;
  $('pbar').style.width='100%';
  $('rScore').textContent=score+' / '+n+' 問正解';
  const pct=n?Math.round(score/n*100):0;
  $('rSub').textContent='正答率 '+pct+'%'+(pct===100?'　全問正解です！':pct>=80?'　あと少しで完璧です':'　解説を読み返して再挑戦しましょう');
  const byCat={};
  results.forEach(r=>{ const c=r.item.cat; byCat[c]=byCat[c]||{ok:0,n:0}; byCat[c].n++; if(r.correct) byCat[c].ok++; });
  const tb=$('rCats'); tb.innerHTML='';
  Object.keys(byCat).forEach(c=>{
    const v=byCat[c], p=Math.round(v.ok/v.n*100);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c)+'</td><td class="num">'+v.ok+'/'+v.n+'</td><td style="width:120px"><div class="bar"><i style="width:'+p+'%"></i></div></td>';
    tb.appendChild(tr);
  });
  $('btnRetryWrong').style.display = results.some(r=>!r.correct) ? '' : 'none';
  show('scrResult');
}
$('btnRetryWrong').onclick=()=>{
  const wrong=results.filter(r=>!r.correct);
  queue=wrong.map(r=>({item:r.item,aspect:r.aspect}));
  idx=0;score=0;results=[];
  startQuiz();
};
$('btnHome').onclick=()=>show('scrStart');
</script>
</body>
</html>
