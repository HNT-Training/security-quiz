<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セキュ問題集 ISO">
<meta name="theme-color" content="#7c3aed">
<title>ISO27001観点｜習熟問題集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --ng:#dc2626; --ng-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --sub:#9ca3af; --line:#374151;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --ok:#34d399; --ok-soft:#064e3b;
    --ng:#f87171; --ng-soft:#5f1e1e; --warn:#fbbf24; --warn-soft:#4a3b10;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.app{padding:18px 0 6px}
header.app h1{font-size:19px;font-weight:700}
header.app .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h2.sec{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode-btn{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn span{color:var(--sub);font-size:12px}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:12.5px;color:var(--sub)}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;border-radius:6px;padding:2.5px 8px;font-weight:600}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.asp{background:var(--warn-soft);color:var(--warn)}
.tag.ref{background:var(--line);color:var(--sub)}
.setsumon{font-size:15.5px;font-weight:700;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;transition:.15s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.judge{margin-top:14px;font-size:16px;font-weight:800}
.judge.ok{color:var(--ok)}
.judge.ng{color:var(--ng)}
/* explanation */
.expl{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ex h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex p{font-size:13.5px}
.ex.ito h4{color:var(--accent)}
.ex.risk h4{color:var(--ng)}
.ex.ans h4{color:var(--ok)}
.ex.alt h4{color:var(--warn)}
.ex.ev h4{color:var(--sub)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* result */
.score-big{font-size:42px;font-weight:800;text-align:center}
.score-sub{text-align:center;color:var(--sub);margin-bottom:16px}
table.catres{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.catres th,table.catres td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.catres td.num{text-align:right;white-space:nowrap}
.bar{background:var(--line);height:8px;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>ISO27001観点｜習熟問題集</h1>
    <div class="sub">セキュリティチェックシート（ISO/IEC 27001観点・網羅版） をもとに自動生成した4択演習（全 <span id="totalItems"></span> 問）。設問の意図・リスク・対策・回答例を学びます。</div>
  </header>

  <!-- START SCREEN -->
  <div id="scrStart">
    <div class="card">
      <h2 class="sec">1. 出題観点を選ぶ</h2>
      <div class="modes" id="aspectBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">2. 出題カテゴリを選ぶ（複数選択可）</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="chipAll">すべて選択</button>
        <button class="chip" id="chipNone">すべて解除</button>
      </div>
      <div class="chips" id="catBox"></div>
    </div>
    <div class="card">
      <h2 class="sec">3. 出題順・出題数</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ordChip sel" data-v="seq">項番どおり</button>
        <button class="chip ordChip" data-v="shuf">シャッフル</button>
      </div>
      <div class="row">
        <button class="chip cntChip sel" data-v="0">全問</button>
        <button class="chip cntChip" data-v="10">10問</button>
        <button class="chip cntChip" data-v="20">20問</button>
        <button class="chip cntChip" data-v="30">30問</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnStart">スタート</button>
      <span class="small" id="startInfo"></span>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="scrQuiz" class="hidden">
    <div class="topbar">
      <span class="pill">問題 <b id="qPos"></b> / <span id="qTotal"></span></span>
      <span class="pill">正解 <b id="qScore">0</b></span>
      <button class="btn ghost" id="btnQuit" style="padding:5px 14px;font-size:12.5px">中断して結果を見る</button>
    </div>
    <div class="progress"><i id="pbar" style="width:0%"></i></div>
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="setsumon" id="qSetsumon"></div>
      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="judge hidden" id="qJudge"></div>
      <div class="expl hidden" id="qExpl"></div>
      <div class="nav">
        <span></span>
        <button class="btn primary hidden" id="btnNext">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="scrResult" class="hidden">
    <div class="card">
      <div class="score-big" id="rScore"></div>
      <div class="score-sub" id="rSub"></div>
      <h2 class="sec">カテゴリ別の成績</h2>
      <table class="catres"><tbody id="rCats"></tbody></table>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="btnRetryWrong">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btnHome">最初の画面に戻る</button>
    </div>
  </div>

  <footer>学習用に自動生成された問題集です。選択肢の誤答は他の設問の解説文から引用しています。／ 出典: セキュリティチェックシート_ISO27001観点_網羅版_解説付き.xlsx</footer>
</div>

インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 10, "cat": "2. ISMS本文要求事項（第5章：リーダーシップ）", "ref": "5.2", "q": "トップマネジメントは、情報セキュリティ方針を確立し、組織内に伝達し、必要に応じて利害関係者が入手できるようにしていますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 11, "cat": "2. ISMS本文要求事項（第5章：リーダーシップ）", "ref": "5.3", "q": "ISMSに関連する役割の責任・権限を割り当て、組織内に伝達していますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 12, "cat": "3. ISMS本文要求事項（第6章：計画）", "ref": "6.1.1", "q": "ISMSの計画時に、取り組むべきリスクと機会を決定していますか。", "taiou": "ISO/IEC 27001認証を全社（または対象事業）で取得し、年次サーベイランス審査を受審。", "ito": "セキュリティマネジメントが第三者により客観的に検証されているか（または同等の仕組みが自主運用されているか）。", "risk_own": "対策水準を客観的に証明できず、取引条件・入札要件を満たせない場合がある。", "risk_cli": "取引先は個別に詳細確認を行う負担を負い、預託判断の根拠が弱くなる。", "daitai": "認証未取得でも、本チェックシートのような自己点検結果・内部監査結果の開示や、段階的な認証取得計画の提示で補完。", "shoseki": "認証登録証（範囲・有効期限）、適用宣言書、審査報告書。"}, {"no": 13, "cat": "3. ISMS本文要求事項（第6章：計画）", "ref": "6.1.2", "q": "情報セキュリティリスクアセスメントのプロセス（リスク基準・実施方法）を定め、適用していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメント るか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 19, "cat": "4. ISMS本文要求事項（第7章：支援）", "ref": "7.3", "q": "組織の管理下で働く人々に、情報セキュリティ方針・ISMSへの自らの貢献・違反した場合の影響を認識させていますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 20, "cat": "4. ISMS本文要求事項（第7章：支援）", "ref": "7.4", "q": "ISMSに関連する内部・外部のコミュニケーション（何を・いつ・誰と・どのように）を決定していますか。", "taiou": "ISO/IEC 27001認証を全社（または対象事業）で取得し、年次サーベイランス審査を受審。", "ito": "セキュリティマネジメントが第三者により客観的に検証されているか（または同等の仕組みが自主運用されているか）。", "risk_own": "対策水準を客観的に証明できず、取引条件・入札要件を満たせない場合がある。", "risk_cli": "取引先は個別に詳細確認を行う負担を負い、預託判断の根拠が弱くなる。", "daitai": "認証未取得でも、本チェックシートのような自己点検結果・内部監査結果の開示や、段階的な認証取得計画の提示で補完。", "shoseki": "認証登録証（範囲・有効期限）、適用宣言書、審査報告書。"}, {"no": 21, "cat": "4. ISMS本文要求事項（第7章：支援）", "ref": "7.5", "q": "ISMSが要求する文書化した情報を作成・更新し、適切に管理（承認・版管理・アクセス管理・保護）していますか。", "taiou": "契約書・重要記録の保存期間・保管方法（アクセス制限・バックアップ）を定め、改ざん・消失から保護。", "ito": "法的・業務上必要な記録が必要な期間、確実に参照できる状態で残るか。", "risk_own": "紛争・監査時に記録を提示できず、立証不能・法令違反となる。", "risk_cli": "取引先との契約・やり取りの記録を示せず、紛争解決が困難になる。", "daitai": "文書管理システムがなければ、重要記録の保管場所の一元化＋アクセス制限＋バックアップで担保。", "shoseki": "文書管理規程（保存期間表）、保管状況、アクセス権設定。"}, {"no": 22, "cat": "5. ISMS本文要求事項（第8章：運用）", "ref": "8.1", "q": "ISMSの要求事項を満たすためのプロセスを計画・実施・管理し、外部委託するプロセス・外部から提供される製品やサービスも管理していますか。", "taiou": "ISO/IEC 27001認証を全社（または対象事業）で取得し、年次サーベイランス審査を受審。", "ito": "セキュリティマネジメントが第三者により客観的に検証されているか（または同等の仕組みが自主運用されているか）。", "risk_own": "対策水準を客観的に証明できず、取引条件・入札要件を満たせない場合がある。", "risk_cli": "取引先は個別に詳細確認を行う負担を負い、預託判断の根拠が弱くなる。", "daitai": "認証未取得でも、本チェックシートのような自己点検結果・内部監査結果の開示や、段階的な認証取得計画の提示で補完。", "shoseki": "認証登録証（範囲・有効期限）、適用宣言書、審査報告書。"}, {"no": 23, "cat": "5. ISMS本文要求事項（第8章：運用）", "ref": "8.2", "q": "情報セキュリティリスクアセスメントを、あらかじめ定めた間隔で、または重大な変更の際に実施し、結果を文書化していますか。", "taiou": "情報資産台帳をもとに機密性・完全性・可用性の観点で年1回リスクアセスメントを実施し、リスク値と対応要否を決定。", "ito": "勘や場当たりでなく、リスクの大きさに基づいて対策の優先順位を決める仕組みがあるか。", "risk_own": "重大リスクの見落としや過剰投資が発生し、限られた資源が有効に使われない。", "risk_cli": "取引先の預託情報に関わるリスクが未評価のまま放置され、事故の未然防止が働かない。", "daitai": "IPAガイドライン付録のリスク分析シート等を用いた簡易アセスメントから開始する。", "shoseki": "リスクアセスメント手順書、リスク分析結果（リスク登録簿）、実施記録。"}, {"no": 24, "cat": "5. ISMS本文要求事項（第8章：運用）", "ref": "8.3", "q": "情報セキュリティリスク対応計画を実施し、結果を文書化していますか。", "taiou": "評価済みリスクごとに低減・回避・移転・受容を決定し、対応計画（担当・期限付き）を策定。残留リスクは経営層が承認。", "ito": "特定したリスクを放置せず、対応方針の意思決定と実行管理が行われているか。", "risk_own": "リスクが「把握しただけ」で終わり、既知のリスクが実際の事故として顕在化する。", "risk_cli": "既知の弱点が改善されないまま取引先の情報が扱われ続ける。", "daitai": "対応計画が未整備でも、重大リスク上位数件に絞った改善アクションリストの運用で実質を確保。", "shoseki": "リスク対応計画書、リスク登録簿（対応状況付き）、経営層の承認記録。"}, {"no": 25, "cat": "6. ISMS本文要求事項（第9章：パフォーマンス評価）", "ref": "9.1", "q": "情報セキュリティパフォーマンスとISMSの有効性を監視・測定・分析・評価していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 26, "cat": "6. ISMS本文要求事項（第9章：パフォーマンス評価）", "ref": "9.2", "q": "あらかじめ定めた間隔で内部監査を実施し、ISMSが要求事項に適合し、有効に実施・維持されているかを確認していますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 27, "cat": "6. ISMS本文要求事項（第9章：パフォーマンス評価）", "ref": "9.3", "q": "トップマネジメントによるマネジメントレビューを、あらかじめ定めた間隔で実施し、改善の機会・変更の必要性を決定していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 28, "cat": "7. ISMS本文要求事項（第10章：改善）", "ref": "10.1", "q": "ISMSの適切性・妥当性・有効性を継続的に改善していますか。", "taiou": "対策状況・インシデント・監査結果・KPI（教育受講率・パッチ適用率等）を年1回以上経営層がレビューし、次期計画に反映。", "ito": "セキュリティ活動が計画→実行→評価→改善のサイクルで継続的に良くなっているか。", "risk_own": "対策が導入時のまま陳腐化し、環境変化・新脅威に追従できない。", "risk_cli": "取引先の期待水準の変化に対応できず、継続取引の評価で不利になる。", "daitai": "正式なレビュー会議が難しければ、年度末の振り返り＋次年度計画の経営承認のみでもサイクルは回る。", "shoseki": "マネジメントレビュー議事録、KPI実績、年度計画・見直し記録。"}, {"no": 29, "cat": "7. ISMS本文要求事項（第10章：改善）", "ref": "10.2", "q": "不適合が発生した場合、是正処置（不適合への対処、原因の除去・再発防止）を実施し、その有効性をレビューしていますか。", "taiou": "インシデントごとに原因分析（技術・プロセス・人の観点）と再発防止策を文書化し、実施完了まで追跡。類似事例を教育に反映。", "ito": "同じ事故を繰り返さないための学習サイクルが回っているか。", "risk_own": "同種インシデントが再発し、対策の説得力・組織の信頼が失われる。", "risk_cli": "再発時、取引先への説明責任（前回の再発防止策の不履行）を問われる。", "daitai": "重大事象に限定した振り返り会＋改善アクションリストの運用から開始。", "shoseki": "インシデント報告書（原因分析・再発防止策）、対策実施のフォロー記録。"}, {"no": 30, "cat": "A.5 組織的管理策", "ref": "A.5.1", "q": "情報セキュリティのための方針群を定め、経営陣が承認し、従業員・関係者に周知していますか。", "taiou": "経営層承認の「情報セキュリティ基本方針」を制定し、社内周知のうえ自社Webサイトで公開。年1回見直し。", "ito": "セキュリティへの取り組みが経営としての意思決定に基づくものであり、対外的にも宣言されているか。", "risk_own": "対策が現場任せ・場当たり的になり、投資や優先順位の判断基準を欠く。取引先からの信頼評価でも不利になる。", "risk_cli": "委託元として、セキュリティ方針が不明確な会社に情報を預けること自体がリスクとなり、説明責任を果たせない。", "daitai": "IPA公開のひな形（基本方針サンプル）を利用した簡易な方針でも、経営層承認と周知があれば実質的に機能する。", "shoseki": "情報セキュリティ基本方針（制定日・承認者記載）、取締役会等の承認議事録、Webサイト掲載ページ。"}, {"no": 31, "cat": "A.5 組織的管理策", "ref": "A.5.2", "q": "情報セキュリティに関する役割と責任を定め、割り当てていますか。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 32, "cat": "A.5 組織的管理策", "ref": "A.5.3", "q": "相反する職務・責任範囲を分離していますか（職務の分離）。", "taiou": "CISO（情報セキュリティ最高責任者）を任命し、担当部門・各部門の役割分担を体制図・規程で明文化。", "ito": "誰がセキュリティに責任を持ち、何を決められるのかが明確で、組織として機能する体制があるか。", "risk_own": "インシデント時に指揮系統が不明確となり対応が遅延。平時も対策が推進されず放置される。", "risk_cli": "窓口・責任者が不明なため、取引先からの確認・連絡・事故時協力がスムーズに行えない。", "daitai": "専任者を置けない場合、兼務での責任者任命＋外部専門家（顧問・ベンダー）の支援体制で補完。", "shoseki": "体制図、任命書・職務分掌規程、役割分担表。"}, {"no": 33, "cat": "A.5 組織的管理策", "ref": "A.5.4", "q": "経営陣は、従業員に対して情報セキュリティの適用を要求し、支援していますか。", "taiou": "情報セキュリティ委員会を四半期開催し、対策状況・インシデント・リスクを経営層へ定期報告。経営層が方針・投資を承認。", "ito": "セキュリティが経営課題として扱われ、経営層が実質的に関与・意思決定しているか（現場任せになっていないか）。", "risk_own": "投資・体制の意思決定が遅れ、重大インシデント時にも経営判断が機能せず、対応の遅れ・ガバナンス責任の追及につながる。", "risk_cli": "全社的な対応が必要な事故時に意思決定が遅れ、取引先への報告・対応も遅延する。", "daitai": "専任組織がなくても、既存の経営会議の定例議題にセキュリティ報告を組み込むことで実質的に代替可能。", "shoseki": "経営会議・委員会の議事録（セキュリティ議題）、経営層への報告資料、方針・計画の承認記録。"}, {"no": 34, "cat": "A.5 組織的管理策", "ref": "A.5.5", "q": "関係当局（監督官庁・警察等）との連絡体制を確立していますか。", "taiou": "個人情報保護法に基づく個人情報保護委員会への報告（速報3〜5日・確報30日以内等）・本人通知の手順と判断フローを整備。", "ito": "法定の報告・通知義務を、期限内に適切に果たせる準備があるか。", "risk_own": "報告遅延・不備自体が法令違反となり、行政指導・公表による信用失墜が加わる。", "risk_cli": "取引先が自社の顧客対応（本人通知等）を行うための情報提供が遅れる。", "daitai": "ひな形（報告書式・通知文案）の事前準備と、法務・外部弁護士への相談経路の確保で実務を担保。", "shoseki": "報告・通知手順書、報告書式のひな形、（発生時）報告書控え。"}, {"no": 35, "cat": "A.5 組織的管理策", "ref": "A.5.6", "q": "セキュリティ専門組織・団体（JPCERT/CC、業界ISAC等）との連絡・情報収集の体制がありますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 36, "cat": "A.5 組織的管理策", "ref": "A.5.7", "q": "脅威インテリジェンス（脅威情報の収集・分析）を実施し、対策に活用していますか。", "taiou": "IPA・JPCERT/CCの注意喚起、製品ベンダーのアドバイザリを定期購読し、自社に影響する情報を対策に反映する担当を決定。", "ito": "新しい脅威・脆弱性の情報を組織として受け取り、対策に活かす仕組みがあるか。", "risk_own": "流行中の攻撃・緊急脆弱性への対応が遅れ、回避可能だった被害を受ける。", "risk_cli": "業界を狙う攻撃キャンペーンへの備えが遅れ、取引先へ波及する。", "daitai": "無償の公的情報源（IPA・JPCERT/CCメーリングリスト）の購読＋週次確認の運用だけでも大きく改善。", "shoseki": "情報収集源の一覧・担当者、社内展開の記録（周知メール等）、対応判断の記録。"}, {"no": 37, "cat": "A.5 組織的管理策", "ref": "A.5.8", "q": "プロジェクトの計画・実施時に情報セキュリティを組み込んでいますか。", "taiou": "新規プロジェクト・新サービス企画時にセキュリティ影響の確認（チェックリスト・レビュー会）を必須工程に組み込む。", "ito": "新しい取り組みが始まる時点でセキュリティが考慮される仕組みがあるか。", "risk_own": "リリース後に問題が発覚し、手戻り・事故・追加コストが発生する。", "risk_cli": "新サービス経由で取引先情報が不適切に扱われる。", "daitai": "重量級のプロセスが難しければ、企画承認時の簡易チェックリスト1枚から開始。", "shoseki": "プロジェクト管理規程（セキュリティレビュー工程）、レビュー実施記録。"}, {"no": 38, "cat": "A.5 組織的管理策", "ref": "A.5.9", "q": "情報およびその他の関連資産の目録（資産台帳）を作成し、維持していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 39, "cat": "A.5 組織的管理策", "ref": "A.5.10", "q": "情報および資産の許容される利用に関する規則（利用ルール）を定めていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 40, "cat": "A.5 組織的管理策", "ref": "A.5.11", "q": "退職・契約終了時に、貸与した資産の返却を確実に行う手続がありますか。", "taiou": "人事イベント（入社・異動・退職）と連動したアカウント発行・変更・削除の申請フローを整備。退職日当日にアクセス権を停止。", "ito": "人の出入りに応じてアクセス権が漏れなく・遅滞なく更新される仕組みがあるか。", "risk_own": "退職者アカウントの放置が不正アクセス・内部不正の温床となる（実際の事故原因として頻出）。", "risk_cli": "退職者が取引先情報にアクセス可能な状態が残り、漏えい時は管理不備を問われる。", "daitai": "自動連携がなくても、人事部門から情シスへの通知ルール＋月次の棚卸で漏れを検知。", "shoseki": "アカウント管理手順書、発行・削除申請の記録、退職者アカウント停止の記録。"}, {"no": 41, "cat": "A.5 組織的管理策", "ref": "A.5.12", "q": "情報を重要度に応じて分類する基準を定め、運用していますか。", "taiou": "情報を「極秘・秘・社外秘・公開」等に区分する基準を定め、文書・ファイルに区分を表示。区分ごとの取扱ルールを規定。", "ito": "情報の重要度に応じたメリハリのある管理（重要なものほど厳格に）が仕組みとして存在するか。", "risk_own": "全情報が同列に扱われ、重要情報の保護が徹底されない一方で過剰管理のコストも発生。", "risk_cli": "取引先から預かった機密情報が一般情報と同じ扱いになり、必要な保護水準が適用されない。", "daitai": "全社展開前に、まず取引先預託情報・個人情報のみ「重要」と定義して厳格管理する2区分運用から開始。", "shoseki": "情報分類基準、分類ラベルの運用例（文書サンプル）、分類別取扱ルール。"}, {"no": 42, "cat": "A.5 組織的管理策", "ref": "A.5.13", "q": "情報の分類に応じたラベル付け（機密表示等）を行っていますか。", "taiou": "情報を「極秘・秘・社外秘・公開」等に区分する基準を定め、文書・ファイルに区分を表示。区分ごとの取扱ルールを規定。", "ito": "情報の重要度に応じたメリハリのある管理（重要なものほど厳格に）が仕組みとして存在するか。", "risk_own": "全情報が同列に扱われ、重要情報の保護が徹底されない一方で過剰管理のコストも発生。", "risk_cli": "取引先から預かった機密情報が一般情報と同じ扱いになり、必要な保護水準が適用されない。", "daitai": "全社展開前に、まず取引先預託情報・個人情報のみ「重要」と定義して厳格管理する2区分運用から開始。", "shoseki": "情報分類基準、分類ラベルの運用例（文書サンプル）、分類別取扱ルール。"}, {"no": 43, "cat": "A.5 組織的管理策", "ref": "A.5.14", "q": "情報転送（メール・媒体・口頭等による社内外への受け渡し）のルールを定めていますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 44, "cat": "A.5 組織的管理策", "ref": "A.5.15", "q": "アクセス制御の方針を定め、情報および資産へのアクセスを制限していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 45, "cat": "A.5 組織的管理策", "ref": "A.5.16", "q": "利用者ID等の識別情報のライフサイクル（発行〜削除）を管理していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 46, "cat": "A.5 組織的管理策", "ref": "A.5.17", "q": "パスワード等の認証情報の割当て・管理・利用のルールを定めていますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 47, "cat": "A.5 組織的管理策", "ref": "A.5.18", "q": "アクセス権の付与・見直し・削除を、方針に基づき実施していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 48, "cat": "A.5 組織的管理策", "ref": "A.5.19", "q": "供給者（委託先・ベンダー）との関係における情報セキュリティ管理のプロセスを定めていますか。", "taiou": "委託先選定時にセキュリティチェックシート・認証取得状況等で対策水準を評価し、基準を満たす先とのみ契約。", "ito": "情報を預ける相手の安全性を、契約前に確認する仕組みがあるか。", "risk_own": "対策の弱い委託先経由の漏えい（サプライチェーン事故）が発生し、委託元としての管理責任を問われる。", "risk_cli": "取引先から預かった情報を再委託先経由で漏えいさせ、契約違反となる。", "daitai": "詳細評価が難しければ、認証（ISMS・Pマーク）の有無確認＋簡易チェックリストで最低限を担保。", "shoseki": "委託先選定基準、評価記録（チェックシート回収結果）、委託先一覧。"}, {"no": 49, "cat": "A.5 組織的管理策", "ref": "A.5.20", "q": "供給者との契約において、情報セキュリティ要求事項を合意していますか。", "taiou": "委託契約に秘密保持・安全管理措置・再委託の事前承認・事故時の報告義務・監査権・終了時の返却消去を明記。", "ito": "委託先への要求事項が「お願い」でなく契約上の義務として担保されているか。", "risk_own": "委託先事故の際に責任追及・損害回復の法的根拠を欠き、対応費用を自社で負担することになる。", "risk_cli": "取引先への責任（預託情報の保護義務）を委託先に連鎖させられず、履行できない。", "daitai": "既存契約の改定が難しければ、覚書・個別発注書へのセキュリティ条項追加で補完。", "shoseki": "委託契約書のセキュリティ条項（ひな形）、締結済み契約の管理台帳。"}, {"no": 50, "cat": "A.5 組織的管理策", "ref": "A.5.21", "q": "ICTサプライチェーン（再委託先・製品供給元を含む）のセキュリティリスクを管理していますか。", "taiou": "委託先・調達先・利用サービスを含むサプライチェーン全体のリスクを整理し、重要度に応じた管理策（評価・契約・監視）を適用。", "ito": "自社だけでなく、つながる先を含めた全体でセキュリティを確保する視点があるか。", "risk_own": "取引網の弱点経由の攻撃（サプライチェーン攻撃）を受け、自社対策だけでは防げない事故が起きる。", "risk_cli": "自社がサプライチェーンの弱点となり、取引先全体へ被害を波及させる。", "daitai": "全体管理が難しければ、情報を預ける先・システム接続のある先に絞った管理から開始。", "shoseki": "サプライチェーンリスク管理方針、委託先・調達先の一覧と重要度評価、管理策の適用状況。"}, {"no": 51, "cat": "A.5 組織的管理策", "ref": "A.5.22", "q": "供給者のサービス提供状況を定期的に監視・レビューし、変更を管理していますか。", "taiou": "重要委託先に年1回のチェックシート提出・報告会を求め、重要度に応じて実地監査も実施。結果を契約継続判断に反映。", "ito": "契約時だけでなく、委託期間中も相手の対策水準が維持されているかを確認しているか。", "risk_own": "委託先の対策劣化・体制変化に気づかず、事故が起きて初めて把握することになる。", "risk_cli": "劣化した委託先経由で取引先の情報が漏えいする。", "daitai": "全委託先が難しければ、預託情報の重要度で層別し、重要先のみ年次確認・他は契約更新時確認とする。", "shoseki": "委託先評価の年次記録、監査報告書、委託先管理台帳（評価結果付き）。"}, {"no": 52, "cat": "A.5 組織的管理策", "ref": "A.5.23", "q": "クラウドサービスの取得・利用・管理・終了に関する情報セキュリティのプロセスを定めていますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 53, "cat": "A.5 組織的管理策", "ref": "A.5.24", "q": "情報セキュリティインシデント管理の計画（体制・手順・役割）を準備していますか。", "taiou": "インシデント対応体制（責任者・CSIRT・連絡網）を整備し、夜間休日の連絡手段も確保。外部専門家の緊急連絡先も準備。", "ito": "事故発生時に「誰が指揮し、誰に連絡するか」が事前に決まっており、すぐ動けるか。", "risk_own": "初動の混乱・遅延により被害拡大・証拠喪失・報告遅延が連鎖する。", "risk_cli": "取引先への第一報が遅れ、取引先側の防御措置（パスワード変更等）も遅れる。", "daitai": "専任CSIRTがなくても、責任者＋情シス＋外部ベンダー緊急窓口の3点を明文化すれば初動は機能する。", "shoseki": "インシデント対応体制図・規程、緊急連絡網、外部委託契約（インシデント対応支援）。"}, {"no": 54, "cat": "A.5 組織的管理策", "ref": "A.5.25", "q": "情報セキュリティ事象を評価し、インシデントに該当するかを判断する基準・手順がありますか。", "taiou": "インシデントの重大度基準（影響範囲・情報種別・停止時間）を定め、レベルに応じた対応体制・経営層への報告基準を規定。", "ito": "事故の大きさを迅速に見極め、適切な体制・報告先につなぐ判断基準があるか。", "risk_own": "軽微な事象への過剰対応と重大事象の過小評価が混在し、経営報告も遅れる。", "risk_cli": "取引先に関わる重大事象が現場止まりとなり、通知判断が遅れる。", "daitai": "精緻な基準が難しければ、「個人情報・取引先情報が関わる場合は即時上位報告」の単純ルールから開始。", "shoseki": "重大度判定基準、エスカレーションフロー、判定記録。"}, {"no": 55, "cat": "A.5 組織的管理策", "ref": "A.5.26", "q": "情報セキュリティインシデントに、文書化した手順に基づき対応していますか。", "taiou": "検知→報告→初動（隔離・遮断）→調査→復旧→再発防止の手順書を整備し、インシデント種別ごとの初動判断基準を明記。", "ito": "緊急時に迷わず動ける具体的な手順が文書化されているか（人の記憶頼みでないか）。", "risk_own": "対応の抜け・誤り（証拠消去・遮断漏れ）により被害拡大・調査不能となる。", "risk_cli": "影響範囲の特定が遅れ、取引先への正確な報告ができない。", "daitai": "IPA「中小企業のためのセキュリティインシデント対応の手引き」等のひな形を自社向けに調整して整備。", "shoseki": "インシデント対応手順書、対応フロー図、（発生時）対応記録。"}, {"no": 56, "cat": "A.5 組織的管理策", "ref": "A.5.27", "q": "インシデントから得た教訓を分析し、再発防止・管理策の改善につなげていますか。", "taiou": "インシデントごとに原因分析（技術・プロセス・人の観点）と再発防止策を文書化し、実施完了まで追跡。類似事例を教育に反映。", "ito": "同じ事故を繰り返さないための学習サイクルが回っているか。", "risk_own": "同種インシデントが再発し、対策の説得力・組織の信頼が失われる。", "risk_cli": "再発時、取引先への説明責任（前回の再発防止策の不履行）を問われる。", "daitai": "重大事象に限定した振り返り会＋改善アクションリストの運用から開始。", "shoseki": "インシデント報告書（原因分析・再発防止策）、対策実施のフォロー記録。"}, {"no": 57, "cat": "A.5 組織的管理策", "ref": "A.5.28", "q": "インシデントに関する証拠（ログ・端末等）を特定・収集・保全する手順がありますか。", "taiou": "インシデント時のログ・端末の保全手順（電源断の判断・ディスクイメージ取得等)を定め、必要時は専門業者へ依頼できる体制を確保。", "ito": "事故調査・法的対応・保険請求に耐える証拠を壊さず残せるか。", "risk_own": "証拠が上書き・消失し、原因究明・責任範囲の立証・警察対応ができない。", "risk_cli": "取引先への影響有無を証拠に基づいて説明できない。", "daitai": "自社で困難なら、初動での「触らない・切らない・専門家に連絡」の原則周知と業者連絡先の確保のみでも有効。", "shoseki": "証拠保全手順書、フォレンジック業者との契約・連絡先、（発生時）保全記録。"}, {"no": 58, "cat": "A.5 組織的管理策", "ref": "A.5.29", "q": "事業の中断・阻害時にも情報セキュリティを維持する計画がありますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 59, "cat": "A.5 組織的管理策", "ref": "A.5.30", "q": "事業継続のためのICTの備え（ICT-BCP、復旧要件の定義等）を整備していますか。", "taiou": "サイバー攻撃・障害を想定したIT-BCPを策定し、重要システムの復旧優先順位・RTO/RPO・代替手段（手作業運用等）を定義。", "ito": "業務が止まった場合に「何を・どの順で・いつまでに」戻すかが事前に決まっているか。", "risk_own": "復旧が場当たりとなり停止が長期化、機会損失・信用低下が拡大する。", "risk_cli": "納品・サービス提供の停止が取引先の事業に波及し、供給責任を問われる。", "daitai": "全社BCPが重ければ、最重要業務1つに絞った復旧手順書＋バックアップ復元テストから開始。", "shoseki": "IT-BCP・復旧計画書、RTO/RPO定義表、復旧訓練の記録。"}, {"no": 60, "cat": "A.5 組織的管理策", "ref": "A.5.31", "q": "適用される法令・規制・契約上の要求事項を特定し、順守する手続を定めていますか。", "taiou": "事業に適用される法令・規制・契約上のセキュリティ要求事項（個情法・不競法・業法・取引先要求等）を一覧化し、対応状況を管理。", "ito": "守るべき法令・契約義務を組織として特定・追跡しているか（知らずに違反していないか）。", "risk_own": "法令・契約違反による処分・賠償・取引停止が発生する。", "risk_cli": "取引先との契約上のセキュリティ義務を認識しないまま不履行となる。", "daitai": "包括的な一覧が難しければ、個人情報保護法と主要取引先との契約条項の2点から着手。", "shoseki": "適用法令・要求事項一覧、対応状況の管理表、法務確認の記録。"}, {"no": 61, "cat": "A.5 組織的管理策", "ref": "A.5.32", "q": "知的財産権（ソフトウェアライセンス等）の保護に関する手続を実施していますか。", "taiou": "ソフトウェアライセンスを台帳管理し、インストール状況と保有数を年1回突合。違法コピーを禁止。", "ito": "ソフトウェアが正規ライセンスの範囲で利用され、法的リスクがないか。", "risk_own": "ライセンス違反による損害賠償・海賊版経由のマルウェア感染が発生する。", "risk_cli": "納品物・成果物に違法なソフトが関与し、取引先の法的リスクに波及する。", "daitai": "資産管理ツールがなければ、標準PC構成の統一＋インストール申請制で管理を簡素化。", "shoseki": "ライセンス管理台帳、購入証書、監査（突合）記録。"}, {"no": 62, "cat": "A.5 組織的管理策", "ref": "A.5.33", "q": "重要な記録を、消失・破壊・改ざん・不正アクセスから保護していますか。", "taiou": "契約書・重要記録の保存期間・保管方法（アクセス制限・バックアップ）を定め、改ざん・消失から保護。", "ito": "法的・業務上必要な記録が必要な期間、確実に参照できる状態で残るか。", "risk_own": "紛争・監査時に記録を提示できず、立証不能・法令違反となる。", "risk_cli": "取引先との契約・やり取りの記録を示せず、紛争解決が困難になる。", "daitai": "文書管理システムがなければ、重要記録の保管場所の一元化＋アクセス制限＋バックアップで担保。", "shoseki": "文書管理規程（保存期間表）、保管状況、アクセス権設定。"}, {"no": 63, "cat": "A.5 組織的管理策", "ref": "A.5.34", "q": "個人情報（PII）の保護に関する法令・規制上の要求事項を特定し、順守していますか。", "taiou": "個人情報保護規程を整備し、取扱状況の台帳（保有個人データ管理簿）を維持。安全管理措置・第三者提供・保存期間のルールを運用。", "ito": "個人情報保護法の求める安全管理措置・手続が、実務として運用されているか。", "risk_own": "法令違反による行政処分・損害賠償・漏えい時の報告義務違反が発生する。", "risk_cli": "取引先から預かった個人データの事故で、取引先自身が本人・当局対応を迫られる。", "daitai": "個人情報保護委員会公表のガイドライン・中小企業向けチェックリストに沿った最小限の体制から整備。", "shoseki": "個人情報保護規程、個人データ管理台帳、委託先監督の記録、社内点検記録。"}, {"no": 64, "cat": "A.5 組織的管理策", "ref": "A.5.35", "q": "情報セキュリティの取り組みについて、独立した立場によるレビュー（内部監査・外部監査）を定期的に受けていますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 65, "cat": "A.5 組織的管理策", "ref": "A.5.36", "q": "セキュリティ方針・規則・標準の順守状況を定期的にレビューしていますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}, {"no": 66, "cat": "A.5 組織的管理策", "ref": "A.5.37", "q": "情報処理設備の操作手順書を文書化し、必要な要員が利用できるようにしていますか。", "taiou": "基本方針の下位文書として対策基準・実施手順（アクセス管理規程、媒体管理規程等）を整備し、年1回見直し。", "ito": "方針を実行に移すための具体的なルールが文書化され、従業員が参照できる状態にあるか。", "risk_own": "ルールが暗黙知・属人化し、担当者交代や判断のばらつきで統制が崩れる。監査でも指摘対象となる。", "risk_cli": "預託情報の取扱いが担当者依存となり、一貫した保護水準を取引先に約束できない。", "daitai": "IPAの規程サンプル・ハンドブックひな形を流用した最小限の文書化から開始する。", "shoseki": "情報セキュリティ関連規程一覧、各規程の本文（版数・改定履歴付き）、周知記録。"}, {"no": 67, "cat": "A.6 人的管理策", "ref": "A.6.1", "q": "雇用前に、経歴等の確認（スクリーニング）を法令の範囲で実施していますか。", "taiou": "採用時に経歴・資格の確認（履歴書照合・卒業/資格証明書の確認）を法令の範囲で実施。", "ito": "情報を扱う人材の信頼性を、雇用前に組織として確認しているか。", "risk_own": "経歴詐称者・ハイリスク人材の採用により内部不正リスクが高まる。", "risk_cli": "重要情報を扱う担当者の信頼性を取引先に説明できない。", "daitai": "全員一律が難しければ、重要情報を扱う職務に限定した確認で補完。", "shoseki": "採用手続規程（確認項目）、確認実施のチェック記録。"}, {"no": 68, "cat": "A.6 人的管理策", "ref": "A.6.2", "q": "雇用契約において、情報セキュリティに関する従業員の責任を明記していますか。", "taiou": "全従業員（役員・派遣含む）から入社時に秘密保持誓約書を取得。退職時にも義務継続の確認書を取得。", "ito": "情報を扱う人に法的な守秘義務が課され、本人も認識しているか。", "risk_own": "退職者・従業員による情報持ち出しへの法的対抗手段が弱くなり、営業秘密の法的保護（不正競争防止法）も受けにくくなる。", "risk_cli": "預託情報が従業員経由で漏えいした際、責任追及・被害回復の根拠を欠く。", "daitai": "包括的な就業規則の守秘条項＋重要プロジェクト単位の個別誓約で補完。", "shoseki": "秘密保持誓約書（様式・取得済み一覧）、就業規則該当条項、退職時確認書。"}, {"no": 69, "cat": "A.6 人的管理策", "ref": "A.6.3", "q": "全従業員に対し、情報セキュリティの意識向上・教育・訓練を定期的に実施していますか。", "taiou": "年1回以上の全従業員向けセキュリティ教育（集合研修・eラーニング）と、入社時教育を実施。受講記録を保管。", "ito": "全従業員（雇用形態を問わず）がセキュリティの基本ルールと脅威を理解している状態を組織として維持しているか。", "risk_own": "従業員のミス・知識不足による事故（誤送信・不正サイトアクセス・ルール違反）が多発し、事故原因の大半を占める人的要因を放置することになる。", "risk_cli": "担当者の不注意により取引先から預かった情報の漏えい・誤送信が発生する。", "daitai": "外部のeラーニングサービスやIPA公開教材の利用、朝礼・社内報での注意喚起の記録化など簡易な方法でも代替可能。", "shoseki": "教育計画書、教材、受講記録（受講者名簿・受講率）、理解度テスト結果。"}, {"no": 70, "cat": "A.6 人的管理策", "ref": "A.6.4", "q": "情報セキュリティ違反を犯した従業員に対する懲戒手続を正式に定めていますか。", "taiou": "就業規則にセキュリティ違反時の懲戒条項を定め、違反時は事実確認のうえ手続に沿って処分。", "ito": "ルール違反に対する公式な処分手続が存在し、抑止力として機能しているか。", "risk_own": "違反が処分されず規律が緩み、重大な内部不正を抑止できない。", "risk_cli": "違反者への対応が場当たりになり、取引先への説明・再発防止の説得力を欠く。", "daitai": "独立した懲戒規程がなくても、就業規則の服務規律・懲戒条項への紐付けを明文化。", "shoseki": "就業規則・懲戒規程の該当条項、（発生時）処分記録。"}, {"no": 71, "cat": "A.6 人的管理策", "ref": "A.6.5", "q": "雇用の終了・変更後も有効な情報セキュリティ上の責任・義務を定め、本人に伝達していますか。", "taiou": "人事イベント（入社・異動・退職）と連動したアカウント発行・変更・削除の申請フローを整備。退職日当日にアクセス権を停止。", "ito": "人の出入りに応じてアクセス権が漏れなく・遅滞なく更新される仕組みがあるか。", "risk_own": "退職者アカウントの放置が不正アクセス・内部不正の温床となる（実際の事故原因として頻出）。", "risk_cli": "退職者が取引先情報にアクセス可能な状態が残り、漏えい時は管理不備を問われる。", "daitai": "自動連携がなくても、人事部門から情シスへの通知ルール＋月次の棚卸で漏れを検知。", "shoseki": "アカウント管理手順書、発行・削除申請の記録、退職者アカウント停止の記録。"}, {"no": 72, "cat": "A.6 人的管理策", "ref": "A.6.6", "q": "従業員・関係者と秘密保持契約（守秘義務契約）を締結していますか。", "taiou": "全従業員（役員・派遣含む）から入社時に秘密保持誓約書を取得。退職時にも義務継続の確認書を取得。", "ito": "情報を扱う人に法的な守秘義務が課され、本人も認識しているか。", "risk_own": "退職者・従業員による情報持ち出しへの法的対抗手段が弱くなり、営業秘密の法的保護（不正競争防止法）も受けにくくなる。", "risk_cli": "預託情報が従業員経由で漏えいした際、責任追及・被害回復の根拠を欠く。", "daitai": "包括的な就業規則の守秘条項＋重要プロジェクト単位の個別誓約で補完。", "shoseki": "秘密保持誓約書（様式・取得済み一覧）、就業規則該当条項、退職時確認書。"}, {"no": 73, "cat": "A.6 人的管理策", "ref": "A.6.7", "q": "リモートワーク時の情報保護のためのセキュリティ対策（環境・端末・通信）を講じていますか。", "taiou": "テレワーク規程（VPN必須・公衆Wi-Fi禁止・家族との画面共有防止等）を定め、貸与端末のみで業務を許可。", "ito": "オフィス外の環境でも社内と同等の保護水準が維持される取り決めと技術的手当てがあるか。", "risk_own": "自宅・外出先の無防備な環境が侵入経路となり、のぞき見・家庭内共有機器経由の漏えいも起きる。", "risk_cli": "取引先情報が保護されていないネットワーク・環境で扱われる。", "daitai": "VDI・クラウドサービス化により端末にデータを残さない構成で環境リスクを低減。", "shoseki": "テレワーク規程、VPN利用記録、貸与端末一覧。"}, {"no": 74, "cat": "A.6 人的管理策", "ref": "A.6.8", "q": "従業員が情報セキュリティ事象を速やかに報告できる仕組みを整備し、周知していますか。", "taiou": "「気づいたら30分以内に情シスへ」等の報告ルールと窓口（メール・電話・チャット）を全従業員に周知。報告者を非難しない方針を明示。", "ito": "従業員が異変に気づいた時、ためらわず・すぐに報告される文化と経路があるか。", "risk_own": "報告の遅れ・隠蔽により対応開始が遅れ、被害と法的リスクが拡大する。", "risk_cli": "預託情報に関わる事故の把握・通知が遅れる。", "daitai": "窓口一本化が難しければ、上長経由でも即日で情シスに届くエスカレーションルールを規定。", "shoseki": "報告ルールの周知資料（イントラ掲示等）、報告受付の記録、教育資料。"}, {"no": 75, "cat": "A.7 物理的管理策", "ref": "A.7.1", "q": "重要な情報・設備を保護するための物理的セキュリティ境界（区画分け）を定めていますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 76, "cat": "A.7 物理的管理策", "ref": "A.7.2", "q": "セキュリティ区画への物理的入退を制御していますか（入退室管理）。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 77, "cat": "A.7 物理的管理策", "ref": "A.7.3", "q": "オフィス・部屋・施設の物理的セキュリティを設計・実施していますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 78, "cat": "A.7 物理的管理策", "ref": "A.7.4", "q": "施設への不正な物理的アクセスを監視する仕組み（監視カメラ・警備等）がありますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 79, "cat": "A.7 物理的管理策", "ref": "A.7.5", "q": "自然災害・悪意ある攻撃・事故等の物理的・環境的脅威から施設を保護する対策を講じていますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 80, "cat": "A.7 物理的管理策", "ref": "A.7.6", "q": "セキュリティを保つべき領域（サーバ室等）での作業に関するルールを定めていますか。", "taiou": "執務エリア・サーバ室をICカードで入退管理し、入退記録を保管。サーバ室は入室権限者を限定。", "ito": "重要な情報・機器のある場所に、権限のない人が物理的に近づけない仕組みがあるか。", "risk_own": "部外者の侵入による機器・書類の盗難、不正機器の設置（盗聴・不正AP）を防げない。", "risk_cli": "取引先情報を含む書類・機器が物理的に持ち出される。", "daitai": "ICカード設備がなければ、施錠＋鍵管理台帳＋重要区画の限定で補完。", "shoseki": "入退室管理規程、入退室ログ、鍵管理台帳、サーバ室入室権限者一覧。"}, {"no": 81, "cat": "A.7 物理的管理策", "ref": "A.7.7", "q": "クリアデスク（書類・媒体の放置禁止）・クリアスクリーン（画面ロック）のルールを定め、運用していますか。", "taiou": "離席時の画面ロック（自動ロック10分以内）と、退社時の書類・媒体の施錠保管をルール化し、定期巡回で点検。", "ito": "離席・退社時に情報が放置されない習慣が、ルールと点検で維持されているか。", "risk_own": "内部者・来訪者によるのぞき見・持ち去りが容易になり、事故原因の特定も困難。", "risk_cli": "取引先の書類・画面上の情報が第三者の目に触れる。", "daitai": "自動画面ロックのシステム強制（グループポリシー）でルール依存を減らす。", "shoseki": "クリアデスク規程、点検・巡回記録、画面ロックのポリシー設定。"}, {"no": 82, "cat": "A.7 物理的管理策", "ref": "A.7.8", "q": "装置（サーバ・ネットワーク機器等）を、環境上の脅威や不正アクセスから保護される場所に設置していますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 83, "cat": "A.7 物理的管理策", "ref": "A.7.9", "q": "構外（社外・自宅等）にある資産のセキュリティ対策を講じていますか。", "taiou": "機器・書類の社外持ち出しを申請・記録制とし、持ち出しPCは暗号化・のぞき見防止フィルタを必須化。", "ito": "情報が社外に出る場面が把握・統制され、紛失・盗難に備えた保護があるか。", "risk_own": "持ち出し中の紛失・盗難・のぞき見による漏えいが発生し、何を持ち出していたか特定できない。", "risk_cli": "取引先情報が社外で紛失し、影響範囲の報告もできない。", "daitai": "申請制が重ければ、持ち出し可能情報の限定＋端末暗号化・リモートワイプの技術的担保を優先。", "shoseki": "持ち出し管理規程、持ち出し申請・記録、端末の暗号化設定一覧。"}, {"no": 84, "cat": "A.7 物理的管理策", "ref": "A.7.10", "q": "記憶媒体（USBメモリ・HDD等）のライフサイクル（取得・利用・輸送・廃棄）を管理していますか。", "taiou": "ハードウェア・ソフトウェア・情報資産の管理台帳を整備し、購入・廃棄の都度更新。年1回棚卸で実態と突合。", "ito": "守るべき対象（機器・ソフト・データ）を組織として漏れなく把握しているか。管理外資産がないか。", "risk_own": "管理外の機器・野良サーバが攻撃の侵入口となる。棚卸不能で紛失・不正にも気づけない。", "risk_cli": "取引先の情報がどこに保存されているか特定できず、事故時の影響範囲の報告・消去証明ができない。", "daitai": "資産管理ツール導入が難しければ、Excel台帳＋年1回の現物棚卸でも最低限機能する。", "shoseki": "資産管理台帳、棚卸実施記録、資産管理ツールの出力。"}, {"no": 85, "cat": "A.7 物理的管理策", "ref": "A.7.11", "q": "電力・空調・通信等のサポートユーティリティの障害に備えた保護（UPS・冗長化等）を実施していますか。", "taiou": "サーバ・NW機器をUPS・耐震ラックに設置し、空調・消火設備を整備。重要システムはデータセンター・クラウドを利用。", "ito": "災害・停電・環境障害でも重要な機器・データが守られる設置環境か。", "risk_own": "停電・災害による機器損傷でデータ喪失・長期の業務停止が発生する。", "risk_cli": "取引先向けサービス・納品が停止し、預託データが失われる。", "daitai": "自社設備の強化が難しければ、重要システムのクラウド・DC移行と遠隔バックアップで代替。", "shoseki": "設備仕様（UPS・空調・消火）、データセンター/クラウドの契約・SLA、設置環境の写真・点検記録。"}, {"no": 86, "cat": "A.7 物理的管理策", "ref": "A.7.12", "q": "電源・通信ケーブルを、傍受・損傷から保護していますか。", "taiou": "通信・電源ケーブルを床下・モール内に敷設し、配線図を管理。傍受・損傷を受けにくい経路とする。", "ito": "配線経由の傍受・断線事故への物理的な配慮があるか。", "risk_own": "断線による障害、不正タップによる盗聴のリスクが残る。", "risk_cli": "通信経由で取引先とのやり取りが傍受される。", "daitai": "敷設替えが難しければ、重要区間の暗号化通信の徹底で傍受リスクを補完。", "shoseki": "配線図、設備点検記録。"}, {"no": 87, "cat": "A.7 物理的管理策", "ref": "A.7.13", "q": "装置の保守を適切に実施し、可用性・完全性を維持していますか。", "taiou": "サーバ・NW機器の保守契約を締結し、メーカー推奨周期で点検・部品交換。保守記録を保管。", "ito": "機器の故障予防と、故障時に迅速に復旧できる体制があるか。", "risk_own": "機器故障による突発停止・データ喪失と、保守切れ機器の脆弱性放置が発生。", "risk_cli": "取引先向け業務が機器故障で停止する。", "daitai": "保守契約がない機器は、予備機の確保・クラウド移行で可用性を補完。", "shoseki": "保守契約書、点検・修理記録、機器一覧（保守期限付き）。"}, {"no": 88, "cat": "A.7 物理的管理策", "ref": "A.7.14", "q": "装置の処分・再利用の前に、記憶されたデータを確実に消去していますか。", "taiou": "書類はシュレッダー・溶解処理、機器・媒体は物理破壊または消去ソフトで処理し、廃棄証明書を取得・保管。", "ito": "不要になった情報が復元不能な形で確実に処分されているか（捨てたつもりの流出を防ぐ）。", "risk_own": "廃棄機器・書類からの情報流出（中古市場・ゴミからの復元）が発生する。", "risk_cli": "消去したはずの預託情報が廃棄経路から流出する。", "daitai": "専門業者を使わない場合も、暗号化消去や物理破壊（ドリル穿孔等）＋写真記録で代替可能。", "shoseki": "廃棄・消去規程、廃棄証明書（業者発行）、消去作業記録。"}, {"no": 89, "cat": "A.8 技術的管理策", "ref": "A.8.1", "q": "利用者エンドポイント機器（PC・スマートフォン等）に保存・処理される情報を保護していますか（暗号化・管理ツール等）。", "taiou": "業務端末を台帳・MDM/資産管理ツールで管理し、ディスク暗号化（BitLocker等）と自動画面ロックを全台に適用。", "ito": "持ち運ばれる端末が紛失・盗難されても情報が守られる状態に、全台漏れなくなっているか。", "risk_own": "端末紛失＝即情報漏えいとなり、報告義務・信用失墜に直結する。", "risk_cli": "端末内の取引先情報・個人情報が第三者の手に渡る。", "daitai": "MDM未導入なら、OS標準の暗号化機能の手動設定＋設定状況の台帳管理で補完。", "shoseki": "端末管理台帳、暗号化設定の適用状況一覧（MDM/資産管理ツールのレポート）、端末設定基準書。"}, {"no": 90, "cat": "A.8 技術的管理策", "ref": "A.8.2", "q": "特権的アクセス権（管理者権限）の割当てと利用を制限・管理していますか。", "taiou": "管理者権限を必要最小限の担当者に限定し、通常業務は一般権限で実施。特権操作のログを取得し定期レビュー。", "ito": "システムを何でもできる強い権限が、限定・記録・監視されているか。", "risk_own": "特権アカウントの悪用・乗っ取りにより、システム全体の改ざん・破壊・証跡消去まで可能になる。", "risk_cli": "全預託データへの一括アクセスが可能なため、漏えい時の被害が最大化する。", "daitai": "特権管理ツールがなければ、特権IDの共有廃止・利用申請制・操作ログの手動点検で補完。", "shoseki": "特権ID一覧・保有者一覧、利用申請/承認記録、特権操作ログのレビュー記録。"}, {"no": 91, "cat": "A.8 技術的管理策", "ref": "A.8.3", "q": "情報およびその他の資産へのアクセスを、アクセス制御方針に従って制限していますか。", "taiou": "部署・役割ごとのアクセス権限マトリクスを定め、業務上必要な範囲のみ付与。半期ごとに棚卸を実施。", "ito": "「必要な人が必要な情報にだけ」アクセスできる状態が、付与ルールと定期見直しで維持されているか。", "risk_own": "過剰権限の放置により内部不正・誤操作の影響範囲が拡大し、侵入時の横展開も容易になる。", "risk_cli": "担当外の従業員まで取引先情報にアクセスでき、漏えい経路の特定も困難になる。", "daitai": "細かな権限設計が難しければ、重要フォルダ・システムに限定した権限最小化と棚卸から開始。", "shoseki": "アクセス権限一覧（マトリクス）、権限申請・承認記録、棚卸実施記録。"}, {"no": 92, "cat": "A.8 技術的管理策", "ref": "A.8.4", "q": "ソースコード・開発ツール・ソフトウェアライブラリへのアクセスを適切に管理していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 93, "cat": "A.8 技術的管理策", "ref": "A.8.5", "q": "セキュリティを保った認証技術・手順（多要素認証等）を、アクセス制御方針に基づき実装していますか。", "taiou": "長く複雑なパスワード（例：12文字以上）・使い回し禁止をルール化し、システム側でポリシーを強制。初期パスワードは初回変更を必須化。", "ito": "推測・破られにくい認証情報の運用が、ルールとシステム設定の両面で担保されているか。", "risk_own": "パスワードリスト攻撃・総当たり攻撃により容易に侵入され、なりすましに気づけない。", "risk_cli": "侵入経由で預託情報が漏えいし、同じパスワードを使う他システムにも被害が波及する。", "daitai": "複雑性の強制が難しい場合、長いパスフレーズ＋MFA・ログイン監視で補完。パスワード管理ツールの導入も有効。", "shoseki": "パスワードポリシー規程、システムのポリシー設定画面、周知資料。"}, {"no": 94, "cat": "A.8 技術的管理策", "ref": "A.8.6", "q": "システム資源の容量・能力を監視し、必要量を確保していますか。", "taiou": "重要システムのリソース使用率を監視し、閾値超過で増強。可用性要件の高いシステムは冗長構成（クラスタ・複数AZ）を採用。", "ito": "需要増・障害があってもサービスを維持できる設計・監視があるか。", "risk_own": "リソース枯渇・単一障害点によるサービス停止が起きる。", "risk_cli": "取引先向けサービス・業務が停止し、納期・供給に影響する。", "daitai": "冗長化コストが難しければ、復旧手順の整備・バックアップからの迅速復元でRTOを短縮。", "shoseki": "監視設定・リソースレポート、冗長構成図、可用性要件定義書。"}, {"no": 95, "cat": "A.8 技術的管理策", "ref": "A.8.7", "q": "マルウェアに対する保護（対策ソフト・利用者への周知）を実施していますか。", "taiou": "全端末・サーバにウイルス対策ソフトを導入し定義を自動更新。加えてEDRで侵入後の不審挙動を検知・対応。", "ito": "既知マルウェアの防御と、すり抜けた攻撃の早期検知・対応の両面が全台に行き渡っているか。", "risk_own": "感染の見逃し・対応遅れによりランサムウェア被害・情報窃取が全社規模に拡大する。", "risk_cli": "感染端末から取引先へのウイルスメール送信・預託情報の窃取が起きる。", "daitai": "EDR未導入なら、OS標準のDefender活用＋ログ監視強化で段階的に補完。", "shoseki": "導入状況一覧（管理コンソールのレポート）、定義更新状況、検知・対応記録。"}, {"no": 96, "cat": "A.8 技術的管理策", "ref": "A.8.8", "q": "技術的脆弱性の情報を収集し、リスクに応じてパッチ適用等の対策を講じていますか。", "taiou": "OS・ソフトの更新を原則自動適用とし、サーバは月次パッチ計画で管理。重大脆弱性は緊急適用の判断基準を規定。", "ito": "既知の脆弱性が放置されず、危険度に応じた速度で解消される運用があるか。", "risk_own": "公表済み脆弱性を突く攻撃（既知の穴からの侵入）は最多の侵入原因であり、放置は事実上の無防備。", "risk_cli": "脆弱なシステム経由で預託情報が窃取される。", "daitai": "即時適用が難しいシステムは、ネットワーク分離・WAF・監視強化の緩和策を文書化して管理。", "shoseki": "パッチ管理手順、適用状況一覧（資産管理ツールのレポート）、緊急対応の記録。"}, {"no": 97, "cat": "A.8 技術的管理策", "ref": "A.8.9", "q": "ハードウェア・ソフトウェア・ネットワークのセキュリティ構成を確立し、管理していますか（構成管理）。", "taiou": "サーバ・端末・NW機器のセキュア設定基準（不要サービス停止・初期パスワード変更等）を定め、構築時チェックリストで確認。", "ito": "機器・システムが安全な設定で構築・維持され、設定の劣化を防ぐ管理があるか。", "risk_own": "初期設定・不要機能の放置が侵入口となる（初期パスワードのままの機器等）。", "risk_cli": "設定不備の機器経由で預託情報に到達される。", "daitai": "ベンダー・CISのハードニングガイドを流用した簡易チェックリストから開始。", "shoseki": "設定基準書（ハードニング基準）、構築時チェックリスト、設定監査の記録。"}, {"no": 98, "cat": "A.8 技術的管理策", "ref": "A.8.10", "q": "不要になった情報を、システム・機器・媒体から削除するルールを定めていますか。", "taiou": "書類はシュレッダー・溶解処理、機器・媒体は物理破壊または消去ソフトで処理し、廃棄証明書を取得・保管。", "ito": "不要になった情報が復元不能な形で確実に処分されているか（捨てたつもりの流出を防ぐ）。", "risk_own": "廃棄機器・書類からの情報流出（中古市場・ゴミからの復元）が発生する。", "risk_cli": "消去したはずの預託情報が廃棄経路から流出する。", "daitai": "専門業者を使わない場合も、暗号化消去や物理破壊（ドリル穿孔等）＋写真記録で代替可能。", "shoseki": "廃棄・消去規程、廃棄証明書（業者発行）、消去作業記録。"}, {"no": 99, "cat": "A.8 技術的管理策", "ref": "A.8.11", "q": "本番データを開発・テスト等で利用する際に、データマスキング等の保護を行っていますか。", "taiou": "本番・開発・テスト環境を分離し、アクセス権も分ける。テストには本番データを使わずマスキング・ダミーデータを使用。", "ito": "開発・テスト作業が本番サービスと本番データを危険にさらさない構造か。", "risk_own": "テストミスによる本番障害、保護の緩いテスト環境からの本番データ流出が起きる。", "risk_cli": "取引先の実データがテスト環境経由で漏えいする。", "daitai": "環境分離が不完全なら、まず本番データのテスト利用禁止（ダミーデータ整備）を先行。", "shoseki": "環境構成図、環境別アクセス権一覧、テストデータ作成手順。"}, {"no": 100, "cat": "A.8 技術的管理策", "ref": "A.8.12", "q": "データ漏えい防止の仕組み（DLP、外部送信の制御等）を適用していますか。", "taiou": "DLP機能（メール・エンドポイント・クラウド）で重要情報の外部送信を検知・ブロック。個人情報の大量送信にアラートを設定。", "ito": "重要情報が意図せず・不正に外へ出る動きを、仕組みで検知・阻止できるか。", "risk_own": "内部不正・誤操作による大量流出を人の注意だけで防ぐことになり、検知もできない。", "risk_cli": "預託情報の大量流出が阻止・検知されず、被害が最大化する。", "daitai": "DLP製品がなくても、外部送信可能な経路の限定（Webメール・外部ストレージのブロック）で流出経路自体を減らす。", "shoseki": "DLPポリシー設定、検知・対応記録、外部送信制御の設定一覧。"}, {"no": 101, "cat": "A.8 技術的管理策", "ref": "A.8.13", "q": "情報・ソフトウェア・システムのバックアップを方針に基づき取得し、定期的に検査していますか。", "taiou": "重要データを日次等で自動バックアップし、世代管理。1つはオフライン・別拠点・イミュータブル領域に保管（3-2-1ルール）。", "ito": "ランサムウェア・障害・災害でデータが失われても戻せる備えが、バックアップ自体の保護まで含めてあるか。", "risk_own": "ランサムウェアはバックアップも狙うため、オンライン一系統のみでは復旧不能となり身代金要求に直面する。", "risk_cli": "預託データの喪失・取引先向け業務の長期停止が発生する。", "daitai": "専用製品がなくても、クラウドストレージの世代管理・不変ストレージ機能の活用で実質的な保護が可能。", "shoseki": "バックアップ設計書（対象・頻度・世代・保管先）、取得ログ、リストアテスト記録。"}, {"no": 102, "cat": "A.8 技術的管理策", "ref": "A.8.14", "q": "重要な情報処理設備に、可用性要求を満たす冗長性を持たせていますか。", "taiou": "重要システムのリソース使用率を監視し、閾値超過で増強。可用性要件の高いシステムは冗長構成（クラスタ・複数AZ）を採用。", "ito": "需要増・障害があってもサービスを維持できる設計・監視があるか。", "risk_own": "リソース枯渇・単一障害点によるサービス停止が起きる。", "risk_cli": "取引先向けサービス・業務が停止し、納期・供給に影響する。", "daitai": "冗長化コストが難しければ、復旧手順の整備・バックアップからの迅速復元でRTOを短縮。", "shoseki": "監視設定・リソースレポート、冗長構成図、可用性要件定義書。"}, {"no": 103, "cat": "A.8 技術的管理策", "ref": "A.8.15", "q": "活動・例外・障害等のイベントを記録したログを取得し、保護・分析していますか。", "taiou": "サーバ・FW・重要システムのアクセスログ・操作ログを取得し、1年以上保管。改ざん防止のため別サーバに集約。", "ito": "「誰がいつ何をしたか」を事後に検証できる記録が、十分な期間・改ざんされない形で残るか。", "risk_own": "インシデント時に侵入経路・影響範囲を特定できず、復旧判断も報告義務の履行もできない。", "risk_cli": "預託情報が漏えいしたか否かを証明できず、取引先への報告が「不明」となる。", "daitai": "ログ基盤がなくても、まず重要サーバ・FWのログ保存期間の延長と定期的なバックアップから開始。", "shoseki": "ログ管理規程（対象・保管期間）、ログ保管状況（設定画面）、ログサンプル。"}, {"no": 104, "cat": "A.8 技術的管理策", "ref": "A.8.16", "q": "ネットワーク・システム・アプリケーションの異常な挙動を監視し、インシデントの兆候を評価していますか。", "taiou": "SIEM・監視サービス（SOC）で不審なログイン・大量データ転送等のアラートを設定し、検知時の対応手順を整備。", "ito": "記録を「取るだけ」でなく、異常をタイムリーに発見し対応につなげる監視があるか。", "risk_own": "侵入から発覚まで数か月を要し（潜伏期間の長期化）、被害が静かに拡大する。", "risk_cli": "預託情報の窃取に長期間気づかず、取引先への通知が大幅に遅れる。", "daitai": "SOC委託が難しければ、主要システムの失敗ログイン・管理者操作に絞ったアラート設定から開始。", "shoseki": "監視設計書（検知ルール）、SOC契約書、アラート対応記録。"}, {"no": 105, "cat": "A.8 技術的管理策", "ref": "A.8.17", "q": "組織内の情報処理システムのクロック（時刻）を標準時刻源に同期させていますか。", "taiou": "全サーバ・NW機器をNTPで標準時刻源に同期させる設定を統一。", "ito": "複数システムのログを突き合わせて調査できるよう、時刻が揃っているか。", "risk_own": "ログの時刻がずれ、インシデント調査で出来事の順序を再構成できない。", "risk_cli": "取引先への影響範囲・時系列の正確な報告ができない。", "daitai": "ドメイン環境なら標準の時刻同期階層の確認のみで対応可能。", "shoseki": "NTP設定（設定書・設定画面）、時刻同期構成図。"}, {"no": 106, "cat": "A.8 技術的管理策", "ref": "A.8.18", "q": "システム管理用の特権的ユーティリティプログラムの使用を制限・管理していますか。", "taiou": "管理者権限を必要最小限の担当者に限定し、通常業務は一般権限で実施。特権操作のログを取得し定期レビュー。", "ito": "システムを何でもできる強い権限が、限定・記録・監視されているか。", "risk_own": "特権アカウントの悪用・乗っ取りにより、システム全体の改ざん・破壊・証跡消去まで可能になる。", "risk_cli": "全預託データへの一括アクセスが可能なため、漏えい時の被害が最大化する。", "daitai": "特権管理ツールがなければ、特権IDの共有廃止・利用申請制・操作ログの手動点検で補完。", "shoseki": "特権ID一覧・保有者一覧、利用申請/承認記録、特権操作ログのレビュー記録。"}, {"no": 107, "cat": "A.8 技術的管理策", "ref": "A.8.19", "q": "運用システムへのソフトウェア導入を、手順に基づき安全に管理していますか。", "taiou": "サーバ・端末・NW機器のセキュア設定基準（不要サービス停止・初期パスワード変更等）を定め、構築時チェックリストで確認。", "ito": "機器・システムが安全な設定で構築・維持され、設定の劣化を防ぐ管理があるか。", "risk_own": "初期設定・不要機能の放置が侵入口となる（初期パスワードのままの機器等）。", "risk_cli": "設定不備の機器経由で預託情報に到達される。", "daitai": "ベンダー・CISのハードニングガイドを流用した簡易チェックリストから開始。", "shoseki": "設定基準書（ハードニング基準）、構築時チェックリスト、設定監査の記録。"}, {"no": 108, "cat": "A.8 技術的管理策", "ref": "A.8.20", "q": "ネットワークおよびネットワーク機器のセキュリティを確保し、管理していますか。", "taiou": "インターネット境界にFW/UTMを設置し、必要な通信のみ許可（デフォルト拒否）。ルールを定期見直しし、IPS・不正通信検知機能を有効化。", "ito": "外部からの不要・不正なアクセスが入口で遮断され、内部からの不審な通信も統制されているか。", "risk_own": "公開してはいけないサービスへの直接攻撃・侵入や、マルウェアの外部通信（C2通信）を止められない。", "risk_cli": "侵入した攻撃者の踏み台として取引先への攻撃・なりすましに悪用される。", "daitai": "専用機器が難しければ、ルータのフィルタ機能＋クラウド型セキュリティサービス（SASE等）で代替。", "shoseki": "FW/UTMの設定書（ルール一覧）、構成図、ルール見直しの記録。"}, {"no": 109, "cat": "A.8 技術的管理策", "ref": "A.8.21", "q": "ネットワークサービス（プロバイダ・クラウド接続等）のセキュリティ機能・サービスレベルを特定し、管理していますか。", "taiou": "クラウド利用の申請・承認手続と選定基準（認証取得状況・データ保管場所・SLA等）を定め、利用サービスを台帳管理。", "ito": "クラウドの採否が場当たりでなく、リスク評価に基づいて統制されているか。", "risk_own": "安全性不明のサービスに重要情報が保存され、事業者側の事故・突然のサービス終了に巻き込まれる。", "risk_cli": "預託情報が承認外の海外サービス等に保存され、契約・法令違反となる。", "daitai": "詳細評価が難しければ、主要な認証（ISMS/SOC2等）の取得有無と利用規約の確認をチェックリスト化して運用。", "shoseki": "クラウド利用規程・選定基準、利用サービス台帳、選定時の評価記録。"}, {"no": 110, "cat": "A.8 技術的管理策", "ref": "A.8.22", "q": "情報サービス・利用者・情報システムのグループごとにネットワークを分離していますか。", "taiou": "基幹システム・サーバ群・執務端末・来客用を別セグメントに分離し、セグメント間通信をFWで制御。", "ito": "侵入・感染が起きても被害が全社に広がらない構造（横展開の抑止）になっているか。", "risk_own": "1台の感染が全社に波及し、ランサムウェアの被害範囲・復旧期間が最大化する。", "risk_cli": "末端の感染から預託情報を持つサーバまで容易に到達される。", "daitai": "物理的な分離が難しければ、VLAN・重要サーバのアクセス制御リストで論理分離。", "shoseki": "ネットワーク構成図（セグメント設計）、FW/VLAN設定書。"}, {"no": 111, "cat": "A.8 技術的管理策", "ref": "A.8.23", "q": "悪意あるWebサイトへのアクセスを制限するWebフィルタリングを実施していますか。", "taiou": "URLフィルタリング（プロキシ・DNSフィルタ・エンドポイント製品）で悪性サイト・不適切カテゴリへのアクセスを遮断。", "ito": "悪性サイト経由のマルウェア感染・情報送信をシステム側で抑止しているか。", "risk_own": "フィッシングサイト・改ざんサイト閲覧による感染・認証情報窃取を利用者の注意力だけに依存することになる。", "risk_cli": "感染端末経由で取引先情報が外部送信される。", "daitai": "専用製品がなければ、無料のDNSフィルタサービスやブラウザのセーフブラウジング強制で最低限を担保。", "shoseki": "フィルタリング製品の設定・ポリシー、遮断ログ。"}, {"no": 112, "cat": "A.8 技術的管理策", "ref": "A.8.24", "q": "暗号の利用に関する方針（利用場面・アルゴリズム・鍵管理）を定め、実施していますか。", "taiou": "暗号化の適用場面・アルゴリズム基準・鍵の保管/更新ルールを規程化。ファイル送付はパスワード別送でなく共有リンク等を利用。", "ito": "暗号化が場当たりでなく、方式・鍵管理まで含めて統制されているか。", "risk_own": "弱い方式・不適切な鍵管理により、暗号化していても実質保護されない。", "risk_cli": "「暗号化済み」として預かった情報が実際には復元可能な状態で流出する。", "daitai": "詳細な規程が難しければ、OS・クラウド標準の暗号化機能に統一し設定基準のみ文書化。", "shoseki": "暗号化利用規程、鍵管理台帳・手順、暗号化方式の一覧。"}, {"no": 113, "cat": "A.8 技術的管理策", "ref": "A.8.25", "q": "セキュリティに配慮した開発のライフサイクルに関する規則を定めていますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 114, "cat": "A.8 技術的管理策", "ref": "A.8.26", "q": "アプリケーションの開発・取得時に、情報セキュリティ要求事項を特定・承認していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 115, "cat": "A.8 技術的管理策", "ref": "A.8.27", "q": "セキュリティに配慮したシステムアーキテクチャの原則を定め、開発に適用していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 116, "cat": "A.8 技術的管理策", "ref": "A.8.28", "q": "セキュアコーディングの原則をソフトウェア開発に適用していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 117, "cat": "A.8 技術的管理策", "ref": "A.8.29", "q": "開発・受入れの過程でセキュリティテストを定義し、実施していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 118, "cat": "A.8 技術的管理策", "ref": "A.8.30", "q": "外部委託による開発を、要求事項の明確化・成果物の確認等により管理・監視していますか。", "taiou": "開発規程にセキュリティ要件定義・設計レビュー・セキュアコーディング基準・受入時の脆弱性テストを組み込み、委託開発にも同水準を要求。", "ito": "システムが「作ってから守る」のでなく、企画・設計段階から安全に作られているか。", "risk_own": "後付け対策の高コスト化と、脆弱性を作り込んだままのリリースによる事故が発生する。", "risk_cli": "提供システム・納品物の脆弱性が取引先環境での事故につながる。", "daitai": "全面適用が難しければ、公開システム・重要システムに限定した設計レビューとリリース前診断から開始。", "shoseki": "開発セキュリティ規程・基準書、設計レビュー記録、脆弱性テスト報告書。"}, {"no": 119, "cat": "A.8 技術的管理策", "ref": "A.8.31", "q": "開発環境・テスト環境・本番環境を分離し、保護していますか。", "taiou": "本番・開発・テスト環境を分離し、アクセス権も分ける。テストには本番データを使わずマスキング・ダミーデータを使用。", "ito": "開発・テスト作業が本番サービスと本番データを危険にさらさない構造か。", "risk_own": "テストミスによる本番障害、保護の緩いテスト環境からの本番データ流出が起きる。", "risk_cli": "取引先の実データがテスト環境経由で漏えいする。", "daitai": "環境分離が不完全なら、まず本番データのテスト利用禁止（ダミーデータ整備）を先行。", "shoseki": "環境構成図、環境別アクセス権一覧、テストデータ作成手順。"}, {"no": 120, "cat": "A.8 技術的管理策", "ref": "A.8.32", "q": "情報処理設備・システムの変更を、変更管理手順に従って実施していますか。", "taiou": "システム変更を申請・影響評価・承認・記録のフローで管理し、緊急変更も事後承認を必須化。", "ito": "無断・無計画な変更による障害・セキュリティ低下を防ぐ統制があるか。", "risk_own": "変更起因の障害・設定ミスが多発し、原因追跡もできない。", "risk_cli": "変更ミスによる取引先向けサービス停止・データ破損が起きる。", "daitai": "重量級のフローが難しければ、変更記録簿＋重要システムのみ承認必須の簡易運用から開始。", "shoseki": "変更管理手順書、変更申請・承認記録、リリース記録。"}, {"no": 121, "cat": "A.8 技術的管理策", "ref": "A.8.33", "q": "テストに使用する情報（テストデータ）を適切に選定・保護・管理していますか。", "taiou": "本番・開発・テスト環境を分離し、アクセス権も分ける。テストには本番データを使わずマスキング・ダミーデータを使用。", "ito": "開発・テスト作業が本番サービスと本番データを危険にさらさない構造か。", "risk_own": "テストミスによる本番障害、保護の緩いテスト環境からの本番データ流出が起きる。", "risk_cli": "取引先の実データがテスト環境経由で漏えいする。", "daitai": "環境分離が不完全なら、まず本番データのテスト利用禁止（ダミーデータ整備）を先行。", "shoseki": "環境構成図、環境別アクセス権一覧、テストデータ作成手順。"}, {"no": 122, "cat": "A.8 技術的管理策", "ref": "A.8.34", "q": "監査・検証活動の際に、本番システムへの影響を最小化する計画・合意をしていますか。", "taiou": "年1回の内部監査（または部門横断の相互点検）でルールの遵守状況・対策の実施状況を確認し、指摘に是正期限を設定。", "ito": "対策が「決めた通りに動いているか」を自ら検証する仕組みがあるか。", "risk_own": "形骸化した対策に気づかず、「やっているつもり」のまま事故に至る。", "risk_cli": "取引先に申告した対策水準と実態が乖離し、事故時に虚偽と評価されるリスクがある。", "daitai": "独立監査が難しければ、本チェックシートのような自己点検＋他部門クロスチェックで代替。", "shoseki": "監査計画・監査報告書、指摘事項管理表、是正完了の記録。"}], "cats": ["0. ISMS・認証の取得状況", "1. ISMS本文要求事項（第4章：組織の状況）", "2. ISMS本文要求事項（第5章：リーダーシップ）", "3. ISMS本文要求事項（第6章：計画）", "4. ISMS本文要求事項（第7章：支援）", "5. ISMS本文要求事項（第8章：運用）", "6. ISMS本文要求事項（第9章：パフォーマンス評価）", "7. ISMS本文要求事項（第10章：改善）", "A.5 組織的管理策", "A.6 人的管理策", "A.7 物理的管理策", "A.8 技術的管理策"]};

  {k:'risk_own', label:'自社へのリスク',   desc:'未実施の場合に自社に生じるリスクを当てる', stem:'この対策を実施していない場合に「自社」に生じるリスクとして、最も適切なものはどれですか？'},
  {k:'risk_cli', label:'取引先へのリスク', desc:'未実施の場合に取引先へ与えるリスクを当てる', stem:'この対策を実施していない場合に「取引先」へ与えるリスクとして、最も適切なものはどれですか？'},
  {k:'taiou',    label:'対策・回答例',     desc:'具体的な対応例（回答の書き方の軸）を当てる', stem:'この設問に対する具体的な対応例（回答例の軸となる取り組み）として、最も適切なものはどれですか？'},
  {k:'mix',      label:'ミックス',         desc:'上の4観点からランダムに出題', stem:''}
];

let selAspect='ito', selCats=new Set(DATA.cats), selOrd='seq', selCnt=0;
let queue=[], idx=0, score=0, results=[]; // results: {item, aspect, correct}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start screen ---------- */
$('totalItems').textContent=DATA.items.length;
const aspectBox=$('aspectBox');
ASPECTS.forEach(a=>{
  const b=document.createElement('button');
  b.className='mode-btn'+(a.k===selAspect?' sel':'');
  b.innerHTML='<b>'+a.label+'</b><span>'+a.desc+'</span>';
  b.onclick=()=>{selAspect=a.k;[...aspectBox.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();};
  aspectBox.appendChild(b);
});
const catBox=$('catBox');
DATA.cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip sel'; b.textContent=c.replace(/^\d+\.\s*/,'');
  b.onclick=()=>{ if(selCats.has(c)){selCats.delete(c);b.classList.remove('sel');} else {selCats.add(c);b.classList.add('sel');} updateInfo(); };
  catBox.appendChild(b);
});
$('chipAll').onclick=()=>{selCats=new Set(DATA.cats);[...catBox.children].forEach(c=>c.classList.add('sel'));updateInfo();};
$('chipNone').onclick=()=>{selCats.clear();[...catBox.children].forEach(c=>c.classList.remove('sel'));updateInfo();};
document.querySelectorAll('.ordChip').forEach(b=>b.onclick=()=>{selOrd=b.dataset.v;document.querySelectorAll('.ordChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
document.querySelectorAll('.cntChip').forEach(b=>b.onclick=()=>{selCnt=+b.dataset.v;document.querySelectorAll('.cntChip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');updateInfo();});
function pool(){return DATA.items.filter(i=>selCats.has(i.cat));}
function updateInfo(){
  const n=pool().length, m=selCnt>0?Math.min(selCnt,n):n;
  $('startInfo').textContent='対象 '+n+' 問中 '+m+' 問を出題します';
  $('btnStart').disabled=n===0;
}
updateInfo();

/* ---------- question building ---------- */
function buildQueue(items){
  return items.map(it=>{
    const asp = selAspect==='mix' ? ASPECTS[Math.floor(Math.random()*4)].k : selAspect;
    return {item:it, aspect:asp};
  });
}
function makeOptions(q){
  const f=q.aspect, correct=q.item[f];
  const others=DATA.items.filter(i=>i!==q.item && i[f] && i[f]!==correct);
  const otherCat=others.filter(i=>i.cat!==q.item.cat);
  const src=otherCat.length>=3?otherCat:others;
  const picked=shuffle(src.slice()).slice(0,3).map(i=>i[f]);
  return shuffle([{t:correct,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- screens ---------- */
function show(id){['scrStart','scrQuiz','scrResult'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

$('btnStart').onclick=()=>{
  let items=pool();
  if(selOrd==='shuf') items=shuffle(items.slice()); else items=items.slice();
  if(selCnt>0){ items=(selOrd==='shuf'?items:shuffle(items.slice())).slice(0,selCnt); if(selOrd==='seq') items.sort((a,b)=>a.no-b.no); }
  queue=buildQueue(items); idx=0; score=0; results=[];
  startQuiz();
};
function startQuiz(){ $('qTotal').textContent=queue.length; $('qScore').textContent=0; show('scrQuiz'); render(); }

function render(){
  const q=queue[idx], asp=ASPECTS.find(a=>a.k===q.aspect);
  $('qPos').textContent=idx+1;
  $('pbar').style.width=(idx/queue.length*100)+'%';
  $('qMeta').innerHTML=
    '<span class="tag cat">'+esc(q.item.cat)+'</span>'+
    '<span class="tag asp">出題観点：'+asp.label+'</span>'+
    (q.item.ref?'<span class="tag ref">'+esc(DATA.refLabel)+'：'+esc(q.item.ref)+'</span>':'');
  $('qSetsumon').textContent='設問　'+q.item.q;
  $('qStem').textContent='Q'+(idx+1)+'. '+asp.stem;
  const opts=makeOptions(q), box=$('qOpts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mark">'+labels[i]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=()=>answer(b,o,opts,box);
    box.appendChild(b);
  });
  $('qJudge').classList.add('hidden');
  $('qExpl').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnNext').textContent = idx===queue.length-1 ? '結果を見る →' : '次の問題 →';
}

function answer(btn,opt,opts,box){
  [...box.children].forEach((b,i)=>{ b.disabled=true; if(opts[i].ok) b.classList.add('correct'); });
  if(!opt.ok) btn.classList.add('wrong');
  if(opt.ok) score++;
  $('qScore').textContent=score;
  results.push({item:queue[idx].item, aspect:queue[idx].aspect, correct:opt.ok});
  const j=$('qJudge');
  j.textContent=opt.ok?'○ 正解！':'× 不正解';
  j.className='judge '+(opt.ok?'ok':'ng');
  j.classList.remove('hidden');
  showExpl(queue[idx].item);
  $('btnNext').classList.remove('hidden');
}

function showExpl(it){
  const e=$('qExpl');
  e.innerHTML=
    '<div class="ex ito"><h4>💡 設問の意図（何が求められているのか）</h4><p>'+esc(it.ito)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（自社）</h4><p>'+esc(it.risk_own)+'</p></div>'+
    '<div class="ex risk"><h4>⚠️ 実施しない場合のリスク（取引先）</h4><p>'+esc(it.risk_cli)+'</p></div>'+
    '<div class="ex ans"><h4>✅ 具体的な対策・回答例</h4><p>'+esc(it.taiou)+'</p></div>'+
    (it.daitai?'<div class="ex alt"><h4>🔁 実施していない場合の代替策</h4><p>'+esc(it.daitai)+'</p></div>':'')+
    (it.shoseki?'<div class="ex ev"><h4>📎 証跡を求められた場合の資料例</h4><p>'+esc(it.shoseki)+'</p></div>':'');
  e.classList.remove('hidden');
}

$('btnNext').onclick=()=>{ idx++; if(idx>=queue.length) finish(); else render(); };
$('btnQuit').onclick=()=>{ if(results.length===0){show('scrStart');return;} finish(); };

function finish(){
  const n=results.length;
  $('pbar').style.width='100%';
  $('rScore').textContent=score+' / '+n+' 問正解';
  const pct=n?Math.round(score/n*100):0;
  $('rSub').textContent='正答率 '+pct+'%'+(pct===100?'　全問正解です！':pct>=80?'　あと少しで完璧です':'　解説を読み返して再挑戦しましょう');
  const byCat={};
  results.forEach(r=>{ const c=r.item.cat; byCat[c]=byCat[c]||{ok:0,n:0}; byCat[c].n++; if(r.correct) byCat[c].ok++; });
  const tb=$('rCats'); tb.innerHTML='';
  Object.keys(byCat).forEach(c=>{
    const v=byCat[c], p=Math.round(v.ok/v.n*100);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c)+'</td><td class="num">'+v.ok+'/'+v.n+'</td><td style="width:120px"><div class="bar"><i style="width:'+p+'%"></i></div></td>';
    tb.appendChild(tr);
  });
  $('btnRetryWrong').style.display = results.some(r=>!r.correct) ? '' : 'none';
  show('scrResult');
}
$('btnRetryWrong').onclick=()=>{
  const wrong=results.filter(r=>!r.correct);
  queue=wrong.map(r=>({item:r.item,aspect:r.aspect}));
  idx=0;score=0;results=[];
  startQuiz();
};
$('btnHome').onclick=()=>show('scrStart');
</script>
</body>
</html>
